function uxPrepare(){S.settings??={};S.settings.ux??={};const u=S.settings.ux;u.id??=uid();u.favorites=Array.isArray(u.favorites)?u.favorites:[];u.audit=Array.isArray(u.audit)?u.audit.slice(0,100):[];u.cover= safeImage(u.cover)||'';for(const c of S.worldBook.chapters)c.uxid??=uid();return u}
function uxRecords(includeArchived=false){const rows=[];const add=(k,x,name,desc='',allowed=true,id=x.id)=>{if(!allowed||(!includeArchived&&x.archived)||player&&x.archived||typeof id!=='string')return;rows.push({k,id,x,name:String(name||'Без названия'),desc:String(desc||''),key:k+':'+id})};
 S.nodes.forEach(x=>add('node',x,x.name,x.desc,visibleNode(x)));S.routes.forEach(x=>add('route',x,routeLabel(x),x.desc,visibleRoute(x)));S.factions.forEach(x=>add('faction',x,x.name,x.desc,visibleFaction(x)));S.company.members.forEach(x=>add('hero',x,memberName(x),x.bio,!player||!x.hidden));S.company.staff.forEach(x=>add('staff',x,x.name,x.desc,!player||!x.hidden));for(const [k,list] of Object.entries(portalData()))if(Array.isArray(list))list.forEach(x=>add(k,x,x.title,[x.body,x.source,x.category].filter(Boolean).join(' · '),!player||published(k,x)));S.contracts.forEach(x=>add('contract',x,x.title,[x.desc,questGiver(x)].join(' · '),!player||!x.hidden));S.company.inventory.forEach(x=>add('item',x,x.name,x.desc,canSeeStack(x)));S.worldBook.chapters.forEach(x=>add('chapter',x,x.title,x.text,true,x.uxid));S.journal.forEach(x=>add('journal',x,x.title,x.text,!player||!x.hidden));S.diplomacy.forEach(x=>add('diplomacy',x,(faction(x.a)?.name||'')+' ↔ '+(faction(x.b)?.name||''),x.desc,visibleDiplomacy(x)));return rows}
function uxFind(k,id,arch=false){return uxRecords(arch).find(r=>r.k===k&&r.id===id)}
function uxOpen(k,id){const r=uxFind(k,id);if(!r)return;closeModal();switch(k){case'node':{const d=dims();if(!view)resetView();view.x=r.x.x*d.w-view.w/2;view.y=r.x.y*d.h-view.h/2;selected={type:'node',id};switchTab('map');break}case'route':selected={type:'route',id};switchTab('map');break;case'faction':focusFaction(id);break;case'hero':case'staff':openAffPerson(k,id);uxDetailExtras(k,id);break;case'contract':openMapQuest(id);break;case'item':openItem(id);uxDetailExtras(k,id);break;case'chapter':bookPage=S.worldBook.chapters.findIndex(x=>x.uxid===id);switchTab('worldbook');break;case'journal':openModal(r.name,`<p class="muted">${esc(portalDate(r.x))}</p><p class="record-body">${esc(r.x.text)}</p>`);break;case'diplomacy':openDiplomacy(id);break;default:openPortalRecord(k,id)}}
function uxBtn(k,id,label){return `<button class="ghost ux-link" onclick="uxOpen(${jsid(k)},${jsid(id)})">${esc(label)} ↗</button>`}
function uxFavorite(k,id){const r=uxFind(k,id);if(!r)return;const u=uxPrepare();u.favorites=u.favorites.includes(r.key)?u.favorites.filter(v=>v!==r.key):[...u.favorites,r.key];save();uxToolbar();document.querySelectorAll('[data-ux-fav]').forEach(b=>{if(b.dataset.uxFav===r.key)b.textContent=u.favorites.includes(r.key)?'★ В избранном':'☆ В избранное'});toast(u.favorites.includes(r.key)?'Добавлено в избранное':'Удалено из избранного')}
function uxFavButton(k,id){const key=k+':'+id;return `<button class="ghost" data-ux-fav="${esc(key)}" onclick="uxFavorite(${jsid(k)},${jsid(id)})">${uxPrepare().favorites.includes(key)?'★ В избранном':'☆ В избранное'}</button>`}
function uxSearch(){openModal('Поиск по Атласу',`<input id="uxQuery" type="search" placeholder="Имя, место, квест, предмет, текст…" autocomplete="off"><div id="uxResults" class="ux-results"></div>`);$('uxQuery').oninput=uxSearchResults;uxSearchResults()}
function uxSearchResults(){const q=$('uxQuery').value.trim().toLocaleLowerCase('ru'),all=uxRecords(),matches=q?all.filter(r=>(r.name+' '+r.desc+' '+UX_LABEL[r.k]).toLocaleLowerCase('ru').includes(q)).sort((a,b)=>Number(b.name.toLowerCase().includes(q))-Number(a.name.toLowerCase().includes(q))):all.filter(r=>uxPrepare().favorites.includes(r.key));$('uxResults').innerHTML=`<small>${q?'Найдено: '+matches.length:'Избранное · введите запрос для поиска по всему Атласу'}</small>`+matches.slice(0,100).map(uxResult).join('')+(matches.length>100?'<p class="muted">Уточните запрос: показаны первые 100.</p>':'')+(!matches.length?'<p class="muted">Нет результатов.</p>':'')}
function uxResult(r){return `<div class="ux-result"><button class="ux-result-open" onclick="uxOpen(${jsid(r.k)},${jsid(r.id)})"><small>${esc(UX_LABEL[r.k]||r.k)}</small><strong>${esc(r.name)}</strong>${r.desc?`<span>${esc(r.desc.slice(0,130))}</span>`:''}</button>${uxFavButton(r.k,r.id)}</div>`}
function uxFavorites(){openModal('Избранное',`<div class="ux-results">${uxRecords().filter(r=>uxPrepare().favorites.includes(r.key)).map(uxResult).join('')||'<p class="muted">Добавьте места, персонажей и задания кнопкой ☆.</p>'}</div>`)}
function uxRelated(k,id){const r=uxFind(k,id);if(!r)return '';const x=r.x,all=uxRecords().filter(z=>z.key!==r.key);const links=all.filter(z=>{const y=z.x;return (k==='node'&&(y.location===id||z.k==='route'&&(y.a===id||y.b===id)))||(k==='faction'&&(y.faction===id||z.k==='diplomacy'&&(y.a===id||y.b===id)))||(k==='people'&&z.k==='contract'&&y.giver===id)||(z.k==='node'&&(x.location===z.id||k==='route'&&[x.a,x.b].includes(z.id)))||(z.k==='faction'&&(x.faction===z.id||k==='diplomacy'&&[x.a,x.b].includes(z.id)))||(z.k==='people'&&k==='contract'&&x.giver===z.id)||(z.k==='contract'&&k==='people'&&y.giver===id)||(k==='hero'&&z.k==='item'&&String(y.owner).includes(id))});return links.length?`<div class="rule ux-related"><h3>Связанные записи</h3>${links.map(z=>uxBtn(z.k,z.id,(UX_LABEL[z.k]||'')+' · '+z.name)).join('')}</div>`:''}
function uxDetailExtras(k,id){const r=uxFind(k,id);if(!r||!$('modalBody')||$('modalBody').querySelector('.ux-detail'))return;const el=document.createElement('div');el.className='ux-detail rule';el.innerHTML=uxRelated(k,id)+`<div class="actions">${uxFavButton(k,id)}${!player&&(['contract',...Object.keys(PORTAL)].includes(k))?`<button onclick="uxDuplicate(${jsid(k)},${jsid(id)})">Дублировать</button><button onclick="uxArchive(${jsid(k)},${jsid(id)})">В архив</button>`:''}</div>`;$('modalBody').append(el);uxLinkify($('modalBody'))}
function uxLinkify(root){if(!root)return;const map=new Map();for(const r of uxRecords().filter(r=>['node','faction','people','hero','staff','contract','codex','item'].includes(r.k)&&r.name.length>=4)){const key=r.name.toLowerCase();if(map.has(key))map.set(key,null);else map.set(key,r)}const names=[...map].filter(([k,v])=>v).map(([k])=>k).sort((a,b)=>b.length-a.length);if(!names.length)return;const re=new RegExp('(^|[^\\p{L}\\p{N}])('+names.map(s=>s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|')+')(?=$|[^\\p{L}\\p{N}])','giu');const targets=root.querySelectorAll('.record-body,.world-chapter,.quest-content p,.quest-heading span,.portal-card .excerpt,.portal-card .eyebrow,.logline p');for(const el of targets){if(el.closest('form')||el.dataset.uxLinked)continue;el.dataset.uxLinked='1';const w=document.createTreeWalker(el,NodeFilter.SHOW_TEXT);const texts=[];while(w.nextNode())if(!w.currentNode.parentElement.closest('button,a,script,style'))texts.push(w.currentNode);for(const t of texts){const str=t.nodeValue;re.lastIndex=0;let m,last=0,frag=document.createDocumentFragment(),changed=false;while((m=re.exec(str))){const r=map.get(m[2].toLowerCase());if(!r)continue;const start=m.index+m[1].length;frag.append(str.slice(last,start));const b=document.createElement('button');b.className='ux-inline';b.textContent=m[2];b.onclick=()=>uxOpen(r.k,r.id);frag.append(b);last=start+m[2].length;changed=true}if(changed){frag.append(str.slice(last));t.replaceWith(frag)}}}}
function uxDuplicate(k,id){if(player)return;const r=uxFind(k,id);if(!r)return;const x=uxClone(r.x);x.id=uid();x.archived=false; x.title+=' (копия)';if(k==='contract'){x.status='available';x.rewardReceipt=null;x.rewardRevealed=false;S.contracts.push(x)}else if(PORTAL[k]){if(k==='achievements'){x.grants=[];x.earned=false;x.earnedDate='';x.auto=''}if(k==='mail')x.read=false;portalData()[k].push(x)}else return;closeModal();commit();if(k==='contract')editContract(x.id);else editPortal(k,x.id)}
function uxArchive(k,id){if(player)return;const r=uxFind(k,id,true);if(!r||!['contract',...Object.keys(PORTAL)].includes(k))return;if(!r.x.archived&&!confirm('Перенести запись в архив? Связи и данные сохранятся.'))return;r.x.archived=!r.x.archived;closeModal();commit();toast(r.x.archived?'Запись в архиве':'Запись восстановлена')}
function uxArchiveView(){if(player)return;const rows=uxRecords(true).filter(r=>r.x.archived);openModal('Архив',`<p class="muted">Архивные записи скрыты из активных разделов. Восстановление возвращает их с прежним ID.</p>${rows.map(r=>`<div class="ux-result"><div><small>${esc(UX_LABEL[r.k])}</small><strong>${esc(r.name)}</strong><p>${esc(r.desc.slice(0,180))}</p></div><button onclick="uxArchive(${jsid(r.k)},${jsid(r.id)});uxArchiveView()">Восстановить</button></div>`).join('')||'<p>Архив пуст.</p>'}`)}
function uxCover(){if(player)return;openModal('Обложка главной страницы',`<p class="muted">Рекомендуется широкое изображение 16:9. Текст и кнопки останутся поверх затемнения.</p><input id="uxCoverFile" type="file" accept="image/*"><div class="actions"><button class="primary" id="uxCoverSave">Сохранить</button><button onclick="uxPrepare().cover='';closeModal();commit()">Убрать обложку</button></div>`);$('uxCoverSave').onclick=async()=>{const f=$('uxCoverFile').files[0];if(!f)return toast('Выберите изображение');try{const img=await readImage(f);if(!safeImage(img))throw Error('Неверное изображение');uxPrepare().cover=img;closeModal();commit()}catch(e){toast(e.message)}}}
function uxNotifications(){return uxRecords().filter(r=>{const x=r.x;return ['news','rumors','mail'].includes(r.k)?published(r.k,x):r.k==='achievements'?published(r.k,x)&&visibleGrants(x).length:r.k==='contract'? !x.hidden&&x.status==='available':false}).map(r=>({...r,notification:r.key+(r.k==='achievements'?':'+visibleGrants(r.x).map(g=>g.recipient+'@'+g.date).sort().join(','):'')}))}
function uxReadSet(){
  const prefix='atlas-ux-inbox-'+uxPrepare().id+'-';
  const legacy=prefix+(player?'player':'master');
  const key=typeof actor!=='undefined'&&actor?prefix+'account:'+actor.nick:legacy;

    try{uxRead[key]=new Set(JSON.parse(localStorage.getItem(key)??localStorage.getItem(legacy)??'[]'))}

function uxMarkRead(keys){const [key,set]=uxReadSet();keys.forEach(k=>set.add(k));try{localStorage.setItem(key,JSON.stringify([...set]))}catch{}uxToolbar()}
function uxInbox(){const rows=uxNotifications(),set=uxReadSet()[1];openModal('Уведомления',`<div class="actions"><button onclick="uxMarkRead(uxNotifications().map(r=>r.notification));uxInbox()">Отметить все прочитанными</button></div>${rows.slice().reverse().sort((a,b)=>Number(set.has(a.notification))-Number(set.has(b.notification))).map(r=>`<div class="ux-result"><button class="ux-result-open" onclick="uxReadOpen(${jsid(r.k)},${jsid(r.id)},${jsid(r.notification)})"><small>${set.has(r.notification)?'':'● Новое · '}${esc(UX_LABEL[r.k])}</small><strong>${esc(r.name)}</strong></button></div>`).join('')||'<p>Нет уведомлений.</p>'}`)}

function uxSnapshot(){const u=uxPrepare(), copy={...S,settings:{...S.settings,ux:{...u,audit:[],favorites:[]}}};return uxClone(copy)}
function uxFingerprint(s){return JSON.stringify(s)}
function uxChanges(a,b){const names={company:'Компания / банк / лагерь',nodes:'Узлы',routes:'Маршруты',factions:'Фракции',contracts:'Задания',portal:'Записи мира и достижения',worldBook:'Хроники',journal:'Журнал',diplomacy:'Дипломатия',map:'Карта',journey:'Путешествие',settings:'Настройки'};return Object.keys(names).filter(k=>JSON.stringify(a[k])!==JSON.stringify(b[k])).map(k=>names[k]).join(' · ')||'Кампания'}
function uxAudit(label){const u=uxPrepare();u.audit.unshift({at:new Date().toISOString(),day:dayLabel(),label});u.audit=u.audit.slice(0,100)}

function requireThat(ok, message) {

function owned(actor, h) {

function applyCommand(source, actor, name, payload, key) {
  const cmd = commands.get(name);
  requireThat(actor && cmd, "Неизвестная команда");
  requireThat(
    actor.role === "master" ||
      (cmd.access === "hero" && owned(actor, payload.hero)),
    "Недостаточно прав",
  );
  requireThat(
    key && !source.engine.receipts.some((r) => r.key === key),
    "Операция уже применена",
  );
  const next = structuredClone(source);
  cmd.run(next, payload, actor);
  let event = name,
    recipient = payload.hero;
  if (name === "gather" && !currentStay(next).history.at(-1)?.item_id)
    event = "";
  if (name === "work" || name === "staffWork") {
    const project = byId(next.engine.projects, payload.project);
    if (project.status === "done") {
      event = "craft";
      recipient = project.hero;
    }
  }
  if (name === "craft" && next.engine.projects.at(-1)?.status !== "done")
    event = "";
  for (const a of next.portal?.achievements || []) {
    if (a.engineEvent === event && !a.archived)
      grant(
        next,
        { type: "achievement", achievement: a.id },
        a.scope === "company" ? "" : recipient,
      );
  }
  const receipt = {
    key,
    name,
    actor: actor.nick,
    hero: payload.hero,
    day: next.company.day,
  };
  if (
    [
      "gather",
      "quest",
      "project",
      "craft",
      "work",
      "staffWork",
      "enchant",
      "disenchant",
      "assemble",
      "closeStay",
      "transfer",
      "merge",
      "withdraw",
      "gold",
      "cancelProject",
      "finishContract",
      "tradeDeal",
      "tradeDonation",
      "facilityTier",
      "facilityRental",
      "deliverGoods",
      "session",
    ].includes(name)
  ) {
    const previous = new Map(
      (source.company.inventory || []).map((x) => [x.id, x]),
    );
    const current = new Map(
      (next.company.inventory || []).map((x) => [x.id, x]),
    );
    receipt.items = [];
    for (const id of new Set([...previous.keys(), ...current.keys()])) {
      const a = previous.get(id),
        b = current.get(id),
        change = (b?.qty || 0) - (a?.qty || 0);
      if (change)
        receipt.items.push({
          id,
          item_id: (b || a).item_id,
          owner: (b || a).owner,
          change,
        });
    }
    receipt.gold = Math.round(((next.company.gold || 0) - (source.company.gold || 0)) * 100) / 100;
    receipt.wallets = Object.entries(next.engine.profiles || {})
      .map(([hero, h]) => ({
        hero,
        change: Math.round((h.wallet - (source.engine.profiles?.[hero]?.wallet || 0)) * 100) / 100,
      }))
      .filter((w) => w.change);
    const t = currentStay(source);
    if (t) {
      const after = next.engine.stays.find((x) => x.id === t.id);
      receipt.time = Object.entries(after.spent)
        .map(([hero, value]) => ({
          hero,
          hours: roundedHours(value - (t.spent[hero] || 0)),
        }))
        .filter((x) => x.hours);
    }
  }
  if (name === "tradeDeal") {
    const row = localMarket(source, actor).find((market) => market.item_id === payload.item);
    receipt.market = { node: row.node_id, item: row.item_id, side: payload.side,
      quantity: payload.qty, unit: tradePrices(source, row)[payload.side] };
  }
  if (name === "facilityTier" || name === "facilityRental")
    receipt.facility = { service: payload.service, tier: payload.tier };
  if (name === "deliverGoods") receipt.contract = payload.id;
  if (name === "contentImport") receipt.package = { id: payload.pack.id, version: payload.pack.version };
  next.engine.receipts.push(receipt);
  return next;
}

function accountStore(mode, fn) {

    const tx = db.transaction("accounts", mode),
      req = fn(tx.objectStore("accounts"));
    tx.oncomplete = () => resolve(req.result);

async function passwordKey(password, salt) {
  const key = await crypto.subtle.importKey(
    "raw",
    new TextEncoder().encode(password),
    "PBKDF2",
    false,
    ["deriveBits"],
  );
  return Array.from(
    new Uint8Array(
      await crypto.subtle.deriveBits(
        {
          name: "PBKDF2",
          hash: "SHA-256",
          iterations: 210000,
          salt: new Uint8Array(salt),
        },
        key,
        256,
      ),
    ),
  );
}

async function makeAccount(nick, pass, name, role, heroes, travel = false) {
  requireThat(
    nick.trim() &&
      pass.length >= 8 &&
      ["master", "player", "captain", "observer"].includes(role),
    "Проверьте никнейм, роль и пароль (от 8 символов)",
  );
  const salt = Array.from(crypto.getRandomValues(new Uint8Array(16)));
  const a = {
    nick: nick.trim().toLowerCase(),
    name,
    role,
    heroes,
    travel,
    salt,
    hash: await passwordKey(pass, salt),
  };

async function execute(name, payload, key = crypto.randomUUID()) {

  busy = true;

  try {
    const next = applyCommand(S, actor, name, payload, key);
    clearTimeout(saveTimer);
    await dbPut(next, name === "contentImport" ? S : null);

async function readPrevious() {
  const old = await new Promise((resolve, reject) => {
    const r = indexedDB.open("shattered-atlas-v1");
    r.onupgradeneeded = () => r.result.createObjectStore("atlas");
    r.onsuccess = () => resolve(r.result);
    r.onerror = () => reject(r.error);
  });
  try {
    if (old.objectStoreNames.contains("atlas")) {
      const v = await new Promise((ok, fail) => {
        const r = old.transaction("atlas").objectStore("atlas").get("campaign");
        r.onsuccess = () => ok(r.result);
        r.onerror = () => fail(r.error);
      });
      if (v) return v;
    }
  } finally {
    old.close();
  }

  return json ? JSON.parse(json) : null;
}
async function boot() {
  try {
    requireThat(
      globalThis.crypto?.subtle && navigator.locks,
      "Для Web Crypto и блокировки вкладок откройте Атлас через localhost.",
    );
    await navigator.locks.request(
      "shattered-atlas-writer",
      { ifAvailable: true },
      async (lock) => {
        requireThat(
          lock,
          "Кампания открыта в другой вкладке. Закройте её и обновите страницу.",
        );
        db = await openDB();
        const raw = (await dbGet()) || (await readPrevious());
        S = raw ? normalize(raw) : migrate(fresh());
        portalData();
        adventure(S);
        await dbPut(S);
        uxLast = uxSnapshot();
        accounts = await accountStore("readonly", (s) => s.getAll());
        gate();
        await new Promise(() => {});
      },
    );
  } catch (e) {
    const gate = $("gate");
    gate.textContent = e.message;
    if (location.protocol === "file:") {
      const help = document.createElement("p");
      help.innerHTML = '<a href="start.html">Как запустить Атлас через localhost</a>';
      gate.append(help);
    }
  }
}

    raw.push(die(20));
    natural = (advantage ? Math.max : Math.min)(...raw);
  }

    Math.floor((p.stats[stat] - 10) / 2) +
    bv(p) * Math.max(trained, toolPro ? 1 : 0) +
    p.bonus;

    natural,
    raw,
    mod,

function inside(x, y, points) {
  let hit = false;
  for (let i = 0, j = points.length - 1; i < points.length; j = i++) {
    const [a, b] = points[i],
      [c, d] = points[j];
    if (b > y !== d > y && x < ((c - a) * (y - b)) / (d - b) + a) hit = !hit;
  }
  return hit;
}

    rs

}

}

function drawRegion() {
  const svg = $("mapsvg"),
    points = [];
  const shape = document.createElementNS(
    "http://www.w3.org/2000/svg",
    "polygon",
  );
  shape.setAttribute("fill", "#d7b46355");
  svg.append(shape);
  const done = button("Завершить границу (не менее 3 точек)", () => {
    requireThat(points.length >= 3, "Отметьте три точки");
    svg.removeEventListener("pointerdown", add, true);
    done.remove();
    regionForm(points);
  });
  const add = (e) => {
    e.stopImmediatePropagation();
    const p = worldPoint(e),
      d = dims();
    points.push([clamp(p.x / d.w, 0, 1), clamp(p.y / d.h, 0, 1)]);
    shape.setAttribute(
      "points",
      points.map(([x, y]) => [x * d.w, y * d.h].join(",")).join(" "),
    );
  };
  svg.addEventListener("pointerdown", add, true);
  $("engineActions").append(done);
}
const previousDraw = drawMap;
drawMap = function () {
  previousDraw();
  const svg = $("mapsvg");
  if (!svg || player) return;
  const d = dims();
  for (const r of foundation(S).regions) {
    if (!r.points?.length) continue;
    const poly = document.createElementNS(svg.namespaceURI, "polygon");
    poly.setAttribute(
      "points",
      r.points.map(([x, y]) => [x * d.w, y * d.h].join(",")).join(" "),
    );
    poly.setAttribute("fill", "#cea25330");
    poly.setAttribute("stroke", "#d2ad67");
    poly.setAttribute("pointer-events", "none");
    svg.append(poly);
  }
};
const travelStart = beginJourney;
beginJourney = function (id) {
  if (currentStay(S)) return toast("Сначала закройте стоянку");
  return travelStart(id);
};
function phasePanel() {
  const e = foundation(S),
    t = currentStay(S),
    gm = actor.role === "master",
    hero = chosen();
  if (!["home", "map", "camp", "contracts", "company", "bank"].includes(tab))
    return;
  const box = document.createElement("section");
  box.className = "card engine-panel";
  const region = e.regions.find((r) => r.id === t?.region);
  box.innerHTML =
    "<h3>" +
    esc(phases[S.journey ? "travel" : e.phase]) +
    "</h3>" +
    (t
      ? "<p>" +
        esc(
          [
            t.name,
            region?.name,
            hero ? remaining(S, hero) + " ч. доступно" : "",
          ]
            .filter(Boolean)
            .join(" · "),
        ) +
        "</p>"
      : "") +
    '<div id="engineActions" class="actions"></div>';
  if (tab === "map") $("main").querySelector(".map-main").append(box);
  else $("main").append(box);
  const a = $("engineActions");
  if (["home", "camp"].includes(tab))
    a.append(button("К стоянке", () => switchTab("stay")));
  if (gm && tab === "map")
    a.append(
      button("Создать регион", () => regionForm()),
      button("Нарисовать границу", drawRegion),
    );

  if (hero && owned(actor, hero)) {
    a.append(button("Бросок", rollForm));
    const last = e.rolls.find((r) => r.hero === hero);
    if (last) {
      const p = document.createElement("p");
      p.textContent =
        last.label +
        " · [" +
        last.raw.join(", ") +
        "] + " +
        last.mod +
        " = " +
        last.total +
        (!player || last.showDC !== false ? " · Сл " + last.dc : "");
      box.append(p);
    }
  }
  for (const fn of actions) fn(a, { gm, hero, t, e, box });
}
onRender.push(phasePanel);

function companyHeroRows() {
  const members = S.company.members.filter(
    (m) => !player || !m.hidden || owned(actor, m.id),
  );
  if (!player) return members;
  return [
    ...members.filter((m) => owned(actor, m.id)),
    ...members.filter((m) => !owned(actor, m.id)),
  ];
}
function companyHeroActions(member) {
  if (!owned(actor, member.id)) return "";
  const id = jsid(member.id);
  return (
    '<div class="actions">' +
    (chosen() === member.id
      ? '<span class="tag">Активный герой</span>'
      : '<button onclick="selectCompanyHero(' +
        id +
        ')">Сделать активным</button>') +
    '<button class="primary" onclick="editMember(' +
    id +
    ')">Настроить героя</button>' +
    "<button onclick=\"openAffPerson('hero'," +
    id +
    ')">Карточка</button>' +
    (!player
      ? '<button class="danger ghost" onclick="removeMember(' +
        id +
        ')">Удалить</button>'
      : "") +
    "</div>"
  );
}
function selectCompanyHero(id) {
  if (!owned(actor, id)) return;
  activeHero = id;
  render();
}

          ? r.day === s.company.day
          : q.period
            ? s.company.day - r.day < q.period
            : true),
  );
}
function grant(s, r, hero) {
  const h = hero ? profile(s, hero) : null;
  if (r.type === "item") {
    deposit(
      s,
      r.item_id,
      hero ? "member:" + hero : "",
      integer(r.quantity, 1),
      { hidden: !!r.secret },
    );
    return;
  }
  if (r.type === "gold") {
    integer(r.amount, 0);
    if (h) h.wallet += r.amount;
    else s.company.gold += r.amount;
    return;
  }
  if (r.type === "rep") {
    const f = byId(s.factions, r.faction);
    integer(r.amount, -100000);
    f.repPoints = Math.max(-6000, Math.min(42999, f.repPoints + r.amount));
    return;
  }
  if (r.type === "contact") {
    byId(s.portal.people, r.npc);
    requireThat(h, "Нужен герой");
    h.contacts ??= [];
    if (!h.contacts.includes(r.npc)) h.contacts.push(r.npc);
    return;
  }
  if (r.type === "discover") {
    byId(s.nodes, r.node).visibility = "known";
    return;
  }
  if (r.type === "achievement") {
    const a = byId(s.portal.achievements, r.achievement);
    a.grants ??= [];
    const recipient = hero ? "hero:" + hero : "company";
    if (!a.grants.some((g) => g.recipient === recipient)) {
      const date = "День " + s.company.day;
      a.grants.push({
        recipient,
        date,
        name: hero ? heroOf(s, hero).name : s.company.name,
        recipientHidden: hero ? !!heroOf(s, hero).hidden : false,
      });
      if (!hero) {
        a.earned = true;
        a.earnedDate = date;
      }
    }
    return;
  }
  requireThat(false, "Неизвестная награда");
}
register("errand", "master", (s, p) => {
  adventure(s);
  requireThat(p.title && p.options.length, "Нужны название и варианты");
  const id = p.id || crypto.randomUUID();
  const q = {
    id,
    title: p.title,
    type: "local",
    desc: p.desc,
    region_id: p.region_id,
    hours: integer(p.hours, 1),
    repeat: p.repeat,
    period: p.period || 0,
    conditions: p.conditions || {},
    status: "available",
    rewards: [],
  };
  const prior = s.contracts.find((x) => x.id === id);
  requireThat(!prior || prior.type === "local", "ID занят контрактом");
  if (prior) Object.assign(prior, q);
  else s.contracts.push(q);
  for (const o of p.options) {
    integer(o.dc, 0, 100);
    requireThat(o.name && Object.hasOwn(skills, o.skill), "Проверьте вариант");
    const existing =
      o.id &&
      s.engine.solutions.find((x) => x.id === o.id && x.quest_id === id);
    const key = existing?.id || crypto.randomUUID();
    if (existing) Object.assign(existing, o);
    else s.engine.solutions.push({ ...o, id: key, quest_id: id });
    const reward = s.engine.rewards.find(
      (r) => r.solution_id === key && r.when === "success" && r.type === "gold",
    );
    if (reward) reward.amount = integer(o.gold);
    else if (o.gold)
      s.engine.rewards.push({
        id: crypto.randomUUID(),
        solution_id: key,
        type: "gold",
        amount: integer(o.gold),
        when: "success",
      });
  }
});
register("quest", "hero", (s, p) => {
  const e = adventure(s),
    q = byId(s.contracts, p.quest),
    o = byId(e.solutions, p.option);
  requireThat(
    q.type === "local" && q.id === o.quest_id && questAvailable(s, q, p.hero),
    "Поручение недоступно",
  );
  spend(s, p.hero, q.hours || 1, q.title);
  const r = ability(profile(s, p.hero), {
    skill: o.skill,
    tool: o.tool,
    stat: o.stat,
    dc: o.dc,
    mode: "normal",
  });
  e.rolls.unshift({ ...r, hero: p.hero, label: q.title });
  for (const rw of e.rewards.filter(
    (x) =>
      x.solution_id === o.id && x.when === (r.success ? "success" : "failure"),
  ))
    grant(s, rw, p.hero);
  const result = o.encounter
    ? "Требуется решение мастера"
    : r.success
      ? o.success
      : o.failure;
  e.completions.push({
    hero: p.hero,
    quest: q.id,
    option: o.id,
    stay: currentStay(s).id,
    day: s.company.day,
    result,
  });
  s.journal.unshift({
    id: crypto.randomUUID(),
    kind: "contract",
    title: q.title,
    text: result || "",
    day: s.company.day,
    year: s.company.year,
  });
});
register("session", "master", (s, p) => {
  const e = adventure(s);
  requireThat(
    typeof p.id === "string" &&
      p.id &&
      p.summary &&
      !e.sessions.some((x) => x.id === p.id),
    "Нужны уникальный ID и краткое содержание",
  );
  for (const r of p.effects) {
    if (r.type === "quest") {
      const q = byId(s.contracts, r.quest);
      settleContract(s, q, q.rewards || [], false);
    } else grant(s, r, r.hero || "");
  }
  e.sessions.push(structuredClone(p));
  s.journal.unshift({
    id: crypto.randomUUID(),
    kind: "note",
    title: p.summary,
    text: p.log,
    hidden: !!p.hidden,
    day: s.company.day,
    year: s.company.year,
  });
});

function columns(k) {

    (tables[k][2].includes(" source?") ? " provenance:json?" : " source:json?") + " extra:json?"
  )
    .split(" ")
    .map((token) => {
      const optional = token.endsWith("?"),
        [name, type = "text"] = token.replace(/\?$/, "").split(":");
      return { name, type, optional };
    });
}
function arr(s, k) {
  return tables[k][1].split(".").reduce((o, key) => (o[key] ??= []), s);
}
function subset(k, r) {
  if (k === "tradeGoods" || k === "tradeRecipes") return r.trade_product === true;
  if (k === "originalEquipment") return r.original === true;
  if (k === "materials") return r.category === "Материалы";
  if (k === "magicItems") return r.category === "Магические предметы";
  if (k === "enchantments") return r.profession_id === "enchanting" && !!r.properties;
  if (k === "archaeology") return r.profession_id === "archaeology";
  if (k === "deliveries") return r.type === "delivery";
  if (k === "quests") return !["local", "delivery"].includes(r.type);
  if (k === "errands") return r.type === "local";
  if (k === "hunting" || k === "fishing")
    return r.profession_id === (k === "hunting" ? "hunt" : "fishing");
  return true;
}
function records(s, k) {
  if (k === "news")
    return [
      ...arr(s, k).map((x) => ({ ...x, kind: "news" })),
      ...(s.portal.rumors || []).map((x) => ({ ...x, kind: "rumors" })),
    ];
  return arr(s, k).filter((x) => subset(k, x));
}
function csvWrite(rows, names) {
  const cell = (v) => {
    const str =
      typeof v === "object" && v !== null ? JSON.stringify(v) : String(v ?? "");
    return '"' + str.replaceAll('"', '""') + '"';
  };
  return (
    "\uFEFF" +
    [names, ...rows.map((row) => names.map((name) => name === "extra"
      ? Object.fromEntries(Object.entries(row).filter(([key]) => !names.includes(key))) : row[name]))]
      .map((line) => line.map(cell).join(";"))
      .join("\r\n")
  );
}
function csvRead(raw) {
  const text = raw.replace(/^\uFEFF/, "");
  let cell = "",
    row = [],
    rows = [],
    quoted = false,
    ended = false;
  const delimiter = text.split(/\r?\n/, 1)[0].includes(";") ? ";" : ",";
  const push = () => {
    row.push(cell);
    cell = "";
    ended = false;
  };
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (quoted) {
      if (c === '"') {
        if (text[i + 1] === '"') {
          cell += '"';
          i++;
        } else {
          quoted = false;
          ended = true;
        }
      } else cell += c;
      continue;
    }
    if (c === delimiter) {
      push();
      continue;
    }
    if (c === "\r" || c === "\n") {
      if (c === "\r" && text[i + 1] === "\n") i++;
      push();
      rows.push(row);
      row = [];
      continue;
    }
    if (c === '"' && !cell && !ended) {
      quoted = true;
      continue;
    }
    requireThat(!ended && c !== '"', "Некорректные кавычки CSV");
    cell += c;
  }
  requireThat(!quoted, "Незакрытая кавычка CSV");
  if (row.length || cell || ended) {
    push();
    rows.push(row);

function downloadText(filename, body, type = "application/json") {
  const a = document.createElement("a"),
    url = URL.createObjectURL(new Blob([body], { type }));
  a.href = url;
  a.download = filename;
  a.click();
  setTimeout(() => URL.revokeObjectURL(url), 1500);
}

  if (k === "magicItems") return contentExamples.bookEquipment.tables.originalEquipment.find((row) => row.category === "Магические предметы");

    return region;

// Validate incoming saves before the legacy normalizer has a chance to repair them.
function validateBackup(raw) {
  inspectJSON(raw);
  requireThat(
    raw && raw.version === 1 && raw.company,
    "Неизвестный формат резервной копии",
  );
  for (const k of ["accounts", "password", "hash", "salt", "secrets"])
    requireThat(
      !Object.hasOwn(raw, k),
      "Файл содержит поля локальной авторизации",
    );
  function unique(list, label) {
    if (list == null) return;
    requireThat(Array.isArray(list), "Ожидался список: " + label);
    const seen = new Set();
    for (const x of list) {
      requireThat(
        validId(x?.id) && !seen.has(x.id),
        "Некорректный или повторный ID: " + label,
      );
      seen.add(x.id);
    }
  }
  for (const k of ["nodes", "routes", "factions", "contracts"])
    unique(raw[k], k);
  for (const k of ["members", "staff", "inventory"]) unique(raw.company[k], k);
  requireThat(
    Number.isFinite(Number(raw.company.gold ?? 0)) &&
      Number(raw.company.gold ?? 0) >= 0,
    "Отрицательная казна",
  );
  for (const x of raw.company.inventory || [])
    if (x.qty != null) integer(Number(x.qty));
  for (const c of raw.contracts || [])
    if (c.status)
      requireThat(
        [
          "available",
          "active",
          "done",
          "failed",
          "locked",
          "cancelled",
          "paused",
          "draft",
        ].includes(c.status) || /^[a-z_-]+$/.test(c.status),
        "Недопустимый статус задания",
      );
  if (!raw.engine) return;
  const e = raw.engine;
  requireThat(
    e.schemaVersion === 1 && Array.isArray(e.receipts),
    "Неизвестная схема кампании",
  );
  for (const k of [
    "items",
    "regions",
    "professions",
    "recipes",
    "ingredients",
    "loot",
    "projects",
    "stays",
    "solutions",
    "rewards",
    "sessions",
    "markets",
    "facilities",
    "craftProperties",
    "campUpgrades",
    "localServices",
    "contentPackages",
  ])
    unique(e[k], k);
  for (const h of Object.values(e.profiles || {})) {
    integer(h.level, 1, 20);
    requireThat(
      typeof h.wallet === "number" &&
        Number.isFinite(h.wallet) &&
        h.wallet >= 0,
      "Неверный баланс кошелька",
    );
    for (const k of Object.keys(stats)) integer(h.stats[k], 1, 30);
    for (const k of ["tools", "recipes", "professions"])
      requireThat(
        Array.isArray(h[k]) && h[k].every((v) => typeof v === "string"),
        "Недопустимый профиль",
      );
  }
  for (const p of e.projects || [])
    requireThat(
      Number.isFinite(p.left) &&
        p.left >= 0 &&
        p.left <= p.work &&
        ["active", "done", "cancelled", "failed"].includes(p.status),
      "Неверный остаток проекта",
    );
  requireThat(
    (e.stays || []).filter((t) => !t.closed).length <= 1,
    "Две активные стоянки",
  );
  for (const t of e.stays || []) {
    integer(t.hours, 1, 24);
    integer(t.days, 1, 3650);
    for (const v of Object.values(t.spent))
      requireThat(
        Number.isFinite(v) && v >= 0 && v <= t.hours * t.days,
        "Превышен бюджет стоянки",
      );
  }
  validateTradeCatalog(raw);
  for (const [service, tier] of Object.entries(e.facilityTiers || {})) {
    requireThat(productionServices.includes(service), "Неизвестное сооружение");
    integer(tier, 2, 3);
  }
  for (const stay of e.stays || []) {
    for (const [service, rental] of Object.entries(stay.rentals || {})) {
      requireThat(productionServices.includes(service) && rental.node_id === stay.location &&
        raw.nodes.some((node) => node.id === rental.node_id && node.type === "city"), "Неверная аренда");
      integer(rental.tier, 1, 3);
      tradeMoney(rental.cost);
    }
  }
  const packageKeys = new Set();
  for (const pack of e.contentPackages || []) {
    contentMetadata(pack);
    requireThat(Array.isArray(pack.records), "Неверный реестр контента");
    for (const row of pack.records) {
      requireThat(Object.hasOwn(tables, row.table) && validId(row.id), "Неверная запись реестра контента");
      const key = catalogIdentity(row.table, row.id);
      requireThat(!packageKeys.has(key), "Запись указана в нескольких пакетах");
      packageKeys.add(key);
    }
  }
  checkPackageGraph(e.contentPackages || []);
  const receipts = new Set();
  for (const r of e.receipts) {
    requireThat(
      typeof r.key === "string" && !receipts.has(r.key),
      "Дубликат операции в журнале",
    );
    receipts.add(r.key);
  }
}

register("schedule", "hero", (s, p) => {
  const t = currentStay(s);
  requireThat(t && p.activity.trim(), "Нужно указать занятие");
  validateHours(p.hours);
  t.plans ??= [];
  const used = t.plans
    .filter((r) => r.hero === p.hero && !r.done)
    .reduce((a, b) => a + b.hours, 0);
  requireThat(
    used + p.hours <= remaining(s, p.hero),
    "План превышает остаток часов",
  );
  t.plans.push({
    id: crypto.randomUUID(),
    hero: p.hero,
    activity: p.activity,
    hours: p.hours,
  });
});

function settleContract(s, q, rows, reveal, delivery = null) {
  requireThat(
    q.type !== "local" && (q.type !== "delivery" || delivery) && q.status !== "done" && !q.rewardReceipt,
    "Задание уже завершено или индивидуальное",
  );
  const applied = [];
  for (const row of rows) {
    const r = structuredClone(row);
    if (r.type === "charter") {
      const f = byId(s.factions, r.faction);
      if (!(f.charter || "").split("\n").includes(r.text))
        f.charter = [f.charter, r.text].filter(Boolean).join("\n");
    } else if (r.type === "rep") {
      const f = byId(s.factions, r.faction),
        old = f.repPoints;
      grant(s, r);
      r.amount = f.repPoints - old;
    } else if (r.type === "gold") {
      requireThat(
        Number.isFinite(r.amount) && r.amount >= 0,
        "Неверное количество золота",
      );
      const purse = delivery?.rewardHero ? profile(s, delivery.rewardHero) : s.company;
      const balance = delivery?.rewardHero ? "wallet" : "gold";
      purse[balance] = Math.round((purse[balance] + r.amount) * 100) / 100;
    } else if (r.type === "item") {
      const id = r.item_id || "reward-" + q.id + "-" + applied.length,
        e = economy(s);
      if (!e.items.some((x) => x.id === id))
        e.items.push({
          id,
          name: r.name,
          quality: r.quality,
          category: r.category,
          icon: r.icon,
          image: r.image,
          desc: r.desc,
          value_gp: 0,
        });
      deposit(s, id, r.owner || "", r.qty || r.quantity, {
        hidden: !!q.hidden,
      });
    } else throw Error("Неизвестный тип награды");
    applied.push(r);
  }
  q.status = "done";
  q.rewards = applied;
  q.rewardReceipt = {
    day: s.company.day,
    year: s.company.year,
    rewards: applied,
    ...(delivery ? { delivery } : {}),
  };
  if (reveal) q.rewardRevealed = true;
  s.journal.unshift({
    id: crypto.randomUUID(),
    kind: "contract",
    title: "Контракт: " + q.title,
    text:
      "Завершён. " +
      applied.map((r) => r.name || r.text || String(r.amount)).join(", "),
    day: s.company.day,
    year: s.company.year,
    hidden: !!q.hidden,
  });
}

function activityState(hero, profession, stay) {
  const payload = { hero, profession: profession.id };
  if (profession.id === "skinning") {
    const carcasses = (stay.carcasses || []).filter((c) => !c.used);
    if (!carcasses.length) return { reason: "Нет подходящей туши" };
    const eligible = carcasses.filter(
      (c) =>
        bv(profile(S, hero)) >=
        (c.kind === "dragon" ? 5 : c.kind === "fiend" ? 3 : 2),
    );
    if (!eligible.length)
      return { reason: "Недостаточный ранг для доступных туш" };
    payload.carcass = eligible[0].id;
    payload.carcasses = eligible;
  }
  try {
    const heroProfile = profile(S, hero);
    if (!learnedProfession(heroProfile, profession.id))
      return { reason: "Профессия не изучена" };
    if (!eligibleProfession(S, heroProfile, profession.id))
      return { reason: professionRequirements(profession) };
    const details = gatheringDetails(S, payload);
    return { payload, details };
  } catch (error) {
    return { reason: error.message };
  }
}

function professionRank(p, id) {

    ? Math.min(bv(p), p.trained?.[id] || 2)
    : bv(p);

function sourceLabel(source) {
  const names = { phb2024: "Книга игрока D&D 2024", dmg2024: "Руководство мастера D&D 2024", wow: "D&D: World of Warcraft" };
  if (source?.book && Object.hasOwn(names, source.book))
    return names[source.book] + " · с. " + source.printed_page;
  if (source?.origin === "house") return "Домашняя механика Атласа";
  if (source?.origin === "demo") return "Демонстрационные данные";
  return "";
}
function knownRecipe(p, r) {
  return !!(
    r.basic ||
    p.recipes.includes(r.id) ||
    activeEffects(S).some((e) => e.recipes?.includes(r.id))
  );
}
function recipeAvailability(hero, p, r, quote) {
  const reasons = [];
  const profession = S.engine.professions.find((v) => v.id === r.profession_id);
  if (!knownRecipe(p, r)) reasons.push("Рецепт не изучен");
  if (!profession) reasons.push("Профессия отсутствует в справочнике");
  else if (!learnedProfession(p, profession.id))
    reasons.push("Профессия не изучена");
  else if (!eligibleProfession(S, p, profession.id))
    reasons.push(professionRequirements(profession));
  if (professionRank(p, r.profession_id) < (r.rank || 2))
    reasons.push("Требуется БВ +" + (r.rank || 2));
  if (!currentStay(S)) reasons.push("Нужна активная стоянка");
  else if (!facilities(S, r))
    reasons.push("Недоступно нужное место или сооружение");
  if (currentStay(S) && remaining(S, hero) <= 0)
    reasons.push("Время стоянки исчерпано");
  if (r.tools?.some((t) => !p.tools.includes(t)))
    reasons.push("Нужно владение инструментами рецепта");
  if (
    r.equipment?.some(
      (id) =>
        !S.company.inventory.some(
          (x) => x.owner === "member:" + hero && x.item_id === id && x.qty > 0,
        ),
    )
  )
    reasons.push("В сумках нет нужного оборудования");
  if (r.conditions && !meetsConditions(S, hero, r.conditions))
    reasons.push("Особые условия рецепта не выполнены");
  if (!reasons.length && !canCraft(S, hero, r))
    reasons.push("Условия изготовления не выполнены");
  if (quote.wallet < quote.cost) reasons.push("Не хватает золота");
  if (quote.materials.some((x) => x.have < x.qty))
    reasons.push("Не хватает материалов");
  return reasons;
}

const productionServices = [...new Set(Object.values(TRADE_SERVICES))];
const propertyKinds = {
  extra_attack: "Дополнительная атака", counterattack: "Контратака",
  damage_dice: "Дополнительные кости урона", control: "Контроль",

const sourceIds = ["phb2024", "dmg2024", "wow", "house", "demo"];
const bookIds = sourceIds.slice(0, 3);
const tempoDefaults = { consumable: 4, equipment: 24, common: 8, uncommon: 24, rare: 56, epic: 112 };
const repTradeDefaults = [[3000, 0.05], [9000, 0.1], [21000, 0.15], [42000, 0.2]];

function tradeMoney(value) {
  requireThat(typeof value === "number" && Number.isFinite(value) && value >= 0 && value <= 1e9, "Некорректная денежная сумма");
  return Math.round(value * 100) / 100;
}
function tradeNumber(value) {
  requireThat(typeof value === "number" || (typeof value === "string" && value.trim()), "Ожидалось число");
  const number = Number(value);
  requireThat(Number.isFinite(number), "Некорректное число");
  return number;
}
function catalogSource(source, booksOnly = false) {
  const origin = source?.book || source?.origin;
  requireThat((booksOnly ? bookIds : sourceIds).includes(origin), "Укажите идентификатор источника");
  if (bookIds.includes(origin)) integer(source.printed_page, 1, 9999);
}
function validateTradeRow(k, row) {
  if (k === "markets") {
    for (const key of ["stock", "demand"]) integer(row[key]);
    for (const key of ["budget", "buy_factor", "sell_factor"]) tradeMoney(row[key]);
    requireThat(row.buy_factor > 0 && row.sell_factor <= row.buy_factor && row.buy_factor <= 10,
      "Коэффициенты: 0 ≤ скупка ≤ продажа ≤ 10");
    if (row.rep_bonuses != null) {
      requireThat(Array.isArray(row.rep_bonuses), "Ожидались пороги репутации");
      let threshold = -1;
      for (const line of row.rep_bonuses) {
        requireThat(Array.isArray(line) && line.length === 2, "Порог репутации: [очки, скидка]");
        threshold = integer(line[0], threshold + 1, 42999);
        requireThat(Number.isFinite(line[1]) && line[1] >= 0 && line[1] < 1, "Скидка от 0 до 1");
      }
    }
  }
  if (k === "facilities") {
    requireThat(productionServices.includes(row.service), "Неизвестное сооружение");
    for (const field of ["tier2_gp", "tier3_gp", "rent1_gp", "rent2_gp", "rent3_gp"]) tradeMoney(row[field]);
  }
  if (k === "services") {
    requireThat(row.service === "Наставник" || productionServices.includes(row.service), "Неизвестная местная услуга");
    if (row.tier != null) integer(row.tier, 1, 3);
    if (row.fee != null) tradeMoney(row.fee);
  }
  if (k === "campUpgrades") {
    if (row.bonus != null) integer(row.bonus, -20, 20);
    if (row.discount != null) integer(row.discount, 0, 100);
    if (row.speed != null) integer(row.speed, 0, 100);
    if (row.recipes != null) requireThat(Array.isArray(row.recipes) && row.recipes.every(validId), "Нужен список ID рецептов");
  }
  if (k === "craftProperties") {
    requireThat(Object.hasOwn(propertyKinds, row.kind), "Неизвестное ремесленное свойство");
    requireThat(["attack", "bonus", "reaction", "magic", "utilize", "passive", "other"].includes(row.action), "Неизвестный тип действия");
    requireThat(row.trigger?.trim() && row.effect?.trim() && row.limits?.trim(), "Укажите триггер, эффект и ограничения");
    requireThat(!!row.uses === !!row.recovery && (row.kind !== "limited" || row.uses), "Укажите применения и способ восстановления");
    requireThat(["house", "demo"].includes(row.source?.origin), "Ремесленные свойства Атласа маркируются как house/demo");
  }
  if (["items", "tradeGoods", "originalEquipment"].includes(k)) {
    if (row.original) {
      catalogSource(row.source, true);
      requireThat(row.rules && typeof row.rules === "object" && !Array.isArray(row.rules) && Object.keys(row.rules).length,
        "Нужны исходные книжные характеристики");
      requireThat(!row.trade_product && !row.base_item_id && !row.craft_properties?.length &&
        !row.craft_slots && !row.magic_slots && !row.properties?.enchantment, "Книжному предмету нельзя добавить авторскую модификацию");
    }
    if (row.trade_product)
      requireThat(row.category === TRADE_CATEGORY && row.value_gp > 0 && row.stackable !== false && !row.hidden &&
        !row.properties && !row.rules && !row.base_item_id && !row.craft_properties?.length &&
        !row.craft_slots && !row.magic_slots && ["common", "uncommon", "rare"].includes(row.quality),
        "Торговая партия должна быть открытой, пригодной к складыванию, с положительной ценой и без боевых свойств");
    if (row.craft_slots != null) integer(row.craft_slots, 0, 1);
    if (row.magic_slots != null) integer(row.magic_slots, 0, 1);
    if (row.base_item_id || row.craft_slots || row.magic_slots || row.craft_properties?.length)
      requireThat(row.base_item_id && row.stackable === false && ["house", "demo"].includes(row.source?.origin),
        "Авторской экипировке нужна книжная основа, источник house/demo и stackable=false");
    if (row.craft_properties != null)
      requireThat(Array.isArray(row.craft_properties) && row.craft_properties.every(validId) &&
        new Set(row.craft_properties).size === row.craft_properties.length &&
        row.craft_properties.length <= (row.craft_slots || 0), "Свойства должны помещаться в ремесленные ячейки");
  }
  if (["recipes", "tradeRecipes"].includes(k)) {
    if (row.facility_rank != null) {

    requireThat(item.quality === ["common", "uncommon", "rare"][r.rank - 2], "Качество товара должно совпадать с рангом рецепта");
    if (p.kind === "production")

    const materials = (e.ingredients || []).filter((line) => line.recipe_id === r.id);
    requireThat(materials.length, "Нет ингредиентов торгового рецепта: " + r.id);
    let inputValue = 0;
    for (const line of materials) {
      const material = byId(e.items, line.item_id);
      requireThat(["Материалы", "Припасы"].includes(material.category) &&
        !material.original && !material.hidden && material.stackable !== false, "Нужно сырьё или припасы");

  const buy = tradeMoney(Math.max(0.01, Math.ceil(item.value_gp * row.buy_factor * (1 - bonus) * 100 - 1e-8) / 100));

  if (item.quality === "legendary") return r.hours;

function validateDelivery(s, contract) {

    typeof contract.consignee === "string" && contract.consignee.trim(), "Нужны название и получатель поставки");
  byId(s.nodes, contract.location);
  if (contract.giver) byId(s.portal.people, contract.giver);
  integer(contract.due_year, 1);
  integer(contract.due_day, 1);
  requireThat(["personal", "shared"].includes(contract.stock_source) && ["hero", "company"].includes(contract.reward_recipient),
    "Не выбраны источник товаров или получатель награды");

  const goods = new Set();
  for (const row of contract.goods) {
    requireThat(byId(s.engine.items, row.item_id).trade_product, "Поставка принимает торговые товары");
    requireThat(!goods.has(row.item_id), "Повтор товара в поставке");
    goods.add(row.item_id);

  requireThat(Array.isArray(contract.rewards) && contract.rewards.length > 0 && contract.rewards.length <= 30, "Укажите награду поставки");

      byId(s.engine.items, row.item_id);
      integer(row.qty || row.quantity, 1);
    } else if (row.type === "rep") {
      byId(s.factions, row.faction);

    have: tradeStock(s, row.item_id, owner).reduce((sum, stack) => sum + stack.qty, 0) }));
  const reasons = [];

  if (!owned(actor, hero) || (actor.role !== "master" && (q.hidden || place?.visibility === "hidden")))
    reasons.push("Нет доступа к поставке");

  if (s.company.year > q.due_year || (s.company.year === q.due_year && s.company.day > q.due_day)) reasons.push("Срок доставки истёк");
  if (q.stock_source === "shared" && !sharedAccess(s, actor, hero)) reasons.push("Нет доступа к общему банку");

function contentDefinition(table, row) {
  const path = tables[table][1];
  const stateFields = {
    contracts: ["status", "rewardReceipt", "rewardRevealed", "archived"],
    "portal.people": ["history", "archived"],
    "portal.achievements": ["earned", "earnedDate", "grants", "archived"],
    "portal.news": ["archived"], "portal.mail": ["read"],
  };
  const copy = { ...row };
  for (const key of stateFields[path] || []) delete copy[key];
  if (copy.extra && typeof copy.extra === "object") {
    copy.extra = { ...copy.extra };
    for (const key of stateFields[path] || []) delete copy.extra[key];
  }
  return copy;
}
function checkPackageGraph(packages) {
  const active = new Map(packages.filter((row) => !row.archived).map((row) => [row.id, row]));
  const checked = new Set(), visiting = new Set();
  function check(record) {
    if (checked.has(record.id)) return;
    requireThat(!visiting.has(record.id), "Цикл зависимостей пакетов");
    visiting.add(record.id);
    for (const dep of record.dependencies) {
      const target = active.get(dep.id);
      requireThat(target && compareContentVersions(target.version, dep.minVersion) >= 0, "Не хватает зависимости " + dep.id + " ≥ " + dep.minVersion);
      check(target);
    }
    visiting.delete(record.id);
    checked.add(record.id);
  }
  for (const record of active.values()) check(record);
}
function contentPlan(s, pack, options = {}) {
  inspectJSON(pack);
  const metadata = contentMetadata(pack);
  const registry = s.engine.contentPackages || [], previous = registry.find((x) => x.id === pack.id);
  requireThat(!previous || compareContentVersions(pack.version, previous.version) > 0, "Пакет этой или более новой версии уже установлен");
  requireThat(pack.tables && typeof pack.tables === "object" && !Array.isArray(pack.tables) &&
    Object.keys(pack.tables).length, "Нужны справочники пакета");
  const issues = [], changes = [], included = new Map();
  const owner = new Map(registry.flatMap((entry) => entry.records.map((record) =>
    [catalogIdentity(record.table, record.id), entry.id])));
  const data = structuredClone(pack.tables), lookup = structuredClone(s);
  for (const [table, rows] of Object.entries(data)) {
    requireThat(Object.hasOwn(tables, table) && Array.isArray(rows), "Неизвестный справочник " + table);
    const exists = new Set(records(lookup, table).map((row) => row.id));
    data[table] = rows.map((row) => row && typeof row === "object" ? contentDefinition(table, row) : row);
    for (const row of data[table]) {
      if (!validId(row?.id)) {
        issues.push(table + " · нужен постоянный ID");
        continue;
      }
      const key = catalogIdentity(table, row.id), currentOwner = owner.get(key);
      const conflict = included.has(key) || (currentOwner && currentOwner !== pack.id) ||
        (exists.has(row.id) && currentOwner !== pack.id);
      if (conflict) issues.push(key + " · запись уже принадлежит " + (currentOwner || "другому справочнику"));
      changes.push({ table, id: row.id, change: conflict ? "conflict" : exists.has(row.id) ? "update" : "new" });
      included.set(key, { table, id: row.id });
    }
  }
  requireThat(included.size, "Пакет пуст");
  const combined = new Map((previous?.records || []).map((row) => [catalogIdentity(row.table, row.id), row]));
  for (const [key, row] of included) combined.set(key, row);
  const entry = { ...metadata, records: [...combined.values()] };
  const packages = [...registry.filter((x) => x.id !== pack.id), entry];
  checkPackageGraph(packages);
  const declared = new Set(pack.dependencies.map((dep) => dep.id));
  for (const [table, rows] of Object.entries(data)) {
    for (const row of rows) {
      if (!row || typeof row !== "object") continue;
      const fields = columns(table).filter((field) => field.type.startsWith("@"));
      const refs = fields.map((field) => [field.type.slice(1), row[field.name]]);
      for (const id of row.locations || []) refs.push(["nodes", id]);
      for (const id of row.craft_properties || []) refs.push(["craftProperties", id]);
      for (const line of Array.isArray(row.goods) ? row.goods : []) refs.push(["items", line.item_id]);
      for (const [target, id] of refs) {
        const other = id && owner.get(catalogIdentity(target, id));
        if (other && other !== pack.id && !declared.has(other))
          issues.push(table + " " + row.id + " · нужна явная зависимость " + other);
      }
    }
  }
  const plan = planImport(s, data, "update", options);
  plan.issues.push(...issues);
  plan.count.errors += issues.length;
  plan.changes = changes;
  plan.next.engine.contentPackages = packages;
  return plan;
}
function exportContentPack(s, id) {
  const { records: members, ...pack } = byId(s.engine.contentPackages || [], id);
  delete pack.archived;
  pack.tables = {};
  for (const ref of members) {
    const row = records(s, ref.table).find((x) => x.id === ref.id);
    if (row) (pack.tables[ref.table] ??= []).push(contentDefinition(ref.table, row));
  }
  return pack;
}
register("contentImport", "master", (s, p) => {
  const plan = contentPlan(s, p.pack, { resetMarket: p.resetMarket === true });
  requireThat(!plan.count.errors, plan.issues.join("\n"));
  Object.assign(s, plan.next);
});
register("contentArchive", "master", (s, p) => {
  const pack = byId(s.engine.contentPackages || [], p.id);
  requireThat(!pack.archived, "Пакет уже архивирован");
  pack.archived = true;
  checkPackageGraph(s.engine.contentPackages);
});

function editCatalogRow(table, old = null) {
  if (player) return;
  const tradeRecipe = table === "tradeRecipes";
  const columnsList = columns(table).filter((field) => field.name !== "extra" &&
    !(tradeRecipe && field.name === "trade_product"));
  const materials = tradeRecipe ? S.engine.items.filter((row) =>
    ["Материалы", "Припасы"].includes(row.category) && !row.hidden && row.stackable !== false) : [];
  let ingredients = tradeRecipe ? S.engine.ingredients.filter((row) => row.recipe_id === old?.id) : [];
  const example = sampleRow(table);
  form((old ? "Изменить запись" : "Новая запись") + " · " + tables[table][0],
    columnsList.map((field, i) => {
      const key = "catalogEdit" + i, name = field.name;
      const schema = describeField(table, field, example);
      const label = name + " · " + schema.purpose + (field.optional ? "" : " *");
      const value = old?.[name];
      if (schema.reference) {
        const rows = records(S, schema.reference).map((row) => [row.id, catalogRowLabel(row) + " · " + row.id]);
        return pick(label, key, [["", "Выберите запись"], ...rows], value || "");
      }
      if (field.type === "bool" || schema.allowed)
        return pick(label, key, [["", "Не задано"], ...(schema.allowed || ["true", "false"]).map((x) => [x, x])],
          value == null ? "" : String(value));
      if (field.type === "json")
        return area(label + " (JSON)", key, value == null ? "" : typeof value === "string" ? value : JSON.stringify(value));
      if (["pos", "int", "signed", "num", "ratio"].includes(field.type))
        return input(label, key, "number", value ?? "",
          field.type === "num" || field.type === "ratio" ? 'step="any"' : 'step="1"');
      return input(label, key, "text", value ?? "", name === "id" && old ? "readonly" : "");
    }).join("") + (tradeRecipe ? '<h3>Ингредиенты</h3><div id="tradeIngredientRows"></div><div id="tradeIngredientTools" class="actions"></div>' : ""),
    async () => {
      const next = old ? { ...old } : {};
      for (const [i, field] of columnsList.entries()) next[field.name] = val("catalogEdit" + i);
      if (tradeRecipe) await execute("tradeRecipeEdit", { recipe: next, ingredients: readIngredients() });
      else await execute("import", { pack: { [table]: [next] }, mode: old ? "update" : "new" });
      toast("Запись сохранена");
    }, "Сохранить запись");

    return ingredients.map((_, i) => ({ item_id: val("tradeIngredient" + i), quantity: num("tradeAmount" + i) }));
  }

    const panel = $("tradeIngredientRows");
    panel.replaceChildren();
    if (!ingredients.length) panel.append("Добавьте хотя бы один ингредиент.");

      const line = document.createElement("div");
      line.className = "row trade-editor-row";
      line.innerHTML = pick("Материал", "tradeIngredient" + i, pairs(materials), row.item_id) +
        input("Количество", "tradeAmount" + i, "number", row.quantity, 'required min="1" step="1"');
      const remove = button("Убрать", () => {
        ingredients = readIngredients().filter((_, index) => index !== i);
        renderIngredients();
      });
      remove.type = "button";
      line.append(remove);
      panel.append(line);
    });
  }
  const add = button("Добавить ингредиент", () => {
    ingredients = [...readIngredients(), { item_id: materials[0]?.id, quantity: 1 }];
    renderIngredients();
  });
  add.type = "button";
  add.disabled = !materials.length;
  $("tradeIngredientTools").append(add);
  renderIngredients();
}

function buildContentPack() {
  const options = Object.keys(tables).filter((table) => records(S, table).length);
  form("Создать пакет из справочников",
    input("ID пакета", "cpId", "text", "", "required") +
    input("Версия X.Y.Z", "cpVersion", "text", "1.0.0", "required") +
    input("Название", "cpName", "text", "", "required") +
    input("Автор", "cpAuthor", "text", actor.name, "required") +
    area("Описание", "cpDescription", "") +
    area("Источники · JSON", "cpSources", JSON.stringify([{ origin: "house" }])) +
    area("Зависимости · JSON", "cpDependencies", "[]") +
    options.map((table, i) => check(tables[table][0], "cpTable" + i, false)).join(""),
    () => {
      const data = {}, included = new Set();
      for (const [i, table] of options.entries()) {
        if (!$("cpTable" + i).checked) continue;
        data[table] = records(S, table).filter((row) => {
          const key = catalogIdentity(table, row.id);
          if (included.has(key)) return false;
          included.add(key);
          return true;
        }).map((row) => contentDefinition(table, row));
      }
      requireThat(included.size, "Выберите справочники");
      const pack = { ...blankContentPackage(), id: val("cpId"), version: val("cpVersion"), name: val("cpName"),
        author: val("cpAuthor"), description: val("cpDescription"), sources: JSON.parse(val("cpSources")),
        dependencies: JSON.parse(val("cpDependencies")), tables: data };
      contentMetadata(pack);
      downloadText(pack.id + ".json", JSON.stringify(pack, null, 2));
    }, "Скачать пакет");
}

function readCodex(x) {
  const lines = String(x.body || "").split(/\r?\n/);
  const predefined = lines.some((line) => /^#{1,4}\s+/.test(line));
  const blocks = predefined ? lines : String(x.body || "").split(/\n\s*\n/);
  const headings = [];
  const content = blocks
    .map((line, i) => {
      const mark = line.match(/^#{1,4}\s+(.+)/);
      const title =
        mark?.[1] ||
        (!predefined && blocks.length > 5 && i % 3 === 0
          ? excerpt(line.split(/[.!?]/)[0], 50)
          : "");
      if (title) headings.push([i, title]);
      return mark
        ? '<h3 id="codex-part-' + i + '">' + esc(title) + "</h3>"
        : line
          ? '<p id="codex-part-' +
            i +
            '" class="record-body">' +
            esc(line) +
            "</p>"
          : "";
    })
    .join("");
  openModal(
    x.title,
    '<article class="reader codex-reader">' +
      '<div class="reader-meta"><small>' +
      esc(portalMeta(x)) +
      "</small>" +
      portalMenu("codex", x) +
      "</div>" +
      (safeImage(x.image) ? sectionArt(x.image, "cover", "") : "") +
      (headings.length > 1
        ? '<nav class="reader-toc" aria-label="Оглавление">' +
          headings
            .map(([i, title]) =>
              visualAction(
                title,
                "document.getElementById(\'codex-part-" +
                  i +
                  "\').scrollIntoView({block:\'nearest\'})",
                "ghost",
              ),
            )
            .join("") +
          "</nav>"
        : "") +
      (content || emptyScene("Текст статьи ещё не добавлен.")) +
      "</article>",
  );
  uxDetailExtras("codex", x.id);
  uxLinkify($("modalBody"));
}

function openIconPicker({
  category = "",

}) {
  const dialog = document.createElement("dialog");
  dialog.className = "atlas-icon-picker";
  dialog.setAttribute("aria-label", "Библиотека иконок");
  document.body.append(dialog);
  let selected = current.iconId || "",

    key = (id) => dialog.querySelector("#" + id);

    '<header><h2>Библиотека иконок</h2><button type="button" id="closeIcons" aria-label="Закрыть">×</button></header>' +
    '<div class="icon-filters"><label>Имя файла<input id="iconSearch" type="search" placeholder="Например, Copper"></label>' +
    '<label>Категория<select id="iconCategory"><option value="">Все категории</option></select></label></div>' +
    '<p id="iconPickerStatus" role="status">Загрузка библиотеки…</p><label id="iconLocalIndex" hidden>Открыть icons.json<input id="iconLocalFile" type="file" accept=".json,application/json"></label><div id="iconResults" class="icon-picker-grid"></div>' +
    '<nav class="icon-pagination" aria-label="Страницы иконок"><button id="iconPrev">Назад</button>' +
    '<span id="iconPage"></span><button id="iconNext">Далее</button></nav>' +
    '<div class="icon-picker-preview"><div id="iconPreview"></div><div><strong>Предпросмотр</strong><p id="iconSelected"></p></div></div>' +
    (allowUpload
      ? '<div class="icon-upload"><label>Своя иконка<input id="iconUpload" type="file" accept="image/*"></label>' +
        '<button type="button" id="removeCustomIcon">Убрать свою</button></div>'
      : "") +
    '<footer><button type="button" id="clearIconChoice">Использовать стандартную</button>' +
    '<button type="button" class="primary" id="saveIconChoice">Применить</button></footer>';
  function preview() {
    const entry = icons.find((x) => x.id === selected);
    key("iconPreview").innerHTML = libraryIcon(
      { image, iconId: selected },
      current.defaultId,

      ? "Показана своя иконка. Она имеет приоритет над библиотекой."
      : entry?.file ||

    if (key("removeCustomIcon")) key("removeCustomIcon").disabled = !image;
  }
  function showPage() {
    const pages = Math.max(1, Math.ceil(filtered.length / perPage));
    page = Math.min(page, pages - 1);
    key("iconResults").innerHTML = filtered
      .slice(page * perPage, (page + 1) * perPage)
      .map(
        (entry) =>
          '<button type="button" aria-pressed="' +
          (entry.id === selected) +
          '" data-icon-id="' +
          esc(entry.id) +
          '" title="' +
          esc(entry.file) +
          '">' +
          '<img src="' +
          esc(entry.path) +
          '" loading="lazy" alt=""><span>' +
          esc(entry.file) +
          "</span></button>",
      )
      .join("");

    key("iconPrev").disabled = page === 0;
    key("iconNext").disabled = page + 1 === pages;
  }
  function search() {
    const query = key("iconSearch").value.trim().toLowerCase(),
      cat = key("iconCategory").value;
    filtered = icons.filter(
      (entry) =>
        (!cat || entry.categories.includes(cat)) &&
        entry.file.toLowerCase().includes(query),
    );
    page = 0;
    key("iconPickerStatus").textContent = filtered.length
      ? "Найдено: " + filtered.length
      : "Иконок с таким именем нет.";

  }
  key("iconSearch").oninput = search;

  };
  key("iconNext").onclick = () => {

  };
  key("clearIconChoice").onclick = () => {
    selected = "";

  if (allowUpload) {
    key("iconUpload").onchange = async (event) => {
      const file = event.target.files[0];
      if (!file) return;
      const save = key("saveIconChoice");
      save.disabled = true;
      try {
        image = await readImage(file);
        preview();
      } catch (error) {
        key("iconPickerStatus").textContent = error.message;
      } finally {

    };
  }
  key("saveIconChoice").onclick = () => {
    try {
      onSave({ iconId: selected, image });
      dialog.close();
    } catch (error) {
      key("iconPickerStatus").textContent = error.message;
    }
  };
  key("closeIcons").onclick = () => dialog.close();
  dialog.addEventListener("close", () => dialog.remove(), { once: true });
  dialog.addEventListener("keydown", (event) => {
    if (event.key === "Escape") event.stopPropagation();

  dialog.showModal();
  preview();
  function setRegistry(registry) {
    if (!dialog.open) return;
    if (!Array.isArray(registry?.icons) || !registry.categories)
      throw Error("Неверный формат icons.json.");
    icons = registry.icons.filter(
      (entry) =>
        entry &&
        typeof entry.file === "string" &&
        Array.isArray(entry.categories) &&
        iconPath(entry.id) &&
        iconPath(entry.id) === entry.path,
    );
    key("iconCategory").replaceChildren(
      new Option("Все категории", ""),
      ...Object.entries(registry.categories).map(
        ([id, name]) => new Option(name, id),

    key("iconCategory").value = Object.hasOwn(registry.categories, category)
      ? category
      : "";
    key("iconLocalIndex").hidden = true;
    search();
    preview();
  }
  key("iconLocalFile").onchange = async (event) => {
    if (!event.target.files[0]) return;
    try {
      setRegistry(JSON.parse(await event.target.files[0].text()));
    } catch (error) {
      key("iconPickerStatus").textContent = error.message;
    }
  };
  loadIconIndex()
    .then(setRegistry)
    .catch(() => {
      if (!dialog.open) return;
      key("iconPickerStatus").textContent =
        "Откройте icons.json из папки Атласа или запустите приложение через localhost.";
      key("iconLocalIndex").hidden = false;
      showPage();
    });
}

    },
    onSave: ({ iconId, image }) => {
      if (player) return;
      (S.settings.navIconIds ??= {})[key] = iconId;
      (S.settings.navIcons ??= {})[key] = image;
      commit();
      editNavIcons();
    },
  });
}
function pickRecordIcon(record, category, defaultId, imageKey = "image") {
  if (player || !record) return;
  openIconPicker({
    category,
    current: { iconId: record.iconId, image: record[imageKey], defaultId },
    onSave: ({ iconId, image }) => {
      if (player) return;
      record.iconId = iconId;
      record[imageKey] = image;
      commit();
    },
  });
}
function pickPortalIcon(kind, id, category) {
  const record = portalData()[kind]?.find((row) => row.id === id);
  pickRecordIcon(record, category,
    kind === "people" ? iconDefaults.components.hero : iconDefaults.nav[kind],
  );
}
function pickInventoryIcon(id) {
  if (player) return;
  const stack = S.company.inventory.find((row) => row.id === id);
  if (stack) pickRecordIcon(stack, itemIconCategory(stack), iconDefaults.items[stack.item_id]);
}
function pickQuestIcon(id) {
  if (player) return;
  pickRecordIcon(S.contracts.find((row) => row.id === id), "quests", iconDefaults.nav.contracts, "badgeImage");
}
const campBranchIcons = ["weapons:Bow_01", "misc:Gear_01", "misc:Bag_01", "misc:Book_01"];
function pickTalentIcon(name, branch) {
  if (player || !TALENTS[branch]?.[1].includes(name)) return;
  openIconPicker({
    category: "upgrades",
    current: { ...S.settings.visual?.talentIcons?.[name], defaultId: campBranchIcons[branch] },
    onSave: (choice) => {
      if (player) return;
      const visual = S.settings.visual ??= {};
      (visual.talentIcons ??= {})[name] = choice;
      commit();
    },
  });
}

onRender.push(kitUpdateNavigation);
const existingNavIcon = navIcon;
navIcon = function (key, fallback) {
  const custom = safeImage(S.settings.navIcons?.[key]);
  const chosenId = S.settings.navIconIds?.[key];
  if (custom) return '<img src="' + esc(custom) + '" alt="">';
  const path = iconPath(chosenId) || iconPath(iconDefaults.nav[key]);
  return path
    ? '<img src="' + esc(path) + '" alt="">'
    : existingNavIcon(key, fallback);
};

function kitHomeRow(label, detail, icon, action, image = "") {
  return (
    '<button class="kit-listrow" onclick="' + action + '">' +
    (image ? '<img class="kit-feed-thumb" src="' + esc(image) + '" alt="" loading="lazy">' : uiIcon(icon)) +
    '<span class="kit-grow"><b>' + esc(label) + '</b><small>' +
    esc(detail) + '</small></span><span aria-hidden="true">›</span></button>'
  );
}

function renderHome() {
  const p = getHomePrefs(), c = S.company, hero = chosen();
  const stay = currentStay(S), phase = S.journey ? "travel" : S.engine.phase;
  const place = locLabel(c.location);
  const ready = S.contracts.filter((q) => !q.archived && !q.hidden && q.status === "available");
  const active = S.contracts.filter((q) => !q.archived && !q.hidden && q.status === "active");
  const letters = visiblePortalRows("mail").filter((x) => !x.hidden && published("mail", x) && !x.read && !uxReadSet()[1].has("mail:" + x.id));
  const points = publicItems("achievements").filter((x) => !x.archived && hasGrant(x, "company")).length;
  const advances = Object.values(c.talents).filter(Boolean).length;
  const chronicle = publicItems("chronicle").filter((x) => !x.archived).sort(
    (a, b) => n(b.year) - n(a.year) || n(b.day) - n(a.day),
  );
  const stories = ["news", "rumors"].flatMap((kind) =>
    publicItems(kind).filter((x) => !x.archived).map((x) => ({ kind, x })),
  ).sort((a, b) => n(b.x.year) - n(a.x.year) || n(b.x.day) - n(a.x.day));
  const primary = stay
    ? kitLink("Продолжить стоянку", "switchTab('stay')", "stay", "primary")
    : S.journey ? kitLink("Продолжить путь", "switchTab('map')", "map", "primary") : "";
  const settings = visualMenu("Главная страница",
    visualAction("Настроить блоки", "openHomeAppearance()") +
    (!player ? visualAction("Изменить обложку", "uxCover()") : ""),
  );
  const links = [
    ["news", "Вестник", stories.length + " записей"],
    ["worldbook", "Хроники Азерота", S.worldBook.chapters.length + " глав"],
    ["diplomacy", "Дипломатия", S.diplomacy.filter(visibleDiplomacy).length + " отношений"],
    ["contracts", "Доска заданий", ready.length + " доступно"],
    ["bank", "Хранилище", c.inventory.filter(canSeeStack).length + " позиций"],
    ["mail", "Почта", letters.length + " непрочитанных"],
    ["chronicle", "Летопись", chronicle.length + " записей"],
    ["achievements", "Достижения", points + " у отряда"],
  ];
  const data = [
    ["coins", c.gold.toLocaleString("ru-RU") + " зм", "Общая казна", "bank"],
    ["company", c.members.filter((m) => m.active && (!player || !m.hidden)).length, "Герои", "company"],
    ["camp", advances + "/12", "Улучшения лагеря", "camp"],
    ["achievements", points, "Достижения", "achievements"],
  ];
  $("main").innerHTML = `<div class="atlas-kit kit-home">
    <section class="kit-wideart kit-welcome">
      <img class="kit-cover-image" src="${esc(uxPrepare().cover || kitArtUrl("hero"))}" alt="">
      <div class="kit-herotext">
        <div class="eyebrow">${esc(dayLabel())}</div>
        <h2>Дорога ждёт,<br>путешественник.</h2>
        <p>${esc(c.name)}${place ? " · " + esc(place) : ""}</p>
        ${p.hero ? '<div class="actions">' + primary +
          kitLink("Открыть карту", "switchTab('map')", "map") +
          (!player && !S.map ? visualAction("Загрузить карту", "$('mapFile').click()") : "") +
          '</div>' : ""}
      </div>
      <div class="kit-hero-actions">${settings}</div>
    </section>
    ${p.stats ? '<div class="kit-home-metrics">' + data.map(([icon, value, label, target]) =>
      '<button onclick="switchTab(' + jsid(target) + ')">' + uiIcon(icon) +
      '<span><strong>' + esc(value) + '</strong><small>' + esc(label) + '</small></span></button>',
    ).join("") + '</div>' : ""}
    ${p.feed ? `<div class="kit-home-grid">
      <section>
        <div class="kit-subhead"><h3>Вести из Азерота</h3>${visualAction("Весь вестник →", "switchTab('news')", "ghost")}</div>
        <div class="kit-panel kit-feed">${stories.slice(0, 3).map(({ kind, x }) =>
          kitHomeRow(x.title, portalMeta(x) || excerpt(x.body, 115), "news",
          "switchTab('news');openPortalRecord(" + jsid(kind) + "," + jsid(x.id) + ")",
          safeImage(x.image) || kitArtUrl(kind === "rumors" ? "market" : "news")),
        ).join("") || emptyScene("Вестник ждёт первых сообщений.")}</div>
      </section><aside>
        <div class="kit-panel kit-today">
          <div class="eyebrow">Сейчас · ${esc(phases[phase])}</div>
          <h3>${esc(stay?.name || place || c.name)}</h3>
          ${hero && stay ? '<p class="muted">' + esc(timeLabel(remaining(S, hero))) + ' у героя</p>' : ""}
          ${primary ? '<div class="actions">' + primary + '</div>' : ""}
        </div>
        ${kitSubhead("Дела компании")}
        <div class="kit-panel kit-feed">
          ${kitHomeRow("Доска заданий", ready.length + " доступно", "contracts", "switchTab('contracts')")}
          ${kitHomeRow(letters[0]?.title || "Почта", letters.length + " новых", "mail", "switchTab('mail')")}
          ${kitHomeRow("Книга рецептов", "Ремесло и проекты", "craft", "openCraftTab('recipes')")}
          ${active.slice(0, 3).map((q) => kitHomeRow(q.title, "Действующее задание", "contracts", "openMapQuest(" + jsid(q.id) + ")")).join("")}
          ${chronicle[0] ? kitHomeRow(chronicle[0].title, "Последняя запись летописи", "chronicle", "openPortalRecord('chronicle'," + jsid(chronicle[0].id) + ")") : ""}

      </aside>

    ${p.shortcuts ? '<div class="kit-home-shortcuts">' + links.filter(([id]) => p.tiles[id] !== false)
      .map(([id, label, detail]) => kitHomeRow(label, detail, id, "switchTab(" + jsid(id) + ")")).join("") + '</div>' : ""}
