.game-screen {
  --game-gold: #e1c184;
  --game-border: #706044;
  --game-surface: #242b22;
  display: grid;
  gap: 1.15rem;
}
.game-screen h2,
.game-screen h3,
.game-screen h4 {
  color: var(--game-gold);
}
.game-screen h2 {
  font-size: clamp(1.6rem, 4vw, 2.4rem);
}
.game-screen h3 {
  font-size: 1.18rem;
}
.game-screen .card {
  border-color: #504c38;
  min-width: 0;
}

  gap: 1rem;
  background:
    radial-gradient(ellipse at 90% 0%, #393821, transparent 60%), #1f2820;
}

  display: flex;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 0.65rem 1.25rem;
  align-items: start;
}
.game-intro > div:first-child {
  flex: 1 1 26rem;
}
.game-intro p {
  margin-top: 0.45rem;
}
.stay-illustration {
  width: 100%;
  aspect-ratio: 3 / 1;
  object-fit: cover;
  border-radius: 7px;
}
.game-hero {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 0.8rem;
  border-top: 1px solid #4d5040;
  padding-top: 0.85rem;
}
#gameHeroSelect {
  margin-inline-start: auto;
}
.game-time label {
  display: flex;

  gap: 0.5rem;

.game-time strong {
  color: var(--game-gold);
}
.game-cover progress,
.project-row progress {
  display: block;
  width: 100%;
  accent-color: #a0bc76;
  margin-top: 0.35rem;
}
.game-section > h3 {
  margin-bottom: 0.7rem;
}
.activity-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 235px), 1fr));
  gap: 0.65rem;
}
.activity-card {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr);
  gap: 0.35rem 0.65rem;
  text-align: left;
  padding: 0.95rem;
  align-content: start;
}
.activity-card > span:not(.game-icon),
.activity-card > small {
  grid-column: 2;
}
.activity-card > .game-icon {
  grid-row: span 2;

  flex: 0 0 auto;
  width: 2.15rem;
  aspect-ratio: 1;
  color: #ebcb8b;
  background: #3c392a;
  border: 1px solid #746243;
  border-radius: 5px;
  font-size: 1.15rem;
  overflow: hidden;

.game-icon img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}
.game-hero .game-icon {
  width: 3rem;
}
.game-good {
  color: #abcf86;
}
.game-bad {
  color: #f5a78e;
}

  display: grid;
  border-top: 1px solid #49503f;

  text-align: left;
  display: flex;

.project-row button {
  margin: 0.5rem 0.5rem 0 0;
}

  margin: 0 auto;
  padding: 0.6rem clamp(0.8rem, 3vw, 2rem);
  background: #1e2b23;
  border: 0;
  border-bottom: 1px solid var(--scene-line);
  align-items: center;
}
.status-campaign,
.status-location,
.status-hero {
  display: flex;
  flex-wrap: wrap;
  gap: 0.4rem 0.7rem;
  align-items: center;
}
.status-campaign strong {
  color: var(--scene-gold);
}
.status-hero {
  margin-inline-start: auto;
}
.status-hero .field {
  display: flex;
  align-items: center;
  gap: 0.35rem;
  margin: 0;
}
.status-hero .field select {
  width: auto;
  max-width: min(150px, 42vw);
}
.phase-indicator {
  display: inline-flex;
  font-weight: 650;
  color: #e6ddb9;
  background: #554627;
  border-radius: 2rem;
  padding: 0.15rem 0.56rem;
}
.phase-stay {
  background: #354b33;
  color: #d7e6b3;
}
.phase-travel {
  background: #2b4350;
  color: #c7e5ee;
}
#nav {
  max-width: 1380px;
  margin: 0 auto;
  position: relative;
  background: transparent;
}
#nav[hidden],
[hidden] {
  display: none !important;
}
.nav-band {
  background: #202e26;
}
.nav-band:last-child {
  background: #302a1e;
}
.nav-band-label {
  flex-basis: 6.6rem;
  color: #b8c7ad;
  font-size: 0.72rem;
  letter-spacing: 0.09em;
}
.nav-band-label small {
  display: none;
}
.nav-scroll {
  overflow-x: auto;
  scrollbar-width: thin;
}
.nav-tab {
  min-height: 3.05rem;
  font-size: 0.78rem;
}
.nav-tab[aria-current] {
  color: #f3ddaf;
  box-shadow: inset 0 -2px #c2a15d;
  background: #65503366;
}
.scene-empty {
  padding: var(--scene-space);
  color: var(--scene-muted);
  text-align: left;
  border-left: 2px solid var(--scene-line);
}
.scene-empty .actions,
.scene-empty button {
  margin-top: 0.5rem;
}
.visual-screen {
  display: grid;
  align-content: start;
  gap: var(--scene-space);
  min-height: 0;
}
.section-cover {
  position: relative;
  display: flex;
  flex-wrap: wrap;
  gap: 0.85rem 1.5rem;
  align-items: end;
  justify-content: space-between;
  isolation: isolate;
  padding: clamp(1rem, 3vw, 2.5rem) var(--scene-space);
  border-bottom: 1px solid var(--scene-line);
  background: linear-gradient(110deg, #293527, #202c233e 64%, #1f291a73);
  border-radius: var(--scene-radius) var(--scene-radius) 0 0;
}
.section-cover > .section-art {
  position: absolute;
  inset: 0;
  z-index: -2;
  height: 100%;
  width: 100%;
  aspect-ratio: auto;
  border-radius: inherit;
}
.section-cover:has(> .has-art)::after {
  content: "";
  position: absolute;
  inset: 0;
  z-index: -1;
  border-radius: inherit;
  background: linear-gradient(90deg, #0d1713ee, #17241aa0 65%, #101b14b0);
}
.section-cover h2 {
  color: var(--scene-gold);
  margin: 0;
  font: 500 clamp(1.8rem, 4.2vw, 3.55rem) / 1.06 var(--scene-title);
}
.section-cover p {
  margin: 0.45rem 0 0;
  color: var(--scene-muted);
}
.section-cover-actions {
  display: flex;
  align-items: center;
  gap: 0.45rem;
  flex-wrap: wrap;
}
.section-art {
  display: grid;
  place-items: center;
  overflow: hidden;
  color: #d0b678;
  background:
    radial-gradient(ellipse at 58% 24%, #50604799, #1d2b219e 70%),
    linear-gradient(145deg, #252b22, #18231b);
}
.section-art img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}
.section-art > span {
  font: 500 clamp(1.5rem, 5vw, 4.3rem) / 1 var(--scene-title);
  opacity: 0.65;
}
.art-portrait {
  aspect-ratio: 3 / 4;
}
.art-portrait img {
  object-position: 50% 32%;
}
.art-cover {
  aspect-ratio: 16 / 9;
}
.art-emblem {
  aspect-ratio: 1;
}
.visual-menu {
  position: relative;
  display: inline-block;
  flex: 0 0 auto;
}
.visual-menu[open] {
  z-index: 5;
}
.visual-menu summary {
  display: grid;
  place-items: center;
  min-width: 2.5rem;
  min-height: 2.5rem;
  padding: 0 0.45rem;
  list-style: none;
  font-size: 1.24rem;
  line-height: 1;
  color: var(--scene-gold);
  background: #19241eea;
  border: 1px solid var(--scene-line);
  border-radius: 0.37rem;
  cursor: pointer;
}
.visual-menu summary::-webkit-details-marker {
  display: none;
}
.visual-menu summary:hover,
.visual-menu[open] summary {
  background: #453d28;
}
.visual-menu-panel {
  position: absolute;
  inset-inline-end: 0;
  top: calc(100% + 0.25rem);
  z-index: 5;
  display: grid;
  min-width: max-content;
  max-width: min(78vw, 300px);
  gap: 0.18rem;
  padding: 0.3rem;
  border: 1px solid #8f7951;
  border-radius: 0.4rem;
  background: #1c2820;
  box-shadow: 0 8px 27px #070d0abe;
}
.visual-menu-panel button {
  display: block;
  text-align: start;
  white-space: normal;
  font-size: 0.88rem;
  border-color: transparent;
  background: transparent;
}
.visual-menu-panel button:hover {
  background-color: #51462e;
}
.visual-card:has(.visual-menu[open]) {
  z-index: 3;
}
.visual-card-menu {
  position: absolute;
  top: 0.5rem;
  inset-inline-end: 0.5rem;
}
.visual-filters {
  display: flex;
  gap: 0.55rem 0.7rem;
  flex-wrap: wrap;
  align-items: end;
}
.visual-filters > input {
  flex: 1 1 12rem;
  max-width: 28rem;
}
.visual-filters .field {
  flex: 1 1 8rem;
  min-width: 0;
  max-width: 16rem;
  margin: 0;
}
.visual-filters .field label {
  margin: 0 0 0.22rem;
}
.visual-filters .visual-switch {
  margin-inline-start: auto;
}
.visual-card {
  position: relative;
  min-width: 0;
  border: 1px solid var(--scene-line);
  border-radius: var(--scene-radius);
  background: var(--scene-panel);
}
.visual-card:has(.visual-open:hover) {
  border-color: #a58a55;
  background: #293328;
}
.visual-open {
  display: block;
  width: 100%;
  height: 100%;
  padding: 0;
  color: inherit;
  border: 0;
  border-radius: inherit;
  background: transparent;
  text-align: start;
}
.visual-open:hover {
  background: transparent;
}
.visual-open > .section-art {
  border-radius: var(--scene-radius) var(--scene-radius) 0 0;
}
.visual-open strong {
  color: var(--scene-gold);
  font: 500 1.28rem/1.2 var(--scene-title);
}
.visual-open small {
  display: block;
  color: var(--scene-muted);
  line-height: 1.4;
}
.people-gallery,
.faction-gallery,
.codex-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(min(100%, 178px), 1fr));
  align-items: start;
  gap: clamp(0.55rem, 1.8vw, 1.1rem);
}
.person-card {
  background: #1c291f;
}
.person-open {
  height: auto;
}
.person-info {
  display: grid;
  padding: 0.75rem;
  gap: 0.2rem;
}
.person-info > span {
  color: #e5dbc4;
}
.people-gallery.is-list {
  grid-template-columns: minmax(0, 1fr);
}
.people-gallery.is-list .person-open {
  display: grid;
  grid-template-columns: 4.5rem minmax(0, 1fr);
  align-items: center;
}
.people-gallery.is-list .section-art {
  border-radius: var(--scene-radius) 0 0 var(--scene-radius);
}
.people-gallery.is-list .person-info {
  padding-inline-end: 3.3rem;
}
.dossier {
  display: grid;
  grid-template-columns: minmax(155px, 2fr) minmax(0, 5fr);
  gap: var(--scene-space);
}
.dossier aside {
  display: grid;
  gap: 0.55rem;
  align-content: start;
  min-width: 0;
}
.dossier aside .section-art {
  border-radius: var(--scene-radius);
}
.dossier-copy {
  display: grid;
  gap: 1rem;
}
.dossier-copy h3,
.reader h3 {
  color: var(--scene-gold);
  margin: 0.6rem 0 0.4rem;
}
.dossier .actions,
.reader .actions {
  justify-content: flex-start;
}
.reader {
  max-width: 70ch;
  margin-inline: auto;
  width: 100%;
  line-height: 1.65;
}
.reader .record-body {
  font-size: 1rem;
  line-height: 1.68;
  margin-block: 0.5rem;
}
.reader .section-art {
  border-radius: var(--scene-radius);
  margin-bottom: 1rem;
}
.reader-meta {
  display: flex;
  align-items: start;
  justify-content: space-between;
  gap: 0.7rem;
  margin-bottom: 0.8rem;
}
.reader-toc {
  display: grid;
  align-content: start;
  justify-items: start;
  gap: 0.15rem;
  border-left: 2px solid #a38a55;
  margin-block: 1rem;
  padding-left: 0.65rem;
}
.reader-toc button {
  text-align: start;
}
.modal-tools {
  display: flex;
  justify-content: flex-end;
  margin-bottom: 0.4rem;
}
.modal:has(.dossier, .faction-dossier, .codex-reader, .quest-paper) {
  width: min(850px, 100%);
}
.modal .modal-head {
  gap: 0.75rem;
}
.modal .modal-head h2 {
  min-width: 0;
  overflow-wrap: anywhere;
}
.modal .modal-head button {
  font-size: 1.3rem;
  min-width: 2.6rem;
  min-height: 2.6rem;
}
.faction-gallery {
  grid-template-columns: repeat(auto-fill, minmax(min(100%, 235px), 1fr));
}
.faction-overview .art-cover {
  aspect-ratio: 16/9;
}
.faction-overview:nth-child(3n + 1) .art-cover:not(.has-art) {
  background: radial-gradient(ellipse at 70% 22%, #75664d, #383426 72%);
}
.faction-overview:nth-child(3n + 2) .art-cover:not(.has-art) {
  background: radial-gradient(ellipse at 65% 20%, #436267, #253d40 74%);
}
.faction-overview .visual-open {
  height: auto;
}
.faction-overview .art-cover > span {
  color: #e3c68f;
}
.faction-card-title,
.item-dossier-title {
  display: flex;
  align-items: center;
  gap: 0.65rem;
  padding: 0.65rem 0.8rem;
  background: #272f245e;
}
.faction-card-title small,
.item-dossier-title small {
  display: block;
  color: var(--scene-muted);
}
.faction-card-title .art-emblem,
.item-dossier-title .art-emblem {
  width: 3.2rem;
  flex: none;
  border: 1px solid var(--scene-line);
  border-radius: 0.35rem;
  margin: 0;
}
.faction-card-title .art-emblem > span,
.item-dossier-title .art-emblem > span {
  font-size: 1.5rem;
}
.faction-card-title > .visual-menu,
.item-dossier-title > .visual-menu {
  margin-inline-start: auto;
}
.faction-region > h3,
.quest-chapter > h3 {
  font: 500 1.45rem/1.25 var(--scene-title);
  color: var(--scene-gold);
  margin: 0 0 0.7rem;
}
.faction-card-copy {
  padding: 0 0.9rem 0.85rem;
}
.faction-card-copy p {
  margin-block: 0.6rem;
}
.faction-dossier {
  display: grid;
  gap: 0.8rem;
}
.faction-dossier > .art-cover {
  aspect-ratio: 3/1;
  border-radius: var(--scene-radius);
}
.faction-links {
  display: grid;
  gap: 0.45rem;
}
.faction-links button {
  text-align: start;
}
.faction-links .section-art {
  width: 2.6rem;
}
.faction-links small {
  display: block;
}
.visual-guide {
  padding: 0.75rem;
  background: #2c352940;
  border-radius: 0.42rem;
}
.visual-guide summary {
  cursor: pointer;
  color: var(--scene-gold);
}
.codex-category .visual-open > span {
  display: grid;
  gap: 0.2rem;
  padding: 0.65rem 0.75rem;
}
.codex-category:nth-child(even) .art-cover:not(.has-art) {
  background: radial-gradient(ellipse at 50% 22%, #66593d, #373222 74%);
}
.codex-articles,
.gazette-feed,
.chronicle-timeline {
  display: grid;
  gap: 0.75rem;
  align-content: start;
}
.codex-articles {
  max-width: 62rem;
}
.editorial-copy {
  display: grid;
  gap: 0.32rem;
  padding: 0.85rem 1rem;
}
.editorial-card:has(.visual-card-menu summary) .editorial-copy {
  padding-inline-end: 3.25rem;
}
.editorial-card:not(.featured-story) > .visual-open:has(.section-art) {
  display: grid;
  grid-template-columns: minmax(80px, 1fr) 3fr;
}
.editorial-card:not(.featured-story) .section-art {
  height: 100%;
  border-radius: var(--scene-radius) 0 0 var(--scene-radius);
}
.gazette-layout {
  display: grid;
  grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr);
  align-items: start;
  gap: 0.9rem;
}
.featured-story .visual-open strong {
  font-size: clamp(1.6rem, 3vw, 2.75rem);
}
.chronicle-timeline {
  border-inline-start: 1px solid #94805a;
  margin-inline-start: 0.45rem;
  padding-inline-start: 1.3rem;
  max-width: 64rem;
}
.chronicle-timeline .editorial-card::before {
  content: "";
  width: 0.58rem;
  height: 0.58rem;
  position: absolute;
  inset-inline-start: -1.65rem;
  top: 1.3rem;
  border: 1px solid #dbba79;
  border-radius: 50%;
  background: #a28653;
}
.quest-chapter {
  display: grid;
  gap: 0.58rem;
  max-width: 66rem;
}
.quest-entry .visual-open {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr);
  align-items: start;
  gap: 0.9rem;
  height: auto;
  padding: 0.8rem 0.9rem;
}
.quest-entry:has(.visual-card-menu summary) .visual-open {
  padding-inline-end: 3.25rem;
}
.quest-entry .visual-open > span + span {
  display: grid;
  gap: 0.2rem;
}
.quest-seal {
  padding: 0.3rem 0.55rem;
  background: #524223;
  border: 1px solid #ad8b4a;
  border-radius: 0.32rem;
  color: #f5d469;
  font-size: 1.75rem;
  line-height: 1;
}
.quest-done .quest-seal {
  color: #b4d394;
  background: #2b432b;
  border-color: #537349;
}
.quest-active .quest-seal {
  color: #e8d4af;
}
.quest-failed .quest-seal {
  color: #e6aa97;
  background: #562d26;
  border-color: #86584b;
}
.quest-entry-actions:not(:empty) {
  padding: 0 0.8rem 0.8rem 3.4rem;
}
.quest-paper {
  background: radial-gradient(ellipse at top, #e9d8a8, #d3bd8d 100%);
  color: #302619;
  border: 1px solid #987447;
  border-radius: 0.5rem;
  padding: clamp(0.85rem, 3vw, 1.7rem);
}
.quest-paper header {
  display: flex;
  gap: 0.65rem;
  align-items: start;
  margin-bottom: 1rem;
}
.quest-paper header .visual-menu {
  margin-inline-start: auto;
}
.quest-paper h3,
.quest-paper h4 {
  color: #49321f;
}
.quest-paper .quest-reward {
  background: #755b3420;
  border-color: #8e71396b;
}
.quest-paper .quest-reward p,
.quest-paper .quest-reward small {
  color: #49351f;
}
.quest-paper .actions button:not(.primary) {
  background: #ece0ba;
  color: #392917;
  border-color: #8b7549;
}
.structured-loot {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 0.55rem;
  margin: 0.6rem 0;
}
.structured-loot > span {
  display: flex;
  align-items: center;
  gap: 0.3rem;
}
.storage-chest {
  background: #242d23;
  padding: var(--scene-space);
  border-radius: var(--scene-radius);
  border-top: 1px solid var(--scene-line);
}
.storage-chest h3 {
  margin: 0 0 0.8rem;
  color: var(--scene-gold);
}
.inventory-slots {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(3.25rem, 4.1rem));
  gap: 0.5rem;
}
.inventory-slots .inventory-slot {
  inline-size: 100%;
  block-size: auto;
  aspect-ratio: 1;
  border: 2px solid var(--quality);
  font-size: 1.45rem;
}
.inventory-slot b {
  font-size: 0.87rem;
  text-shadow: 0 1px 2px black;
}
.item-values {
  display: flex;
  flex-wrap: wrap;
  gap: 1rem 2rem;
}
.item-values dt {
  color: var(--scene-muted);
}
.item-values dd {
  margin: 0;
  font-weight: 600;
}
.treasury-strip {
  display: flex;
  align-items: center;
  gap: 0.85rem;
  border-bottom: 1px solid var(--scene-line);
  padding: 0.1rem 0.2rem 1rem;
}
.treasury-strip > span {
  color: #e8c369;
  font-size: 2rem;
}
.treasury-strip small,
.treasury-strip strong {
  display: block;
}
.treasury-strip strong {
  font: 500 1.7rem/1 var(--scene-title);
  color: var(--scene-gold);
}
.treasury-strip button {
  margin-inline-start: auto;
}
.storage-table {
  overflow: auto;
  max-width: 100%;
}
.storage-table table {
  width: 100%;
  border-collapse: collapse;
  text-align: start;
}
.storage-table td,
.storage-table th {
  padding: 0.55rem;
  border-bottom: 1px solid var(--scene-line);
  text-align: start;
}
.collection-meter {
  width: min(100%, 38rem);
  accent-color: #bd9c59;
}
.achievement-category {
  max-width: 15rem;
}
.achievement-open {
  display: grid;
  grid-template-columns: 3.5rem minmax(0, 1fr);
  gap: 0.66rem;
  height: auto;
  padding: 0.85rem;
}
.achievement:has(.visual-card-menu summary) .achievement-open {
  padding-inline-end: 3.3rem;
}
.achievement-open .section-art {
  border: 1px solid var(--scene-line);
  border-radius: 0.36rem;
}
.achievement-open .section-art span {
  font-size: 1.45rem;
}
.achievement-open > span {
  display: grid;
  gap: 0.3rem;
}
.achievement.earned {
  background: #2c3928;
  border-color: #817453;
}
.achievement.locked .section-art {
  filter: saturate(0.35);
}
.achievement-recipients {
  color: #c4dfa7 !important;
}
.camp-visual .camp-grid {
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 245px), 1fr));
}
.camp-visual .branch {
  --branch-line: #b1935f;
  border-top: 2px solid var(--branch-line);
}
.camp-visual .branch-1 {
  --branch-line: #85b8b6;
}
.camp-visual .branch-2 {
  --branch-line: #90ab70;
}
.camp-visual .branch-3 {
  --branch-line: #a899c2;
}
.camp-visual .talent {
  position: relative;
  margin-inline-start: 0.45rem;
  border-left: 2px solid var(--branch-line);
  padding-left: 0.76rem;
}
.camp-visual .talent:not(:last-child)::after {
  content: "";
  position: absolute;
  inset-inline-start: -2px;
  height: 1rem;
  bottom: -0.85rem;
  border-left: 2px solid var(--branch-line);
}
.camp-visual .talent.locked {
  opacity: 0.72;
}
.camp-visual .talent.unlocked {
  background: #31402b;
}
.book-visual .world-chapter {
  max-width: 72ch;
  margin-inline: auto;
  line-height: 1.75;
}
.home-hero {
  min-height: clamp(285px, 42vw, 470px);
}
.home-hero .hero-copy {
  padding-right: 1rem;
}
.home-appearance {
  position: absolute;
  inset-inline-end: 0.65rem;
  top: 0.65rem;
  z-index: 4;
}
.home-situation {
  display: grid;
  grid-template-columns: 2fr 1fr;
  gap: 0.8rem;
  margin: 0.75rem 0 1.1rem;
}
.home-situation > div {
  padding: 0.85rem 1rem;
  border-left: 2px solid #a38b56;
  background: linear-gradient(115deg, #303a2a, #28312685);
  display: grid;
  gap: 0.4rem;
  align-content: start;
  justify-items: start;
}
.home-situation strong {
  color: var(--scene-gold);
  font: 500 1.23rem/1.25 var(--scene-title);
}
.home-situation small {
  color: var(--scene-muted);
}
.context-panel {
  margin: 0.6rem auto;
  border: 0;
  border-left: 2px solid var(--scene-line);
  background: #2430269c;
  padding: 0.55rem 0.8rem;
}
.context-panel > h3 {
  font-size: 0.88rem;
}
.context-panel p {
  margin: 0.2rem 0;
  font-size: 0.86rem;
}
.context-panel button {
  min-height: 2.2rem;
}
.stay-illustration {
  aspect-ratio: 3.4/1;
  border-radius: 0.45rem;
}
.stay-professions,
.activity-reason {
  color: #c0bdab;
}
.activity-unavailable {
  background: #222c25a2;
  border-color: #6f715348;
  color: #d1d4c6;
}
.activity-unavailable .game-icon {
  background: #30352a;
  color: #baac89;
}
.stay-task-grid .activity-card > strong {
  align-self: center;
}
.stay-task-grid .activity-card > small {
  color: var(--scene-muted);
}
.recipe-back {
  display: none;
}
.project-row {
  padding: 0.8rem;
  border: 1px solid var(--scene-line);
  border-radius: var(--scene-radius);
  background: #263125;
}
.project-row + .project-row {
  margin-top: 0.6rem;
}
@media (max-width: 700px) {
  .visual-screen {
    padding-inline: 0.8rem;
    gap: 0.85rem;
  }
  .section-cover {
    align-items: start;
    padding: 0.9rem 0.8rem;
  }
  .nav-band-label {
    flex-basis: 4.35rem;
  }
  .nav-tab {
    min-height: 2.75rem;
    padding: 0.18rem 0.48rem;
  }
  .nav-tab .menu-icon {
    width: 1.45rem;
    height: 1.45rem;
  }
  #status {
    gap: 0.35rem 0.55rem;
  }
  .status-hero {
    margin-inline-start: 0;
  }
  #status .save {
    display: none;
  }
  .header .brand .eyebrow {
    display: none;
  }
  .brand h1 {
    font-size: 1.18rem;
  }
  .header .sigil {
    width: 2rem;
    height: 2rem;
    flex: 0 0 2rem;
  }
  .head-actions #modeBtn {
    font-size: 0.8rem;
    padding-inline: 0.55rem;
  }
  .visual-filters .field {
    flex-basis: calc(50% - 0.7rem);
    max-width: none;
  }
  .visual-filters > input {
    max-width: none;
  }
  .people-gallery,
  .codex-grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
  .dossier {
    grid-template-columns: minmax(0, 1fr);
  }
  .dossier aside .art-portrait {
    width: min(55%, 12rem);
  }
  .modalwrap {
    padding: 0.6rem;
    align-items: start;
  }
  .modal {
    max-height: calc(100dvh - 1.2rem);
    padding: 0.9rem;
  }
  .gazette-layout,
  .home-situation {
    grid-template-columns: minmax(0, 1fr);
  }
  .recipe-back {
    display: inline-block;
    margin-bottom: 0.7rem;
  }
  #recipeList {
    max-height: none;
  }
  .stay-illustration {
    aspect-ratio: 16/9;
  }
}
@media (max-width: 390px) {
  .head-actions #modeBtn {
    max-width: 8rem;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .editorial-card:not(.featured-story) > .visual-open:has(.section-art) {
    grid-template-columns: minmax(0, 1fr);
  }
  .editorial-card:not(.featured-story) .section-art {
    height: auto;
  }
}
.place-dossier > .section-art {
  aspect-ratio: 2.5/1;
  border-radius: var(--scene-radius);
  margin-bottom: 0.75rem;
}
.place-dossier > .visual-menu {
  margin-block: 0.5rem;
}
.place-dossier > .visual-menu .visual-menu-panel {
  inset-inline: 0 auto;
}
.profession-card .game-icon {
  width: 3.15rem;
}
.visual-screen .game-cover h2 {
  font-family: var(--scene-title);
}

.header {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr) auto auto;
  align-items: center;
}
#uxTools {
  margin: 0;
  padding: 0;
  min-width: 0;
}
#status .status-hero label {
  font-size: 0.73rem;
}
#status .status-hero .field {
  display: flex;
}
.faction-overview .art-cover:not(.has-art) {
  aspect-ratio: 2.65/1;
}
.record-private {
  color: #dcb89d !important;
}
@media (max-width: 700px) {
  .header {
    grid-template-columns: auto minmax(0, 1fr) auto;
    padding-block: 0.5rem;
    gap: 0.35rem 0.55rem;
  }
  .header .head-actions {
    grid-column: 3;
    grid-row: 1;
    justify-content: end;
    gap: 0.3rem;
    margin: 0;
  }
  .header .head-actions > .visual-menu summary {
    min-width: 2rem;
    min-height: 2.125rem;
  }
  .header #uxTools {
    grid-column: 1/-1;
    grid-row: 2;
    padding-block: 0.12rem;
    gap: 0.33rem;
  }
  .header #uxTools button {
    min-height: 2rem;
    font-size: 0.77rem;
    padding-inline: 0.55rem;
  }
  .header #uxTools .visual-menu summary {
    min-height: 2rem;
    min-width: 2rem;
  }
  .header .brand h1 {
    font-size: clamp(1rem, 4.25vw, 1.2rem);
  }
  #status {
    padding-block: 0.4rem;
    gap: 0.2rem 0.45rem;
  }
  #status .status-campaign,
  #status .status-location,
  #status .status-hero {
    font-size: 0.75rem;
  }
  #status .status-hero .field select {
    padding: 0.28rem 0.35rem;
    min-height: 2rem;
  }
  .nav-band-label {
    flex-basis: 3.8rem;
    font-size: 0.65rem;
    padding: 0.35rem;
  }
  .nav-tab {
    min-height: 2.5rem;
  }
  .nav-tab .menu-icon {
    width: 1.4rem;
    height: 1.4rem;
  }
}
.featured-story > button {
  position: relative;
  display: grid;
  align-items: end;
  isolation: isolate;
  min-height: clamp(245px, 33vw, 430px);
}
.featured-story .section-art {
  position: absolute;
  inset: 0;
  aspect-ratio: auto;
  height: 100%;
  z-index: -2;
  border-radius: inherit;
}
.featured-story .section-art > span {
  align-self: start;
  margin-top: 2rem;
}
.featured-story > button::before {
  content: "";
  position: absolute;
  inset: 0;
  z-index: -1;
  background: linear-gradient(0deg, #121d15 3%, #122219d0 40%, #15271b18 100%);
  border-radius: inherit;
}
.featured-story .editorial-copy {
  padding: clamp(0.85rem, 3vw, 1.7rem);
}
.featured-story .editorial-copy small {
  color: #ded1b3;
}
.game-cover-art {
  aspect-ratio: 3.4/1;
  border-radius: 0.45rem;
}
@media (max-width: 700px) {
  .game-cover-art {
    aspect-ratio: 16/9;
  }
}

/* Atlas UI Kit shared shell and screen layouts. */
body.atlas-kit-active {
  --kit-bg: #101714;
  --kit-panel: #19221e;
  --kit-raised: #222e26;
  --kit-ink: #f1e7cf;
  --kit-muted: #a9b5a7;
  --kit-gold: #d8b777;
  --kit-gold2: #e9d2a2;
  --kit-line: #364238;
  --kit-green: #99be83;
  --kit-red: #e29b89;
  --kit-serif: Georgia, "Times New Roman", serif;
  background:
    radial-gradient(ellipse at 70% 0, #22312a 0, transparent 45%), var(--kit-bg);
  color: var(--kit-ink);
  font:
    14px/1.5 system-ui,
    -apple-system,
    "Segoe UI",
    sans-serif;
}
.atlas-kit-active .header {
  display: block;
  max-width: none;
  padding: 0;
  position: sticky;
  top: 0;
  z-index: 8;
  background: #121b16;
}
.atlas-kit-active .header > :not(#kitTop),
.atlas-kit-active #status {
  display: none !important;
}
#kitTop {
  max-width: 1510px;
  height: 64px;
  margin: auto;
  padding: 0 28px;
  display: flex;
  gap: 17px;
  align-items: center;
}
.kit-brand {
  display: flex;
  align-items: center;
  gap: 12px;
  background: none;
  border: 0;
  text-align: left;
  padding: 0;
}
.kit-brand .kit-iconbox {
  width: 35px;
  height: 35px;
  border-radius: 50%;
}
.kit-brand strong {
  font: 20px/1.05 var(--kit-serif);
  display: block;
  color: var(--kit-gold2);
}
.kit-brand small {
  color: var(--kit-muted);
  font-size: 9px;
  letter-spacing: 2px;
  text-transform: uppercase;
}
.kit-topmeta {
  display: flex;
  align-items: center;
  justify-content: end;
  gap: 18px;
  margin-left: auto;
  color: var(--kit-muted);
  font-size: 12px;
  white-space: nowrap;
}
.kit-topmeta b {
  color: var(--kit-ink);
  font-weight: 600;
}
.kit-topicon {
  display: grid;
  place-items: center;
  position: relative;
  background: transparent;
  border: 0;
  padding: 4px;
  border-radius: 5px;
}
.kit-topicon .kit-iconbox {
  width: 20px;
  height: 20px;
  border: 0;
}
.kit-topicon .kit-avatar {
  width: 39px;
  height: 39px;
}
.kit-unread::after {
  content: "";
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--kit-gold);
  position: absolute;
  top: 2px;
  right: 1px;
}
.atlas-kit-active #nav {
  max-width: none;
  position: sticky;
  top: 64px;
  z-index: 7;
  background: #121b16;
  border-bottom: 1px solid #49513e;
}
.atlas-kit-active .nav-band {
  align-items: center;
  gap: 13px;
  min-height: 39px;
  padding: 0 28px;
  border-top: 1px solid #29382e;
  border-bottom: 0;
  background: #121b16;
}
.atlas-kit-active .nav-band:last-child {
  background: #201f19;
}
.atlas-kit-active .nav-band-label {
  flex: 0 0 86px;
  border: 0;
  padding: 0;
  font-size: 9px;
  letter-spacing: 2px;
  font-weight: 800;
}
.atlas-kit-active .nav-scroll {
  display: flex;
  justify-content: flex-start;
  flex: 1;
  gap: 2px;
  padding: 0;
}
.atlas-kit-active #nav .nav-tab {
  display: flex;
  flex-direction: row;
  align-items: center;
  justify-content: center;
  gap: 7px;
  flex: 0 0 auto;
  min-width: 0;
  max-width: none;
  min-height: 37px;
  white-space: nowrap;
  padding: 8px 10px 7px;
  border: 0;
  border-bottom: 2px solid transparent;
  border-radius: 0;
  background: none;
  font-size: 12px;
}
.atlas-kit-active .nav-tab .menu-icon {
  width: 16px;
  height: 16px;
  border-radius: 3px;
  background: transparent;
  border: 0;
}
.atlas-kit-active .nav-tab .menu-icon img {
  width: 16px;
  height: 16px;
  border-radius: 3px;
}
.atlas-kit-active .nav-tab:hover {
  background: #29362c;
}
.atlas-kit-active .nav-tab[aria-current] {
  background: #d6b57415;
  border-color: var(--kit-gold);
  color: var(--kit-gold2);
  box-shadow: none;
}
.atlas-kit {
  max-width: 1510px;
  margin: auto;
  padding: 30px 32px 55px;
  color: var(--kit-ink);
  font:
    14px/1.5 system-ui,
    -apple-system,
    "Segoe UI",
    sans-serif;
}
.atlas-kit h2,
.atlas-kit h3,
.atlas-kit h4,
.atlas-kit p {
  margin: 0;
}
.atlas-kit h2,
.atlas-kit h3 {
  color: var(--kit-gold2);
  font-family: var(--kit-serif);
  font-weight: 400;
}
.atlas-kit h3 {
  font-size: 21px;
  line-height: 1.18;
}
.atlas-kit p {
  line-height: 1.65;
}
.atlas-kit small,
.atlas-kit .muted {
  color: var(--kit-muted);
  font-size: 12px;
}
.atlas-kit .eyebrow {
  font-size: 10px;
  font-weight: 750;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--kit-gold);
  margin-bottom: 9px;
}
.kit-row {
  display: flex;
  gap: 12px;
  align-items: center;
  min-width: 0;
}
.kit-grow {
  flex: 1;
  min-width: 0;
}
.kit-inline {
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.kit-iconbox {
  display: inline-grid;
  place-items: center;
  width: 44px;
  height: 44px;
  border: 1px solid #6b6048;
  background: #2e3025;
  color: #d8b777;
  border-radius: 6px;
  overflow: hidden;
  flex: none;
  vertical-align: middle;
}
.kit-iconbox img {
  width: 100%;
  height: 100%;
  display: block;
  object-fit: cover;
}
.kit-avatar {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  object-fit: cover;
  border: 1px solid #958160;
  flex: none;
}
.kit-small,
.atlas-kit .kit-create {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  border: 1px solid #4d594a;
  border-radius: 6px;
  background: #29372c;
  color: var(--kit-ink);
  padding: 7px 10px;
  font-weight: 650;
  font-size: 12px;
  white-space: nowrap;
}
.kit-small .kit-iconbox,
.kit-create .kit-iconbox,
.kit-inline .kit-iconbox {
  width: 17px;
  height: 17px;
  border: 0;
  border-radius: 3px;
}
.atlas-kit .kit-create {
  background: linear-gradient(130deg, #e1c38a, #b99459);
  border-color: #e4c78d;
  color: #181d15;
  padding: 10px 15px;
  font-size: 13px;
}
.kit-field,
.atlas-kit input,
.atlas-kit select {
  border: 1px solid #435242;
  background: #111b15;
  color: var(--kit-ink);
  padding: 10px 12px;
  border-radius: 6px;
}
.kit-field {
  width: auto;
  max-width: 100%;
}
.kit-wideart {
  position: relative;
  isolation: isolate;
  overflow: hidden;
  border-radius: 9px;
  border: 1px solid #625a43;
  min-height: 226px;
  display: flex;
  align-items: end;
}
.kit-cover-image,
.kit-wideart::after {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  z-index: -2;
}
.kit-cover-image {
  object-fit: cover;
  object-position: center 46%;
}
.kit-wideart::after {
  content: "";
  z-index: -1;
  background:
    linear-gradient(90deg, #0d1410f5, #0d1410c7 34%, #0d141038 70%, #0d14100f),
    linear-gradient(0deg, #101713b8, transparent 60%);
}
.kit-herotext {
  padding: 25px 28px;
  max-width: 650px;
}
.kit-herotext h2,
.kit-sectionhead h2 {
  font: 400 clamp(32px, 3.8vw, 48px) / 1.04 var(--kit-serif);
  letter-spacing: -1.6px;
}
.kit-herotext h2 {
  color: #f4e3bf;
  text-shadow: 0 2px 18px #131913;
}
.kit-herotext p {
  max-width: 480px;
  color: #d7dfca;
  margin-top: 10px;
}
.kit-herotext .kit-stay-dates {
  margin-top: 6px;
  font-size: 12px;
}
.kit-card-loot {
  display: block;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  color: var(--kit-muted);
}
.kit-hero-actions {
  position: absolute;
  top: 16px;
  right: 16px;
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  justify-content: flex-end;
}
.kit-staylayout {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 300px;
  gap: 22px;
  margin-top: 21px;
  align-items: start;
}
.kit-sticky {
  position: sticky;
  top: 165px;
  min-width: 0;
}
.kit-staylayout > section > .kit-subhead:first-child {
  margin-top: 0;
}
.kit-subhead {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  margin: 24px 0 13px;
}
.kit-subhead h3 {
  font-size: 27px;
}
.kit-activitygrid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 14px;
}
.kit-artcard {
  position: relative;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  align-items: stretch;
  min-width: 0;
  border: 1px solid var(--kit-line);
  border-radius: 8px;
  background: var(--kit-panel);
  color: var(--kit-ink);
  text-align: left;
  padding: 0;
  transition:
    border-color 0.15s,
    transform 0.15s;
}
.kit-artcard:hover {
  border-color: #ad925a;
  transform: translateY(-2px);
  background: var(--kit-panel);
}
.kit-artcard img.kit-card-art {
  width: 100%;
  height: 117px;
  object-fit: cover;
  display: block;
}
.kit-artcard.kit-locked {
  opacity: 0.76;
}
.kit-artcard.kit-locked .kit-card-art {
  filter: saturate(0.4) brightness(0.65);
}
.kit-stamp {
  position: absolute;
  top: 10px;
  left: 10px;
  background: #101911d9;
  border: 1px solid #88794d;
  color: var(--kit-gold2);
  border-radius: 4px;
  padding: 5px 8px;
  font-size: 11px;
}
.kit-card-content {
  padding: 15px;
  display: grid;
  gap: 6px;
  flex: 1;
}
.kit-badge {
  display: inline-flex;
  align-self: end;
  font-size: 11px;
  font-weight: 650;
  color: var(--kit-green);
}
.kit-badge.kit-no {
  color: var(--kit-red);
}
.kit-toolbar {
  display: flex;
  gap: 10px;
  align-items: center;
  flex-wrap: wrap;
  margin-bottom: 16px;
}
.kit-panel {
  border: 1px solid var(--kit-line);
  border-radius: 9px;
  padding: 20px;
  background: var(--kit-panel);
  min-width: 0;
}
.kit-panel.kit-today {
  background: linear-gradient(145deg, #293629, #1b251e);
  border-color: #53654a;
}
.kit-task-panel {
  padding: 8px 16px;
}
.kit-time {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  margin: 16px 0 8px;
}
.kit-time b {
  font: 25px var(--kit-serif);
  color: var(--kit-gold2);
}
.kit-progress {
  height: 8px;
  background: #101a14;
  border-radius: 9px;
  overflow: hidden;
  border: 1px solid #3e4b38;
}
.kit-progress i {
  display: block;
  height: 100%;
  background: linear-gradient(90deg, #78965f, #b4ce8a);
  border-radius: 9px;
}
.kit-quick {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 8px;
  margin-top: 18px;
}
.kit-quick button {
  background: #19271d;
  border: 1px solid #435242;
  border-radius: 6px;
  padding: 12px 4px;
  text-align: center;
  color: #d7e2ca;
}
.kit-quick .kit-iconbox {
  display: grid;
  margin: 0 auto 6px;
  width: 24px;
  height: 24px;
}
.kit-quick button:hover {
  border-color: var(--kit-gold);
}
.kit-listrow {
  display: flex;
  gap: 12px;
  align-items: center;
  padding: 11px 0;
  border: 0;
  border-bottom: 1px solid var(--kit-line);
  width: 100%;
  background: none;
  text-align: left;
  color: var(--kit-ink);
}
.kit-listrow:last-child {
  border: 0;
}
.kit-listrow:hover:not(p) {
  color: var(--kit-gold2);
  background: transparent;
}
.kit-listrow .kit-grow small {
  display: block;
}
.kit-sectionhead {
  display: flex;
  align-items: end;
  gap: 15px;
  justify-content: space-between;
  margin-bottom: 20px;
  position: relative;
  isolation: isolate;
}
.kit-sectionhead h2 {
  font-size: 40px;
  color: var(--kit-ink);
}
.kit-sectionhead p {
  color: var(--kit-muted);
  margin-top: 7px;
}
.kit-sectionhead.kit-section-art {
  padding: 20px;
  min-height: 130px;
  border-radius: 9px;
  overflow: hidden;
}
.kit-section-art::after {
  content: "";
  position: absolute;
  inset: 0;
  z-index: -1;
  background: linear-gradient(90deg, #121b15ec, #121b155e);
}
.kit-craft-hero .kit-grow small {
  display: block;
}
.kit-tabs {
  display: flex;
  gap: 5px;
  overflow-x: auto;
  scrollbar-width: thin;
  margin-bottom: 16px;
}
.kit-tabs:empty {
  display: none;
}
.kit-tab {
  display: flex;
  align-items: center;
  flex: none;
  gap: 6px;
  border: 1px solid var(--kit-line);
  background: transparent;
  border-radius: 5px;
  padding: 7px 13px;
  color: var(--kit-muted);
  font-weight: 650;
}
.kit-tab[aria-pressed="true"] {
  border-color: #a88b53;
  background: #463c28;
  color: var(--kit-gold2);
}
.kit-tab .kit-iconbox {
  width: 18px;
  height: 18px;
  border-radius: 3px;
  border: 0;
}
.kit-recipe-layout {
  display: grid;
  grid-template-columns: 300px minmax(0, 1fr);
  border: 1px solid var(--kit-line);
  background: var(--kit-panel);
  border-radius: 9px;
  overflow: hidden;
  min-height: 440px;
}
.kit-recipe-sidebar {
  border-right: 1px solid var(--kit-line);
  padding: 13px;
  background: #131d17;

/* Library is a reusable local dialog; imagery is paged and lazy-loaded. */
.atlas-icon-picker {
  width: min(780px, 100% - 22px);
  max-height: 90dvh;
  padding: 16px;
  overflow: auto;
  background: #19221e;
  color: #f1e7cf;
  border: 1px solid #88794d;
  border-radius: 8px;
  box-shadow: 0 14px 60px #0008;
}
.atlas-icon-picker::backdrop {
  background: #080e0bbd;
}
.atlas-icon-picker header,
.atlas-icon-picker footer,
.icon-pagination,
.icon-picker-preview,
.icon-upload {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 8px 0;
}
.atlas-icon-picker header {
  padding-top: 0;
}
.atlas-icon-picker header h2 {
  margin: 0;
}
.icon-filters {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 10px;
}
.icon-filters label,
.icon-upload label {
  display: grid;
  gap: 4px;
  min-width: 0;
}
.icon-picker-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(74px, 1fr));
  gap: 6px;
}
.icon-picker-grid button {
  display: grid;
  justify-items: center;
  gap: 4px;
  min-width: 0;
  padding: 5px;
}
.icon-picker-grid button img {
  width: 36px;
  height: 36px;
  object-fit: cover;
}
.icon-picker-grid button span {
  max-width: 100%;
  overflow: hidden;
  text-overflow: ellipsis;
  font-size: 10px;
}
.icon-picker-grid button[aria-pressed="true"] {
  border-color: #d8b777;
  background: #463c28;
}
.icon-picker-preview {
  justify-content: flex-start;
  border-top: 1px solid #364238;
}
.icon-picker-preview p {
  margin: 0;
  color: #a9b5a7;
}
.icon-upload input {
  width: 100%;
}
.icon-upload button {
  white-space: nowrap;
}
.atlas-icon-picker footer {
  flex-wrap: wrap;
}
@media (max-width: 420px) {
  .atlas-icon-picker {
    padding: 11px;
  }
  .icon-filters {
    grid-template-columns: 1fr;
  }
  .icon-picker-grid {
    grid-template-columns: repeat(auto-fill, minmax(57px, 1fr));
  }
}

function worldPoint(e){const svg=$('mapsvg'),p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;return p.matrixTransform(svg.getScreenCTM().inverse())}

function riskTag(r){return `<span class="tag ${['low','med','high'][r.risk]}">${RISKS[r.risk]}</span>`}function duration(r){return r.min===r.max?`${r.min} дн.`:`${r.min}–${r.max} дн.`}
function entryRoute(r,from){return `<button class="entry" onclick="selectItem('route',${jsid(r.id)})"><span class="sym" style="color:${kind(r.kind)[2]}">⌁</span><span class="content"><strong>${esc(from?nameOf(r.a===from?r.b:r.a):routeLabel(r))}</strong><small>${esc(kind(r.kind)[1])} · ${duration(r)}${r.name&&from?' · '+esc(r.name):''}</small></span>${r.status==='closed'?'<span class="tag high">Закрыт</span>':riskTag(r)}</button>`}
function renderSidebar(){const el=$('sidebar');if(!el)return;let h='<div class="side-inner">';if(S.journey)h+=journeyPanel();const a=selected?.type==='node'?node(selected.id):null,r=selected?.type==='route'?route(selected.id):null;if(a&&visibleNode(a)){const rum=player&&a.visibility==='rumor';h+=`<section class="section"><div class="eyebrow">Узел · ${esc(type(a.type)[2])}</div><h2>${esc(a.name)}</h2><p class="muted">${rum?'Место известно по слухам':esc(fName(a.faction))}</p>${a.desc?`<p style="white-space:pre-wrap;margin:8px 0">${esc(a.desc)}</p>`:''}${!player&&a.notes?`<div class="notice">Мастер: ${esc(a.notes)}</div>`:''}${!player?`<div class="actions" style="margin-top:10px"><button onclick="editNode(${jsid(a.id)})">Изменить</button><button class="danger ghost" onclick="deleteNode(${jsid(a.id)})">Удалить</button></div><button style="width:100%;margin-top:8px" ${S.journey?'disabled':''} onclick="setLocation(${jsid(a.id)})">${S.company.location===a.id?'Компания находится здесь':'Установить стоянку компании'}</button>`:''}</section><section class="stack">${nodeQuestList(a)}<h3>Связанные маршруты</h3>${S.routes.filter(r=>visibleRoute(r)&&(r.a===a.id||r.b===a.id)).map(r=>entryRoute(r,a.id)).join('')||'<p class="muted">Нет известных маршрутов.</p>'}${!player?`<button onclick="tool='route';routeStart=${jsid(a.id)};drawMap();renderSidebar()">＋ Соединить с другим узлом</button>`:''}</section>`}else if(r&&visibleRoute(r)){const here=S.company.location===r.a||S.company.location===r.b;h+=`<section class="section"><div class="eyebrow">Нить · ${esc(kind(r.kind)[1])}</div><h2>${esc(routeLabel(r))}</h2><p class="muted">${esc(nameOf(r.a))} ↔ ${esc(nameOf(r.b))}</p><div class="row" style="margin:10px 0"><span class="tag">${duration(r)}</span>${riskTag(r)}<span class="tag">${r.status==='closed'?'Закрыт':r.status==='conditional'?'С условиями':'Открыт'}</span>${r.cost?`<span class="tag">${esc(r.cost)} зм</span>`:''}</div>${r.desc?`<p style="white-space:pre-wrap">${esc(r.desc)}</p>`:''}${!player&&r.notes?`<div class="notice" style="margin-top:8px">Мастер: ${esc(r.notes)}</div>`:''}${!player?`<div class="actions" style="margin:10px 0"><button onclick="editRoute(${jsid(r.id)})">Изменить</button><button class="danger ghost" onclick="deleteRoute(${jsid(r.id)})">Удалить</button></div>`:''}<button class="primary" style="width:100%" onclick="beginJourney(${jsid(r.id)})" ${!here||r.status==='closed'||S.journey||player?'disabled':''}>Начать путешествие</button>${!here?'<small>Компания должна находиться в одном из этих узлов.</small>':r.status==='closed'?'<small>Путь закрыт. Найдите обход или измените состояние.</small>':''}</section>${!player?`<section><h3>Таблица событий</h3>${r.events.map((e,i)=>`<p style="margin:7px 0"><span class="tag">${i+1}</span> ${esc(e)}</p>`).join('')}</section>`:''}`}else{h+=`<section class="section"><div class="eyebrow">Картографическая служба</div><h2>Путешествия</h2><p class="muted">Выберите точку или маршрут на карте.</p>${!player&&!S.nodes.length?'<div class="notice" style="margin-top:12px">Загрузите свою карту Азерота. Затем выберите «＋ Узел» и отметьте место кликом. Кнопка «Пример» добавляет тестовые точки на условную сетку.</div>':''}</section><section class="stack"><h3>Известные места</h3><input id="nodeSearch" placeholder="Поиск по названию" value="${esc(searchText)}"><div id="nodeList" class="stack">${S.nodes.filter(visibleNode).filter(a=>a.name.toLowerCase().includes(searchText.toLowerCase())).map(entryNode).join('')||'<div class="empty">Узлов пока нет</div>'}</div></section>`}el.innerHTML=h+'</div>';if($('nodeSearch'))$('nodeSearch').oninput=e=>{searchText=e.target.value;$('nodeList').innerHTML=S.nodes.filter(visibleNode).filter(a=>a.name.toLowerCase().includes(searchText.toLowerCase())).map(entryNode).join('')||'<div class="empty">Ничего не найдено</div>'}}
function loadDemo(){if(player||S.nodes.length)return;const points=[['Терамор','port','f4',.70,.78],['Кабестан','port','f7',.76,.39],['Перекрёсток','village','',.44,.43],['Астранаар','village','f6',.23,.16],['Скрытые руины','ruin','',.29,.72]];S.nodes=points.map(p=>({id:uid(),name:p[0],type:p[1],faction:p[2],x:p[3],y:p[4],visibility:p[0]==='Скрытые руины'?'hidden':'known',desc:'Демонстрационная точка; положение и сведения условны.',notes:''}));const [a,b,c,d,e]=S.nodes.map(a=>a.id);const r=(a,b,name,kind,min,max,risk,events=DEF_EVENTS,visibility='known')=>({id:uid(),a,b,name,kind,min,max,risk,events:[...events],visibility,status:'open',cost:0,desc:'Демонстрационный маршрут.',notes:''});S.routes=[r(a,b,'Большой тракт','road',6,6,1,['Торговец предлагает редкий товар','Спокойная дорога','Спокойная дорога','Встречный караван','Патруль требует хартию','Мост разрушен диверсантами']),r(a,b,'Через Пылевые топи','wild',9,9,2,['Редкие алхимические растения','Спокойная дорога','Спокойная дорога','Хижина травницы','Заболоченная переправа','Логово чёрного дракона']),r(a,b,'Торговое судно','sea',3,5,0,['Выгодная сделка','Спокойное плавание','Спокойное плавание','Встречное судно','Шторм','Пиратские паруса']),r(b,c,'Караванный путь','road',2,2,1),r(c,d,'Северная дорога','road',4,4,1),r(c,e,'Забытая тропа','secret',3,3,2,DEF_EVENTS,'hidden')];S.company.location=a;selected={type:'node',id:a};commit();toast('Добавлены демонстрационные точки и маршруты')}
function log(kind,title,text='',hidden=false,day=S.company.day){S.journal.unshift({id:uid(),kind,title,text,hidden,day,year:S.company.year})}
function beginJourney(id){if(!canTravel()||S.journey||currentStay(S))return;const r=route(id),from=S.company.location;if(!r||r.status==='closed'||![r.a,r.b].includes(from))return;const to=from===r.a?r.b:r.a;const roster=S.company.members.filter(m=>m.active);openModal('Подготовка к путешествию',`<p class="muted">${esc(nameOf(from))} → ${esc(nameOf(to))} · ${duration(r)} · ${RISKS[r.risk]} опасность</p>${r.status==='conditional'?'<div class="notice">Путь доступен с условиями. Мастер должен подтвердить их выполнение.</div>':''}${r.desc?`<p style="margin-top:8px">${esc(r.desc)}</p>`:''}<form id="startForm">${selectField('Проводник','jg',[['random','Определить жребием (d'+(roster.length||1)+')'],...(roster.length?[['physical','Ввести физический жребий']]:[]),['','Без проводника'],...roster.map(m=>[m.id,memberName(m)])],'random')}<div id="manualGuide" class="hidden">${field('Номер на кубике (от 1 до '+roster.length+')','jgd',1,'number','min="1" max="'+Math.max(1,roster.length)+'"') }<small>${roster.map((m,i)=>`${i+1} — ${esc(memberName(m))}`).join(' · ')}</small></div>${field('Стоимость перехода для компании, зм','jc',r.cost,'number','min="0" step="0.01"')}${controls('Отправиться в путь')}</form>`);$('jg').onchange=()=>{$('manualGuide').classList.toggle('hidden',val('jg')!=='physical')};$('startForm').onsubmit=e=>{e.preventDefault();if(!canTravel()||S.journey||currentStay(S))return;const g=val('jg'),cost=player?r.cost:Math.max(0,n(val('jc')));if(cost>S.company.gold){toast('Недостаточно золота в казне');return}let guideDie=g==='random'&&roster.length?roll(roster.length):g==='physical'&&roster.length?int(val('jgd'),1,roster.length):null;let guide=['random','physical'].includes(g)?(guideDie?roster[guideDie-1]?.id:''):g;const days=r.min===r.max?r.min:r.min+roll(r.max-r.min+1)-1;S.company.gold=Math.round((S.company.gold-cost)*100)/100;S.engine.phase='travel';S.journey={routeId:id,from,to,routeName:routeLabel(r),start:S.company.day,days,risk:r.risk,events:[...r.events],guide,guideDie,guideSides:roster.length,cost,rolls:[],outcome:null,guideCheck:null};log('travel','Выход в путь',`${nameOf(from)} → ${nameOf(to)} · ${routeLabel(r)}. Проводник: ${memberName(S.company.members.find(m=>m.id===guide))}. ${days} дн. по плану.`);closeModal();commit()}}
function journeyPanel(){const j=S.journey;if(!j)return '';const g=S.company.members.find(m=>m.id===j.guide);let h=`<section class="section stack"><div class="eyebrow">Путешествие в процессе</div><h3>${esc(nameOf(j.from))} → ${esc(nameOf(j.to))}</h3><p>${esc(j.routeName)} · ${j.days} дн. · ${RISKS[j.risk]} опасность</p><p class="muted">Проводник: <strong style="color:var(--ink)">${esc(memberName(g))}</strong>${j.guideDie?` (жребий d${j.guideSides}: ${j.guideDie})`:''}</p>`;if(j.guideCheck!==null&&j.guideCheck!==undefined)h+=`<p>Выживание: <strong>${j.guideCheck.total}</strong> (${j.guideCheck.roll}${j.guideCheck.mod>=0?'+':''}${j.guideCheck.mod})</p>`;else if(g&&canTravel())h+=`<button onclick="guideCheck()">Бросок Выживания d20 ${signed(guideModifier(g))}</button>`;if(j.outcome===null){if(canTravel())h+=`<button class="primary" onclick="rollJourney()">Бросить ${j.risk===1?'1d6':'2d6'} ${j.risk===0?'· меньший':j.risk===2?'· больший':''}</button><button class="ghost" onclick="manualRoll()">Ввести результат физических кубиков</button>`}else{h+=`<div class="dice">${j.rolls.map(v=>`<div class="die ${v===j.outcome?'chosen':''}">${v}</div>`).join('')}</div><div class="notice"><small>Событие · ${j.outcome}</small><h3>${esc(j.events[j.outcome-1])}</h3><p>${j.outcome>=5?'Разыграйте сцену перед завершением перехода.':j.outcome===4?'Решите, как компания взаимодействует со встречей.':'Путь продолжается.'}</p></div>${!player?'<button class="primary" onclick="finishJourney()">Завершить переход</button>':''}`}if(!player)h+='<button class="ghost danger" onclick="cancelJourney()">Отменить / прервать путь</button>';return h+'</section>'}
function guideCheck(){const j=S.journey;if(!j||j.guideCheck!=null)return;const g=S.company.members.find(m=>m.id===j.guide);if(!g)return;const d=roll(20),mod=guideModifier(g);j.guideCheck={roll:d,mod,total:d+mod};commit()}
function applyRoll(vals){const j=S.journey;if(!j||j.outcome!==null)return;j.rolls=vals;j.outcome=j.risk===0?Math.min(...vals):j.risk===2?Math.max(...vals):vals[0];commit()}
function rollJourney(){const j=S.journey;if(!j||j.outcome!==null)return;applyRoll(Array.from({length:j.risk===1?1:2},()=>roll(6)))}
function manualRoll(){const j=S.journey;if(!j||j.outcome!==null)return;openModal('Физические кубики',`<form id="diceForm">${field('Первый d6','d1',1,'number','min="1" max="6" required')}${j.risk===1?'':field('Второй d6','d2',1,'number','min="1" max="6" required')}${controls('Принять результат')}</form>`);$('diceForm').onsubmit=e=>{e.preventDefault();const a=[int(val('d1'),1,6)];if(j.risk!==1)a.push(int(val('d2'),1,6));closeModal();applyRoll(a)}}
function finishJourney(){if(player||!S.journey||S.journey.outcome===null)return;const j=S.journey;openModal('Завершение перехода',`<form id="finishForm"><p>${esc(nameOf(j.from))} → ${esc(nameOf(j.to))}</p>${field('Итоговое время в пути, дней','fd',j.days,'number','min="0" max="3650" required')}${area('Как разрешилось событие?','fn','','Например: капитан предъявил хартию, патруль пропустил компанию.')}${controls('Прибыть и записать в журнал')}</form>`);$('finishForm').onsubmit=e=>{e.preventDefault();const days=int(val('fd'),0,3650);S.company.day+=days;S.company.location=j.to;const dest=node(j.to);if(dest&&dest.visibility!=='known')dest.visibility='known';const travelled=route(j.routeId);if(travelled&&travelled.visibility!=='known')travelled.visibility='known';log('travel','Прибытие: '+nameOf(j.to),`${nameOf(j.from)} → ${nameOf(j.to)}. ${days} дн. Проводник: ${memberName(S.company.members.find(m=>m.id===j.guide))}. Кубики: ${j.rolls.join(', ')} → ${j.outcome}. ${j.events[j.outcome-1]}${j.guideCheck?` Выживание: ${j.guideCheck.total}.`:''}${val('fn').trim()?'\n'+val('fn').trim():''}`);S.journey=null;S.engine.phase='adventure';selected={type:'node',id:j.to};closeModal();commit();toast('Компания прибыла в '+nameOf(j.to))}}
function cancelJourney(){if(player||!S.journey)return;const j=S.journey;openModal('Прервать путешествие',`<form id="cancelForm"><p>Компания останется в исходном узле. Укажите потраченное время; стоимость перехода не возвращается автоматически.</p>${field('Потрачено дней','cd',0,'number','min="0" max="3650" required')}${area('Причина','cn')}${controls('Прервать путь')}</form>`);$('cancelForm').onsubmit=e=>{e.preventDefault();const days=int(val('cd'),0,3650);S.company.day+=days;log('travel','Путь прерван',`${nameOf(j.from)} → ${nameOf(j.to)}. Потрачено ${days} дн. ${j.outcome?j.events[j.outcome-1]+' ':''}${val('cn')}`);S.journey=null;S.engine.phase='adventure';closeModal();commit()}}
function deleteFaction(id){if(player||!confirm('Удалить фракцию? Связанные узлы станут нейтральными, а её персонажи — независимыми.'))return;S.factions=S.factions.filter(f=>f.id!==id);S.nodes.forEach(a=>{if(a.faction===id)a.faction=''});S.contracts.forEach(c=>{if(c.faction===id)c.faction=''});for(const x of allCharacters())if(x.record.faction===id){x.record.faction='';x.record.factionRank='independent'};for(const rows of Object.values(S.portal))for(const x of rows)if(x.faction===id)x.faction='';commit()}
function renderCompany(){const c=S.company;$('main').innerHTML=`<div class="screen">${header('Хартия Вольной компании','Состав, казна, календарь и место стоянки.',!player?'<button class="primary" onclick="editCompany()">Изменить компанию</button>':'')}<div class="split"><div class="card"><div class="eyebrow">Хартия</div><h2>${esc(c.name)} ${!player?'<button class="ghost quick-pencil" title="Переименовать отряд" onclick="renameCompany()">✎</button>':''}</h2><p>${esc(dayLabel())}</p><p>Казна: <strong style="color:var(--gold)">${esc(c.gold)} зм</strong></p><p>Стоянка: ${esc(c.location&&(!player||node(c.location)?.visibility!=='hidden')?nameOf(c.location):'Не установлена')}</p><p style="white-space:pre-wrap">${esc(c.notes)}</p>${!player?'<div class="actions"><button onclick="switchTab(&quot;camp&quot;)">Развитие лагеря</button><button onclick="treasury()">Операция с казной</button><button onclick="advanceTime()" '+(S.journey?'disabled':'')+'>Пропустить дни</button></div>':''}</div><div class="card"><h3>Верительные грамоты</h3>${S.factions.filter(f=>visibleFaction(f)&&f.charter).map(f=>`<p>✦ <strong>${esc(f.name)}</strong><br>${esc(f.charter)}</p>`).join('')||'<p class="muted">Внесите грамоты на вкладке «Фракции».</p>'}</div></div><div class="pagehead" style="margin-top:24px"><h2 id="companyHeroes">Герои компании</h2>${!player?'<button onclick="editMember()">Создать героя</button>':''}</div><div class="cards">${companyHeroRows().map(m=>`<article class="card" data-hero="${esc(m.id)}"><div class="eyebrow">${esc(m.role||'Участник')}</div>${safeImage(m.image)?`<img class="portal-image portrait" style="border-radius:5px;margin:8px 0" src="${esc(safeImage(m.image))}" alt="Портрет">`:''}<h3>${esc(memberName(m))} ${!player?`<button class="ghost quick-pencil" title="Переименовать персонажа" onclick="renameHero(${jsid(m.id)})">✎</button>`:''}</h3>${affiliationBadge(m)}${personAchievements('hero',m.id)}${m.bio?`<p class="record-body">${esc(m.bio)}</p>`:''}<p>Выживание: ${signed(guideModifier(m))}</p><span class="tag">${m.active?'В отряде':'Не участвует в переходах'}</span>${companyHeroActions(m)}</article>`).join('')||'<p class="muted">Героев пока нет.</p>'}</div></div>`}
function editCompany(){if(player)return;const c=S.company;openModal('Вольная компания',`<form id="cForm">${field('Название','cn',c.name,'text','required')}${field('Год после открытия Тёмного портала','cy',c.year,'number','min="1" required')}${field('День кампании','cday',c.day,'number','min="1" required')}${field('Казна, зм','cg',c.gold,'number','min="0" step="0.01" required')}${area('Описание хартии','cnotes',c.notes)}${controls()}</form>`);$('cForm').onsubmit=e=>{e.preventDefault();c.name=val('cn').trim()||'Вольная компания';if(!S.journey){c.year=int(val('cy'),1);c.day=int(val('cday'),1)}c.gold=Math.max(0,n(val('cg')));c.notes=val('cnotes');closeModal();commit()}}
function treasury(){if(player)return;openModal('Казна компании',`<form id="trForm">${field('Изменение, зм (отрицательное — расход)','ta',0,'number','step="0.01" required')}${field('Назначение','tt','','text','required')}${controls('Записать операцию')}</form>`);$('trForm').onsubmit=e=>{e.preventDefault();const a=n(val('ta'));if(S.company.gold+a<0){toast('Недостаточно средств');return}S.company.gold=Math.round((S.company.gold+a)*100)/100;log('gold',val('tt'),`${a>=0?'+':''}${a} зм. Остаток: ${S.company.gold} зм.`);closeModal();commit()}}
function advanceTime(){if(player||S.journey)return;openModal('Течение времени',`<form id="timeForm">${field('Дней','td',1,'number','min="1" required')}${field('Причина','tn','Отдых и дела в лагере')}${controls('Продвинуть календарь')}</form>`);$('timeForm').onsubmit=e=>{e.preventDefault();const days=int(val('td'),1);S.company.day+=days;log('time',val('tn')||'Течение времени',`Прошло ${days} дн.`);closeModal();commit()}}
function removeMember(id){if(player)return;if(accounts.some(a=>a.heroes.includes(id))||S.company.inventory.some(x=>x.owner==='member:'+id&&x.qty>0)||S.engine.profiles?.[id]?.wallet||S.engine.projects?.some(j=>j.hero===id&&j.status==='active'))return toast('Перед удалением переназначьте аккаунт, имущество и открытые проекты героя.');if(S.journey?.guide===id){toast('Проводник сейчас в пути');return}if(confirm('Удалить участника?')){S.company.members=S.company.members.filter(m=>m.id!==id);commit()}}
function renderCamp(){$('main').innerHTML=`<div class="screen">${header('Лагерь компании','Четыре ветки развития. Отметки отражают решения за игровым столом.')}<div class="cards">${TALENTS.map(([branch,items])=>`<div class="card"><h3>${esc(branch)}</h3>${items.map((t,i)=>`<div class="row rule"><span class="tag">${i+1}</span><div style="flex:1"><strong>${esc(t)}</strong><br><small>${[100,300,750][i]} зм · ориентировочная стоимость</small></div>${player?`<span class="tag">${S.company.talents[t]?'Открыто':'Закрыто'}</span>`:`<button class="${S.company.talents[t]?'active':''}" onclick="toggleTalent(${jsid(t)})">${S.company.talents[t]?'Открыто':'Отметить'}</button>`}</div>`).join('')}</div>`).join('')}</div><div class="pagehead" style="margin-top:24px"><h2>Специалисты лагеря</h2>${!player?'<button onclick="editStaff()">＋ Специалист</button>':''}</div><div class="cards">${S.company.staff.map(s=>`<div class="card"><h3>${esc(s.name)}</h3><small>${esc(s.role)}</small>${affiliationBadge(s)}<p>${esc(s.desc)}</p>${!player?`<div class="actions"><button onclick="editStaff(${jsid(s.id)})">Изменить</button><button class="danger ghost" onclick="removeStaff(${jsid(s.id)})">Удалить</button></div>`:''}</div>`).join('')||'<div class="empty">Специалистов пока нет.</div>'}</div></div>`}
function toggleTalent(t){if(player)return;const branch=TALENTS.find(b=>b[1].includes(t))?.[1];if(!branch)return;const i=branch.indexOf(t),v=!!S.company.talents[t];if(!v&&i>0&&!S.company.talents[branch[i-1]]){toast('Сначала откройте предыдущую ступень');return}if(v&&branch.slice(i+1).some(x=>S.company.talents[x])){toast('Сначала закройте следующие ступени');return}if(!confirm(v?'Закрыть талант?':'Отметить улучшение полученным? Казна автоматически не изменится.'))return;S.company.talents[t]=!v;log('camp',v?'Улучшение закрыто: '+t:'Улучшение лагеря: '+t);commit()}
function editStaff(id){if(player)return;const s=id?S.company.staff.find(x=>x.id===id):{name:'',role:'',desc:''};if(!s)return;openModal('Специалист лагеря',`<form id="sForm">${field('Имя','sn',s.name,'text','required')}${field('Профессия','sr',s.role)}${affiliationFields('saff','srank',s)}${area('Описание','sd',s.desc)}${controls()}</form>`);bindAffiliation('saff','srank');$('sForm').onsubmit=e=>{e.preventDefault();const obj={...s,id:id||uid(),name:val('sn').trim(),role:val('sr'),desc:val('sd'),...readAffiliation('saff','srank')};if(id)Object.assign(s,obj);else S.company.staff.push(obj);closeModal();commit()}}

function editLog(id){if(player)return;const j=id?S.journal.find(x=>x.id===id):{title:'',text:'',hidden:false,day:S.company.day,year:S.company.year,kind:'note'};if(!j)return;openModal('Запись в журнале',`<form id="lForm">${field('Заголовок','lt',j.title,'text','required')}${area('Событие','lx',j.text)}${check('Скрытая запись мастера','lh',j.hidden)}${id?`<button type="button" class="ghost danger" onclick="removeLog(${jsid(id)})">В архив</button>`:''}${controls()}</form>`);$('lForm').onsubmit=e=>{e.preventDefault();const obj={...j,id:id||uid(),title:val('lt'),text:val('lx'),hidden:$('lh').checked};if(id)Object.assign(j,obj);else S.journal.unshift(obj);closeModal();commit()}}

function renderHelp(){$('main').innerHTML=`<div class="screen">${header('Правила путешествий','Одна нить — один этап. Один бросок — одно потенциальное событие.')}<div class="card stack" style="margin-bottom:16px"><h3>Награды, банк и задания на карте</h3><p>Создайте задание на доске или непосредственно в карточке узла. Доступные задания отмечены жёлтым !, действующие — ?. Настройте структурированные награды; при завершении подтвердите фактическую выдачу. Текстовые награды сами по себе не начисляются. В банке у каждой позиции есть владелец, а кнопка ⇄ передаёт всё количество или его часть. Завершённые ранее задания не начисляются повторно.</p></div><div class="split"><div class="card stack"><h3>Как начать</h3><p>1. Загрузите изображение карты или включите демонстрационный пример.</p><p>2. Нажмите «＋ Узел» и отметьте место кликом. Настройте иконку, фракцию и видимость.</p><p>3. Нажмите «Маршрут», затем два узла. Задайте время, риск и таблицу d6. Между одной парой узлов может быть несколько маршрутов.</p><p>4. Установите стоянку компании. Выберите нить, нажмите «Начать путешествие».</p><p>5. Выберите проводника или бросьте жребий среди активных персонажей. При необходимости сделайте проверку Выживания.</p><p>6. Бросьте кубики путешествия или введите физические броски. Разыграйте событие и подтвердите итоговый срок. Компания переместится автоматически.</p></div><div class="card stack"><h3>Опасность маршрута</h3><p><span class="tag low">Низкая</span> 2d6, меньший результат.</p><p><span class="tag med">Обычная</span> 1d6.</p><p><span class="tag high">Высокая</span> 2d6, больший результат.</p><h3 class="rule">Базовая таблица d6</h3>${DEF_EVENTS.map((x,i)=>`<p>${i+1} · ${esc(x)}</p>`).join('')}<p class="muted">Это домашние правила, не официальная механика D&D. Проверка Выживания не меняет результат автоматически: последствия решает мастер.</p></div><div class="card stack"><h3>Карта и видимость</h3><p>Координаты узлов хранятся относительно размеров подложки. После замены изображения географически иной картой передвиньте точки вручную. Маршруты автоматически последуют за узлами.</p><p>«Режим игроков» скрывает тайные узлы, маршруты и заметки мастера в интерфейсе. Это режим показа на одном устройстве, а не защищённый доступ или многопользовательская синхронизация.</p><p>Между узлами можно рисовать параллельные нити. При закрытии пути мастер может создать обходную нить или разыграть поиск пути.</p></div><div class="card stack"><h3>Хранение кампании</h3><p>Изменения сохраняются в браузере (IndexedDB, при недоступности — localStorage). Подложка хранится внутри кампании. Рекомендуется регулярно экспортировать JSON: в него входят и карта, и все записи мастера.</p><p>При очистке данных браузера, перемещении HTML-файла или переходе на другой компьютер восстановите кампанию из экспортированного JSON. Не передавайте мастерский JSON игрокам.</p>${!player?'<button class="danger" onclick="resetCampaign()">Начать новую кампанию</button>':''}</div></div></div>`}
