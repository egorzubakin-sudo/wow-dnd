function normalizeBook(b){
 if(!b||!Array.isArray(b.chapters)||!b.chapters.length||!b.chapters.every(c=>c&&typeof c.title==='string'&&typeof c.text==='string'&&typeof c.image==='string'))throw Error('Нужна книга с непустым массивом глав: title, text, image.');
 return {title:String(b.title||WORLD_BOOK.title),subtitle:String(b.subtitle||WORLD_BOOK.subtitle),year:String(b.year||WORLD_BOOK.year),chapters:b.chapters.map(c=>({title:c.title,text:c.text,image:c.image,uxid:typeof c.uxid==='string'?c.uxid:uid()}))};
}
function bookImage(s){return safeImage(s)||(typeof s==='string'&&/^https?:\/\/[^\s]+$/i.test(s)?s:'')}
function renderWorldBook(){
 const b=S.worldBook;bookPage=clamp(bookPage,0,b.chapters.length-1);const c=b.chapters[bookPage];
 $('main').innerHTML=`<div class="screen">${header(b.title,b.subtitle,!player?'<button class="primary" onclick="editWorldChapter()">Редактировать главу</button>':'')}${!player?`<div class="world-book-tools"><button onclick="addWorldChapter()">＋ Глава</button><button onclick="editBookMeta()">Название книги</button><button onclick="moveWorldChapter(-1)" ${bookPage===0?'disabled':''}>↑ Выше</button><button onclick="moveWorldChapter(1)" ${bookPage===b.chapters.length-1?'disabled':''}>↓ Ниже</button><button class="danger" onclick="deleteWorldChapter()" ${b.chapters.length===1?'disabled':''}>Удалить главу</button><button onclick="$('bookImport').click()">Импорт хроник</button><button onclick="exportWorldBook()">Экспорт хроник</button></div>`:''}<div class="world-book-layout"><aside class="card world-toc"><div class="eyebrow">Оглавление</div>${b.chapters.map((x,i)=>`<button class="${i===bookPage?'active':''}" onclick="turnWorldChapter(${i})">${String(i+1).padStart(2,'0')} · ${esc(x.title)}</button>`).join('')}</aside><article class="world-paper"><div class="eyebrow">Глава ${bookPage+1} · ${esc(b.year)}</div><h2>${esc(c.title)}</h2>${bookImage(c.image)?`<img src="${esc(bookImage(c.image))}" alt="Иллюстрация к главе" referrerpolicy="no-referrer">`:''}<div class="world-chapter">${esc(c.text||'Текст этой главы будет добавлен мастером. Пока книга хранит утверждённое оглавление.')}</div><div class="world-book-footer"><button onclick="turnWorldChapter(${bookPage-1})" ${bookPage===0?'disabled':''}>← Назад</button><small>${bookPage+1} / ${b.chapters.length}</small><button onclick="turnWorldChapter(${bookPage+1})" ${bookPage===b.chapters.length-1?'disabled':''}>Далее →</button></div></article></div></div>`;
}
function turnWorldChapter(i){if(i>=0&&i<S.worldBook.chapters.length){bookPage=i;renderWorldBook();window.scrollTo(0,0)}}
function editWorldChapter(isNew=false){if(player)return;const c=isNew?{title:'',text:'',image:''}:S.worldBook.chapters[bookPage];openModal(isNew?'Новая глава':'Редактировать главу',`<form id="worldChapterForm">${field('Название','wcTitle',c.title,'text','required')}${area('Текст главы','wcText',c.text)}${field('URL иллюстрации (необязательно)','wcUrl',c.image.startsWith('http')?c.image:'')}${c.image?'<p class="muted">Текущая иллюстрация сохраняется, если не заменить или не удалить её.</p>':''}<div class="field"><label for="wcFile">Загрузить иллюстрацию</label><input id="wcFile" type="file" accept="image/png,image/jpeg,image/webp,image/gif,image/bmp,image/avif"></div>${check('Удалить текущую иллюстрацию','wcRemove',false)}${controls()}</form>`);$('wcText').style.minHeight='320px';$('worldChapterForm').onsubmit=async e=>{e.preventDefault();try{const title=val('wcTitle').trim(),text=val('wcText'),url=val('wcUrl').trim(),file=$('wcFile').files[0],remove=$('wcRemove').checked;if(!title)throw Error('Укажите название главы.');if(url&&!bookImage(url))throw Error('Введите корректный HTTP(S) URL.');const image=file?await readImage(file):remove?'':url||c.image;if(player)return;const entry={title,text,image,uxid:c.uxid||uid()};if(isNew){S.worldBook.chapters.push(entry);bookPage=S.worldBook.chapters.length-1}else S.worldBook.chapters[bookPage]=entry;closeModal();commit()}catch(err){toast(err.message)}}}
function addWorldChapter(){editWorldChapter(true)}
function moveWorldChapter(d){if(player)return;const a=S.worldBook.chapters,i=bookPage+d;if(i<0||i>=a.length)return;[a[i],a[bookPage]]=[a[bookPage],a[i]];bookPage=i;commit()}
function deleteWorldChapter(){if(player||S.worldBook.chapters.length<2||!confirm('Удалить текущую главу?'))return;S.worldBook.chapters.splice(bookPage,1);bookPage=Math.max(0,bookPage-1);commit()}
function editBookMeta(){if(player)return;const b=S.worldBook;openModal('Настройки книги',`<form id="worldMetaForm">${field('Название','wbTitle',b.title,'text','required')}${field('Подзаголовок','wbSubtitle',b.subtitle)}${field('Эпоха','wbYear',b.year)}${controls()}</form>`);$('worldMetaForm').onsubmit=e=>{e.preventDefault();b.title=val('wbTitle').trim()||WORLD_BOOK.title;b.subtitle=val('wbSubtitle');b.year=val('wbYear');closeModal();commit()}}
function exportWorldBook(){if(player)return;const u=URL.createObjectURL(new Blob([JSON.stringify({type:'wow-world-chronicles',version:1,...S.worldBook},null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=u;a.download='Warcraft_World_Chronicles.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function legacyBook(raw){if(raw?.worldBook)return normalizeBook(raw.worldBook);const d=raw?.data??raw?.D??raw;return normalizeBook({title:d?.chapters&&d?.settings?WORLD_BOOK.title:d?.title,subtitle:d?.subtitle||WORLD_BOOK.subtitle,year:d?.settings?.year||d?.year||WORLD_BOOK.year,chapters:Array.isArray(d)?d:d?.chapters})}
$('bookImport').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f||player)return;try{const text=await f.text();let b;if(/^\s*\</.test(text)){const doc=new DOMParser().parseFromString(text,'text/html');const p=doc.getElementById('portable'),d=doc.getElementById('defaults');const portable=p?JSON.parse(p.textContent):null;b=legacyBook(portable?.data??JSON.parse(d?.textContent||'null'))}else b=legacyBook(JSON.parse(text));if(!confirm('Заменить только книгу «Хроники Азерота» ('+b.chapters.length+' глав)? Остальные данные Атласа останутся без изменений.'))return;S.worldBook=b;bookPage=0;commit();toast('Хроники импортированы')}catch(err){toast('Ошибка импорта: '+err.message)}};

// v0.5: reputation, shared bank and quest board
const REP_LEVELS=[
 {name:'Враждебность',min:-6000,max:-3000,color:'#be4344',desc:'Представители фракции могут атаковать компанию при встрече. Открытое сотрудничество невозможно.'},
 {name:'Неприязнь',min:-3000,max:0,color:'#d17b38',desc:'Обычные торговля, услуги и переговоры недоступны; исключения определяет мастер.'},
 {name:'Равнодушие',min:0,max:3000,color:'#c8b34e',desc:'Обычные услуги и контракты на общих условиях.'},
 {name:'Дружелюбие',min:3000,max:9000,color:'#78a94e',discount:5,desc:'Доверие, доступ к некоторым поручениям и услугам.'},
 {name:'Уважение',min:9000,max:21000,color:'#54aa68',discount:10,desc:'Особые контракты, рекомендации, доступ к закрытым местам по разрешению.'},
 {name:'Почтение',min:21000,max:42000,color:'#42aeb0',discount:15,desc:'Доверие руководства, редкие товары и услуги, особые привилегии.'},
 {name:'Превознесение',min:42000,max:42999,color:'#9e9ee0',discount:20,desc:'Высшие знаки отличия, гербовые накидки, особые ездовые животные и покровительство — по решению мастера.'}
];
const REGIONS=[['kalimdor','Калимдор'],['eastern','Восточные королевства'],['world','Азерот']];
const DEFAULT_REGION={f0:'eastern',f1:'eastern',f2:'eastern',f3:'eastern',f4:'kalimdor',f5:'kalimdor',f6:'kalimdor',f7:'world',f8:'eastern',f9:'world',f10:'eastern',f11:'eastern',f12:'eastern',f13:'eastern',f14:'eastern',f15:'eastern',f16:'eastern',f17:'eastern',f18:'world',f19:'world'};
const OLD_REP={'Вражда':-6000,'Настороженность':-3000,'Нейтралитет':0,'Благосклонность':3000,'Доверие':9000,'Покровительство':21000};
const ITEM_TYPES=['Оружие','Броня','Материалы','Магические предметы','Припасы','Снаряжение','Ездовые питомцы','Прочее'];
const ITEM_QUAL=[['common','Обычное','#eee6d0'],['uncommon','Необычное','#65cf48'],['rare','Редкое','#62a8ff'],['epic','Эпическое','#bb81ed'],['legendary','Легендарное','#f7a640']];
const repClamp=v=>Math.max(-6000,Math.min(42999,Math.trunc(n(v))));
function reputation(f){let p=repClamp(f.repPoints);return REP_LEVELS.slice().reverse().find(l=>p>=l.min)||REP_LEVELS[0]}
function prepareV4(data){
 data.company.inventory=Array.isArray(data.company.inventory)?data.company.inventory.filter(x=>x&&typeof x==='object'&&typeof x.id==='string').map(x=>Object.assign(x,{qty:Math.max(0,int(x.qty??1)),quality:ITEM_QUAL.some(q=>q[0]===x.quality)?x.quality:'common',category:ITEM_TYPES.includes(x.category)?x.category:({'Расходники':'Припасы','Реликвии':'Магические предметы','Документы':'Снаряжение'}[x.category]||'Прочее'),owner:typeof x.owner==='string'?x.owner:''})):[];
 for(const f of data.factions){if(!REGIONS.some(r=>r[0]===f.region))f.region=DEFAULT_REGION[f.id]||'world';if(f.repPoints==null||!Number.isFinite(Number(f.repPoints))){f.repPoints=OLD_REP[f.rep]??REP_LEVELS.find(l=>l.name===f.rep)?.min??0;if(['f9','f18'].includes(f.id)&&(!f.rep||['Нейтралитет','Равнодушие'].includes(f.rep)))f.repPoints=-6000;}f.repPoints=repClamp(f.repPoints);f.rep=reputation(f).name;}
 for(const c of data.contracts){c.faction=c.faction||'';c.giver=c.giver||'';c.rewardSecret=c.rewardSecret||'';c.rewardHidden=!!c.rewardHidden;c.rewardRevealed=!!c.rewardRevealed;c.objectives=c.objectives||'';c.rewards=Array.isArray(c.rewards)?c.rewards.filter(x=>x&&typeof x==='object'):[];}
 return data;
}
function repBar(f){const l=reputation(f),v=f.repPoints-l.min,span=l.max-l.min;return `<div class="rep-label"><b style="color:${l.color}">${l.name}</b><small>${v.toLocaleString('ru-RU')} / ${span.toLocaleString('ru-RU')}</small></div><div class="wow-rep" role="progressbar" aria-label="${l.name}" aria-valuemin="0" aria-valuemax="${span}" aria-valuenow="${v}"><i style="width:${100*v/span}%;background:${l.color}"></i><span>${f.repPoints>0?'+':''}${f.repPoints.toLocaleString('ru-RU')}</span></div>`}
function factionCard(f){const l=reputation(f);return `<article class="card faction-wow"><div class="faction-head"><div class="swatch" style="background:${safeColor(f.color)}">${esc(f.icon||'⚑')}</div><div><h3>${esc(f.name)}</h3><small>${esc(factionLeaderLabel(f))}</small></div></div>${repBar(f)}<p>${esc(f.desc||'')}</p>${factionRoster(f)}${factionDiplomacy(f)}<small>${esc(l.desc)}${l.discount?' Ориентир скидки: '+l.discount+'%.':''}</small><div class="rule"><p>${esc(f.charter||'Верительных грамот пока нет')}</p><small>Узлов: ${S.nodes.filter(a=>a.faction===f.id&&visibleNode(a)).length}</small>${!player&&f.hidden?' · <span class="tag">Скрыто</span>':''}${!player&&f.notes?`<p class="muted">Мастер: ${esc(f.notes)}</p>`:''}</div>${!player?`<div class="actions"><button class="primary" onclick="changeRep(${jsid(f.id)})">± Репутация</button><button onclick="editFaction(${jsid(f.id)})">Изменить</button><button class="ghost danger" onclick="deleteFaction(${jsid(f.id)})">Удалить</button></div>`:''}</article>`}
function renderFactions(){let fs=S.factions.filter(visibleFaction);let groups=[...REGIONS,['hostile','Враждебные фракции']];$('main').innerHTML=`<div class="screen">${header('Репутация','Фракции Азерота · отношения с Вольной компанией.',`<div class="actions"><button onclick="switchTab('diplomacy')">Дипломатия →</button>${!player?'<button class="primary" onclick="editFaction()">＋ Фракция</button>':''}</div>`)}<details class="card rep-help"><summary>Уровни репутации и привилегии</summary>${REP_LEVELS.slice().reverse().map(l=>`<div class="rep-guide"><b style="color:${l.color}">${l.name}</b><span>${(l.max-l.min).toLocaleString('ru-RU')} очков</span><span>${l.discount?l.discount+'% · ':''}${esc(l.desc)}</span></div>`).join('')}<small>Скидки — ориентир, а не автоматическое правило. Хартии и конкретные привилегии определяет мастер.</small></details>${groups.map(([k,label])=>{let rows=fs.filter(f=>k==='hostile'?f.repPoints<-3000:f.repPoints>=-3000&&f.region===k);return `<section class="wow-section"><div class="wow-section-title"><h3>${label}</h3><small>${rows.length}</small></div><div class="cards">${rows.map(factionCard).join('')||'<div class="empty">Нет фракций в этом разделе.</div>'}</div></section>`}).join('')}</div>`}
function changeRep(id){if(player)return;const f=faction(id);if(!f)return;openModal('Репутация: '+f.name,`<form id="repForm">${repBar(f)}${field('Изменение очков (+ / −)','repDelta',0,'number','step="1" required')}${field('Причина','repReason','','text','required')}${controls('Начислить / списать')}</form>`);$('repForm').onsubmit=e=>{e.preventDefault();const old=f.repPoints,oldLevel=reputation(f).name;f.repPoints=repClamp(old+n(val('repDelta')));f.rep=reputation(f).name;log('faction','Репутация: '+f.name,`${val('repReason')} · ${f.repPoints-old>=0?'+':''}${f.repPoints-old} очков. ${oldLevel} → ${f.rep}. Всего: ${f.repPoints}.`,f.hidden);closeModal();commit()}}
function editFaction(id){if(player)return;const f=id?faction(id):{name:'',leader:'',color:'#a79668',icon:'⚑',desc:'',repPoints:0,region:'world',charter:'',notes:'',hidden:false};if(!f)return;openModal(id?'Фракция':'Новая фракция',`<form id="fForm">${field('Название','fnm',f.name,'text','required')}${field('Лидер','fl',f.leader)}${selectField('Регион','freg',REGIONS,f.region)}<div class="cols">${field('Цвет на карте','fc',safeColor(f.color),'color')}${field('Символ','fi',f.icon,'text','maxlength="4"')}</div>${area('Описание','fdesc',f.desc)}${field('Общая репутация (−6000…42999)','fr',f.repPoints,'number','min="-6000" max="42999" step="1" required')}${area('Печати, грамоты, привилегии','fch',f.charter)}${area('Заметки мастера','fnotes',f.notes)}${check('Скрыть фракцию от игроков','fh',f.hidden)}${controls()}</form>`);$('fForm').onsubmit=e=>{e.preventDefault();const obj={...f,id:id||uid(),name:val('fnm').trim(),leader:val('fl'),region:val('freg'),color:val('fc'),icon:val('fi'),desc:val('fdesc'),repPoints:repClamp(val('fr')),charter:val('fch'),notes:val('fnotes'),hidden:$('fh').checked};obj.rep=reputation(obj).name;if(!obj.name)return;if(id){if(f.repPoints!==obj.repPoints||f.charter!==obj.charter)log('faction','Хартия: '+obj.name,`Репутация: ${f.repPoints} → ${obj.repPoints} (${obj.rep}).${obj.charter?'\n'+obj.charter:''}`,obj.hidden);Object.assign(f,obj)}else S.factions.push(obj);closeModal();commit()}}
let bankFilter='',bankQuery='',bankOwner='all';
function renderBank(){const items=S.company.inventory.filter(x=>!player||!x.hidden),rows=items.filter(x=>(!bankFilter||x.category===bankFilter)&&(bankOwner==='all'||(x.owner||'')===bankOwner)&&(!bankQuery||[x.name,x.desc,x.category,ownerLabel(x.owner)].some(v=>String(v||'').toLowerCase().includes(bankQuery.toLowerCase()))));$('main').innerHTML=`<div class="screen">${header('Хранилище отряда','Общий банк и имущество участников Вольной компании.',!player?'<button class="primary" onclick="editItem()">＋ Предмет</button>':'')}<div class="card bank-treasury"><div class="coin-symbol">●</div><div><div class="eyebrow">Общая казна</div><h2>${esc(S.company.gold.toLocaleString('ru-RU'))} <small>зм</small></h2></div>${!player?'<div class="actions"><button class="primary" onclick="treasury()">＋ / − Золото</button><button onclick="setGold()">Установить остаток</button></div>':''}</div><div class="bank-tools"><input id="bankSearch" type="search" placeholder="Поиск предметов" value="${esc(bankQuery)}" oninput="bankSearchChanged(this)"><select onchange="bankFilter=this.value;renderBank()"><option value="">Все категории</option>${ITEM_TYPES.map(t=>`<option ${t===bankFilter?'selected':''}>${t}</option>`).join('')}</select><select aria-label="Владелец" onchange="bankOwner=this.value;renderBank()">${[['all','Все владельцы'],...ownerOptions(bankOwner)].map(([v,l])=>`<option value="${esc(v)}" ${v===bankOwner?'selected':''}>${esc(l)}</option>`).join('')}</select><small>${rows.length} позиций</small></div><div class="bank-tabs">${[['','Все'],...ITEM_TYPES.map(t=>[t,t])].map(([v,l])=>`<button class="${bankFilter===v?'active':''}" onclick="bankFilter=${jsid(v)};renderBank()">${esc(l)} <small>${items.filter(x=>!v||x.category===v).length}</small></button>`).join('')}</div><div class="bank-grid">${rows.map(x=>{const q=ITEM_QUAL.find(q=>q[0]===x.quality)||ITEM_QUAL[0];return `<article class="bank-item" style="--quality:${q[2]}"><button class="item-slot" onclick="openItem(${jsid(x.id)})" aria-label="${esc(x.name)}">${safeImage(x.image)?`<img src="${esc(x.image)}" alt="">`:`<span>${esc(x.icon||'◆')}</span>`}<b>${x.qty}</b></button><div class="item-meta"><button class="item-name" onclick="openItem(${jsid(x.id)})">${esc(x.name)}</button><small>${esc(x.category)} · ${esc(ownerLabel(x.owner))}${!player&&x.hidden?' · скрыто':''}</small>${!player?`<div class="item-actions"><button onclick="itemQty(${jsid(x.id)},-1)" ${x.qty<=0?'disabled':''}>−</button><button onclick="itemQty(${jsid(x.id)},1)">+</button><button onclick="editItem(${jsid(x.id)})">✎</button><button onclick="transferItem(${jsid(x.id)})" ${x.qty<=0?'disabled':''} title="Передать предмет">⇄</button></div>`:''}</div></article>`}).join('')||'<div class="empty">Нет предметов. Добавьте добычу, припасы или материалы.</div>'}</div></div>`}
function bankSearchChanged(el){const pos=el.selectionStart;bankQuery=el.value;renderBank();$('bankSearch').focus();try{$('bankSearch').setSelectionRange(pos,pos)}catch{}}
function setGold(){if(player)return;openModal('Остаток казны',`<form id="goldForm">${field('Итоговое количество золота','goldSet',S.company.gold,'number','min="0" step="0.01" required')}${field('Причина изменения','goldWhy','Корректировка казны','text','required')}${controls()}</form>`);$('goldForm').onsubmit=e=>{e.preventDefault();let old=S.company.gold;S.company.gold=Math.max(0,Math.round(n(val('goldSet'))*100)/100);log('gold',val('goldWhy'),`${old} → ${S.company.gold} зм.`);closeModal();commit()}}
function itemQty(id,d){if(player)return;let x=S.company.inventory.find(i=>i.id===id);if(!x)return;const old=x.qty;x.qty=Math.max(0,int(old+d));if(old!==x.qty)log('item','Хранилище: '+x.name,`${old} → ${x.qty} шт.`,!!x.hidden);commit()}
function openItem(id){const x=S.company.inventory.find(i=>i.id===id);if(!x||player&&x.hidden)return;let q=ITEM_QUAL.find(q=>q[0]===x.quality)||ITEM_QUAL[0];openModal(x.name,`<div class="row"><div class="item-slot" style="--quality:${q[2]}">${safeImage(x.image)?`<img src="${esc(x.image)}" alt="">`:`<span>${esc(x.icon||'◆')}</span>`}</div><div><h3 style="color:${q[2]}">${esc(x.name)}</h3><small>${q[1]} · ${esc(x.category)} · ${x.qty} шт.<br>${esc(ownerLabel(x.owner))}</small></div></div><p class="record-body">${esc(x.desc||'Описание отсутствует.')}</p>${!player?`<div class="actions"><button onclick="editItem(${jsid(id)})">Редактировать</button></div>`:''}`)}
function editItem(id){if(player)return;const x=id?S.company.inventory.find(i=>i.id===id):{name:'',category:'Материалы',quality:'common',qty:1,icon:'◆',image:'',desc:'',hidden:false};if(!x)return;openModal(id?'Предмет хранилища':'Новый предмет',`<form id="itemForm">${field('Название','itemName',x.name,'text','required')}<div class="cols">${selectField('Категория','itemCat',ITEM_TYPES.map(t=>[t,t]),x.category)}${selectField('Качество','itemQuality',ITEM_QUAL.map(q=>[q[0],q[1]]),x.quality)}</div><div class="cols">${field('Количество','itemCount',x.qty,'number','min="0" step="1" required')}${field('Символ (если нет картинки)','itemIcon',x.icon,'text','maxlength="8"')}</div><div class="field"><label>Кастомная иконка</label>${safeImage(x.image)?'<small>Иконка загружена; можно заменить.</small>':''}<input id="itemImage" type="file" accept="image/png,image/jpeg,image/webp,image/gif,image/bmp,image/avif">${safeImage(x.image)?check('Удалить иконку','itemRemove',false):''}</div>${selectField('Владелец','itemOwner',ownerOptions(x.owner),x.owner||'')}${area('Описание / свойства / происхождение','itemDesc',x.desc)}${check('Скрыть от игроков','itemHidden',x.hidden)}${id?`<button type="button" class="ghost danger" onclick="deleteItem(${jsid(id)})">Удалить предмет</button>`:''}${controls()}</form>`);$('itemForm').onsubmit=async e=>{e.preventDefault();const form=$('itemForm');try{let image=$('itemRemove')?.checked?'':x.image||'';if($('itemImage').files[0])image=await readImage($('itemImage').files[0]);if(player||$('itemForm')!==form)return;const o={...x,id:id||uid(),name:val('itemName').trim(),category:val('itemCat'),quality:val('itemQuality'),qty:int(val('itemCount')),owner:val('itemOwner'),icon:val('itemIcon'),image,desc:val('itemDesc'),hidden:$('itemHidden').checked};if(!o.name)return;if(id)Object.assign(x,o);else S.company.inventory.push(o);log('item','Хранилище: '+o.name,`${id?'Обновлено':'Добавлено'} · ${o.qty} шт.`,o.hidden);closeModal();commit()}catch(err){toast(err.message)}}}
function deleteItem(id){if(player||!confirm('Удалить предмет из хранилища?'))return;S.company.inventory=S.company.inventory.filter(x=>x.id!==id);closeModal();commit()}
let questFilter='all',questFaction='';
function questGiver(c){const p=portalData().people.find(x=>x.id===c.giver);return p&&(!player||seen('people',p))?p.title:c.employer||'Наниматель не указан'}
function questFactionName(c){const f=faction(c.faction);return f&&visibleFaction(f)?f.name:''}
function questPlace(c){const a=node(c.location);return a&&visibleNode(a)?a.name:''}
function questReward(c){return `<div class="quest-reward"><h4>Награды</h4>${c.rewardHidden&&!c.rewardRevealed&&player?'<p>Награда пока неизвестна.</p>':`<p>${esc(c.reward||'Не указана')}</p>`}${!player&&c.rewardHidden&&!c.rewardRevealed?'<small>Основная награда скрыта от игроков.</small>':''}${c.rewardSecret&&(!player||c.rewardRevealed)?`<div class="secret-reward"><small>${c.rewardRevealed?'Открытая дополнительная награда':'Скрытая награда · только мастер'}</small><p>${esc(c.rewardSecret)}</p></div>`:''}</div>`}
function questIcon(c){return c.status==='done'?'✓':c.status==='failed'?'×':c.status==='active'?'?':'!'}
function renderContracts(){const all=S.contracts.filter(c=>!c.archived&&(!player||!c.hidden)),rows=all.filter(c=>(questFilter==='all'||c.status===questFilter)&&(!questFaction||questFaction==='none'&&!c.faction||c.faction===questFaction));$('main').innerHTML=`<div class="screen">${header('Доска заданий','Контракты, поручения и приключения.',!player?'<button class="primary" onclick="editContract()">＋ Новое задание</button>':'')}<div class="quest-toolbar"><div class="actions">${[['all','Все'],...CS].map(([k,l])=>`<button class="${questFilter===k?'active':''}" onclick="questFilter='${k}';renderContracts()">${l} <small>${all.filter(c=>k==='all'||c.status===k).length}</small></button>`).join('')}</div><select onchange="questFaction=this.value;renderContracts()"><option value="">Все фракции</option><option value="none" ${questFaction==='none'?'selected':''}>Без фракции</option>${S.factions.filter(visibleFaction).map(f=>`<option value="${esc(f.id)}" ${questFaction===f.id?'selected':''}>${esc(f.name)}</option>`).join('')}</select></div><div class="quest-board">${rows.map(c=>`<article class="quest-card ${c.status}"><div class="quest-heading"><span class="quest-mark">${questIcon(c)}</span><div><small>${esc(CS.find(x=>x[0]===c.status)?.[1]||'Доступен')}${!player&&c.hidden?' · скрыто':''}</small><h3><button class="ux-inline" onclick="openMapQuest(${jsid(c.id)})">${esc(c.title)}</button></h3><span>${esc([questGiver(c),questFactionName(c),questPlace(c)].filter(Boolean).join(' · '))}</span></div></div><div class="quest-content"><p>${esc(c.desc||'')}</p>${c.objectives?`<h4>Цели задания</h4><p>${esc(c.objectives)}</p>`:''}${questReward(c)}${structuredSummary(c)}${!player&&c.notes?`<p class="quest-notes">Мастер: ${esc(c.notes)}</p>`:''}</div>${c.location&&node(c.location)&&visibleNode(node(c.location))?`<div class="quest-map-link"><button onclick="focusQuestMap(${jsid(c.id)})">⌖ Показать на карте</button></div>`:''}${!player?`<div class="quest-actions">${c.status==='available'?`<button class="primary" onclick="questStatus(${jsid(c.id)},'active')">Принять</button>`:c.status==='active'?`<button class="primary" onclick="questStatus(${jsid(c.id)},'done')">Завершить</button>`:''}${(c.rewardHidden||c.rewardSecret)&&!c.rewardRevealed?`<button onclick="revealReward(${jsid(c.id)})">Открыть награду</button>`:''}${c.status!=='done'&&!c.rewardReceipt?`<button onclick="rewardDialog(${jsid(c.id)},false)">Настроить награды</button>`:''}<button onclick="editContract(${jsid(c.id)})">Изменить</button><button onclick="uxDuplicate('contract',${jsid(c.id)})">Копия</button><button onclick="uxFavorite('contract',${jsid(c.id)})">☆</button><button class="ghost danger" onclick="removeContract(${jsid(c.id)})">В архив</button></div>`:''}</article>`).join('')||'<div class="empty">Нет заданий по выбранным условиям.</div>'}</div></div>`}
function questStatus(id,status){if(player)return;const c=S.contracts.find(x=>x.id===id);if(!c||!CS.some(x=>x[0]===status))return;if(status==='done'){rewardDialog(id,true);return}if(c.status==='done'||c.rewardReceipt)return;c.status=status;log('contract','Контракт: '+c.title,CS.find(x=>x[0]===status)[1],c.hidden);commit()}
function revealReward(id){if(player)return;const c=S.contracts.find(x=>x.id===id);if(!c)return;c.rewardRevealed=true;commit()}
function editContract(id,location=''){if(player)return;const c=id?S.contracts.find(x=>x.id===id):{title:'',employer:'',giver:'',faction:'',location,status:'available',desc:'',objectives:'',reward:'',rewardSecret:'',rewardHidden:false,rewardRevealed:false,notes:'',hidden:false};if(!c)return;openModal('Задание',`<form id="coForm">${field('Название','ct',c.title,'text','required')}${selectField('Квестодатель из книги знакомств','cgv',[['','Не привязан'],...portalData().people.map(p=>[p.id,p.title])],c.giver)}${field('Имя квестодателя (если не привязан)','ce',c.employer)}${selectField('Фракция','cf',[['','Без фракции'],...S.factions.map(f=>[f.id,f.name])],c.faction)}${selectField('Узел на карте','cl',[['','Не указано'],...S.nodes.map(a=>[a.id,a.name])],c.location)}${selectField('Статус','cs',c.status==='done'?[['done','Завершён']]:CS.filter(x=>x[0]!=='done'),c.status)}${area('Описание задания','cd',c.desc)}${area('Цели задания','cob',c.objectives)}${area('Обещанная награда','cr',c.reward)}${check('Скрыть основную награду до раскрытия','crh',c.rewardHidden)}${area('Скрытая дополнительная награда (только мастер)','csr',c.rewardSecret)}${check('Награды раскрыты игрокам','crv',c.rewardRevealed)}${area('Заметки мастера','cp',c.notes)}${check('Скрыть всё задание от игроков','ch',c.hidden)}${controls()}</form>`);$('coForm').onsubmit=e=>{e.preventDefault();const obj={...c,id:id||uid(),title:val('ct').trim(),employer:val('ce'),giver:val('cgv'),faction:val('cf'),location:val('cl'),status:val('cs'),desc:val('cd'),objectives:val('cob'),reward:val('cr'),rewardSecret:val('csr'),rewardHidden:$('crh').checked,rewardRevealed:$('crv').checked,notes:val('cp'),hidden:$('ch').checked};if(!obj.title)return;if(id){if(c.status!==obj.status)log('contract','Контракт: '+obj.title,CS.find(x=>x[0]===obj.status)?.[1],obj.hidden);Object.assign(c,obj)}else S.contracts.push(obj);closeModal();commit()}}

// v0.5: inventory ownership, reward transactions and quest map overlay
function ownerLabel(id){if(!id)return 'Общий баланс';const [t,...rest]=id.split(':');const key=rest.join(':');if(t==='member'){const m=S.company.members.find(m=>m.id===key);return m?memberName(m):'Бывший участник'}if(t==='faction'){const f=faction(key);return f&&visibleFaction(f)?'Фракция: '+f.name:'Имущество фракции'}return 'Неизвестный владелец'}
function ownerOptions(current=''){const a=[['','Общий баланс компании'],...S.company.members.map(m=>['member:'+m.id,memberName(m)]),...S.factions.filter(visibleFaction).map(f=>['faction:'+f.id,'Фракция: '+f.name])];if(current&&current!=='all'&&!a.some(x=>x[0]===current)&&!player)a.push([current,ownerLabel(current)]);return a}
function sameItem(a,b){return ['name','category','quality','owner','icon','image','desc'].every(k=>String(a[k]||'')===String(b[k]||''))&&!!a.hidden===!!b.hidden}
function storeItem(o){const existing=S.company.inventory.find(x=>sameItem(x,o)&&x.qty+o.qty<=100000);if(existing){existing.qty+=o.qty;return existing}const v={...o,id:uid()};S.company.inventory.push(v);return v}
function transferItem(id){if(player)return;const x=S.company.inventory.find(i=>i.id===id);if(!x||!x.qty)return;openModal('Передать: '+x.name,`<form id="transferForm"><p class="muted">Текущий владелец: ${esc(ownerLabel(x.owner))} · ${x.qty} шт.</p>${selectField('Новый владелец','toOwner',ownerOptions(x.owner),x.owner||'')}${field('Количество','toQty',x.qty,'number',`min="1" max="${x.qty}" step="1" required`)}${controls('Передать')}</form>`);$('transferForm').onsubmit=e=>{e.preventDefault();const owner=val('toOwner'),qty=Number(val('toQty'));if(owner===(x.owner||''))return toast('Выберите другого владельца.');if(!Number.isInteger(qty)||qty<1||qty>x.qty)return toast('Проверьте количество.');const old=ownerLabel(x.owner),o={...x,owner,qty};if(qty===x.qty){S.company.inventory=S.company.inventory.filter(i=>i.id!==id)}else x.qty-=qty;storeItem(o);log('item','Передача: '+x.name,`${qty} шт. · ${old} → ${ownerLabel(owner)}`,x.hidden);closeModal();commit()}}
function questsAt(a){return S.contracts.filter(c=>!c.archived&&c.location===a.id&&(!player||!c.hidden))}
function questMapMarks(a,sc){if(S.settings.showQuests===false)return '';const qs=questsAt(a),marks=[['available','!'],['active','?']].map(([status,symbol])=>({symbol,count:qs.filter(c=>c.status===status).length})).filter(x=>x.count);return marks.map((m,i)=>`<g transform="translate(${(19+23*i)*sc} ${-20*sc})"><title>${m.count} ${m.symbol==='!'?'доступных':'действующих'} заданий</title><circle r="${12*sc}" fill="#302410" stroke="#b58a36" stroke-width="${sc}"/><text class="quest-pin" text-anchor="middle" y="${6*sc}" fill="#ffda38" font-size="${23*sc}" stroke-width="${2.5*sc}">${m.symbol}</text>${m.count>1?`<text x="${10*sc}" y="${-7*sc}" font-size="${10*sc}" fill="#fff0ad" stroke="#221b11" stroke-width="${2*sc}" paint-order="stroke">${m.count}</text>`:''}</g>`).join('')}
function toggleQuestMarkers(){S.settings.showQuests=S.settings.showQuests===false;commit()}
function nodeQuestList(a){const qs=questsAt(a);return `<div class="quest-node-list"><h3>Задания в этой точке</h3>${qs.map(c=>`<button onclick="openMapQuest(${jsid(c.id)})"><b style="color:${c.status==='done'?'#9bb887':c.status==='failed'?'#c86d65':'#f9d03d'};font-size:19px;margin-right:8px">${questIcon(c)}</b>${esc(c.title)}${!player&&c.hidden?' · скрыто':''}</button>`).join('')||'<p class="muted">Нет заданий.</p>'}${!player?`<button onclick="editContract(null,${jsid(a.id)})">＋ Задание в этом узле</button>`:''}</div>`}
function focusQuestMap(id){const c=S.contracts.find(x=>x.id===id),a=node(c?.location);if(!c||!a||!visibleNode(a)||player&&c.hidden)return;closeModal();const d=dims();if(!view)resetView();view.x=a.x*d.w-view.w/2;view.y=a.y*d.h-view.h/2;selected={type:'node',id:a.id};switchTab('map')}
function openMapQuest(id){const c=S.contracts.find(x=>x.id===id);if(!c||c.archived||player&&c.hidden)return;openModal(c.title,`<div class="quest-card ${esc(c.status)}"><div class="quest-heading"><span class="quest-mark">${questIcon(c)}</span><div><h3>${esc(c.title)}</h3><span>${esc([questGiver(c),questFactionName(c),questPlace(c)].filter(Boolean).join(' · '))}</span></div></div><div class="quest-content"><p>${esc(c.desc||'')}</p>${c.objectives?`<h4>Цели задания</h4><p>${esc(c.objectives)}</p>`:''}${questReward(c)}${structuredSummary(c)}</div></div><div class="actions">${!player&&c.status==='available'?`<button class="primary" onclick="closeModal();questStatus(${jsid(id)},'active')">Принять</button>`:''}${!player&&c.status==='active'?`<button class="primary" onclick="rewardDialog(${jsid(id)},true)">Завершить</button>`:''}${!player?`<button onclick="editContract(${jsid(id)})">Изменить</button>`:''}<button onclick="closeModal();questFilter='all';questFaction='';switchTab('contracts')">Доска заданий</button></div>`)}
const REWARD_TYPES=[['gold','Золото'],['rep','Репутация'],['item','Предмет'],['charter','Верительная грамота']];
function rewardText(r){if(r.type==='gold')return `${r.amount} зм`;if(r.type==='rep')return `${faction(r.faction)&&visibleFaction(faction(r.faction))?faction(r.faction).name:'Фракция'}: ${r.amount>=0?'+':''}${r.amount} репутации`;if(r.type==='charter')return `${faction(r.faction)&&visibleFaction(faction(r.faction))?faction(r.faction).name:'Фракция'} · ${r.text||'Грамота'}`;if(r.type==='item')return `${r.name||'Предмет'} ×${r.qty||1} · ${ownerLabel(r.owner)}`;return ''}
function structuredSummary(c){const awarded=c.rewardReceipt,rs=awarded?.rewards||c.rewards||[],visible=rs.filter(r=>!player||awarded||(!c.rewardHidden||c.rewardRevealed)&&(!r.secret||c.rewardRevealed));if(!rs.length&&!awarded)return '';return `<div class="reward-summary"><h4>${awarded?'Полученные награды':'Награды к начислению'}</h4>${visible.map(r=>`<p>${r.type==='item'&&safeImage(r.image)?`<img src="${esc(r.image)}" alt="" style="width:22px;height:22px;object-fit:cover;vertical-align:middle;border:1px solid #977b42;margin-right:5px">`:''}${esc(rewardText(r))}${!player&&r.secret&&!awarded?' <span class="reward-secret-label">· скрыто</span>':''}</p>`).join('')||'<p>Награды пока неизвестны или отсутствуют.</p>'}${awarded?`<small>Выдано: день ${esc(awarded.day)} · повторное начисление заблокировано</small>`:''}</div>`}
function rewardRow(r,i,c){const p='rw'+i+'_',types=REWARD_TYPES,fs=S.factions.map(f=>[f.id,f.name]),rType=r.type||'gold';return `<div class="reward-row" data-index="${i}"><div class="row"><b>${esc(types.find(t=>t[0]===rType)?.[1]||'Награда')} № ${i+1}</b><button type="button" class="ghost danger" onclick="removeRewardRow(${i})">Удалить</button></div>${rType==='gold'?field('Количество золота',p+'amount',r.amount??0,'number','min="0" step="0.01" required'):rType==='rep'?selectField('Фракция',p+'faction',[['','Выберите фракцию'],...fs],r.faction||c.faction||'')+field('Очки репутации (+ / −)',p+'amount',r.amount??0,'number','step="1" required'):rType==='charter'?selectField('Фракция',p+'faction',[['','Выберите фракцию'],...fs],r.faction||c.faction||'')+area('Текст грамоты / подпись',p+'text',r.text||''): `${field('Название предмета',p+'name',r.name||'','text','required')}<div class="cols">${selectField('Категория',p+'category',ITEM_TYPES.map(t=>[t,t]),r.category||'Материалы')}${selectField('Качество',p+'quality',ITEM_QUAL.map(q=>[q[0],q[1]]),r.quality||'common')}</div><div class="cols">${field('Количество',p+'qty',r.qty??1,'number','min="1" max="100000" step="1" required')}${field('Символ',p+'icon',r.icon||'◆','text','maxlength="8"')}</div>${selectField('Кому передать',p+'owner',ownerOptions(r.owner),r.owner||'')}${area('Описание / свойства',p+'desc',r.desc||'')}<div class="field"><label>Иконка предмета</label><input id="${p}image" type="file" accept="image/png,image/jpeg,image/webp,image/gif,image/bmp,image/avif" onchange="rewardImage(${i},this)"><small id="${p}imageLabel">${safeImage(r.image)?'Иконка сохранена':'Можно загрузить изображение'}</small></div>${safeImage(r.image)?`<button type="button" onclick="clearRewardImage(${i})">Убрать иконку</button>`:''}`}${check('Скрытая награда до раскрытия',p+'secret',r.secret)}</div>`}
let rewardSession=null;
function syncRewardDraft(){const d=rewardSession;if(!d)return;d.rows.forEach((r,i)=>{const p='rw'+i+'_';for(const k of ['amount','faction','text','name','category','quality','qty','icon','owner','desc']){const el=$(p+k);if(el)r[k]=el.type==='number'?el.valueAsNumber:el.value}if($(p+'secret'))r.secret=$(p+'secret').checked});if($('finishReveal'))d.reveal=$('finishReveal').checked}
function redrawRewardRows(){const d=rewardSession,c=S.contracts.find(x=>x.id===d.id);$('rewardRows').innerHTML=d.rows.map((r,i)=>rewardRow(r,i,c)).join('')||'<p class="muted">Нет структурированных наград. Можно завершить без начисления.</p>'}
function addRewardRow(type){syncRewardDraft();rewardSession.rows.push({type,amount:0,qty:1,category:'Материалы',quality:'common',owner:'',icon:'◆',secret:false});redrawRewardRows()}
function removeRewardRow(i){syncRewardDraft();rewardSession.rows.splice(i,1);redrawRewardRows()}
async function rewardImage(i,el){const d=rewardSession,row=d?.rows[i],file=el.files[0];if(!row||!file)return;d.loading=(d.loading||0)+1;try{const image=await readImage(file);if(rewardSession!==d||!d.rows.includes(row)||!$('rewardRows'))return;row.image=image;const idx=d.rows.indexOf(row);if($('rw'+idx+'_imageLabel'))$('rw'+idx+'_imageLabel').textContent='Иконка загружена'}catch(e){toast(e.message)}finally{d.loading--}}
function clearRewardImage(i){syncRewardDraft();rewardSession.rows[i].image='';redrawRewardRows()}
function rewardDialog(id,finish){if(player)return;const c=S.contracts.find(x=>x.id===id);if(!c||c.status==='done'||c.rewardReceipt)return toast('Задание уже завершено.');rewardSession={id,finish,rows:JSON.parse(JSON.stringify(c.rewards||[])),reveal:true};openModal(finish?'Завершение: '+c.title:'Награды: '+c.title,`<form id="rewardForm"><p class="muted">${finish?'Подтвердите фактическую награду. Все позиции будут начислены одним действием; повторная выдача невозможна.':'Задайте обещанные награды. Пока ничего не начисляется.'}</p>${c.reward?`<div class="notice">Обещано: ${esc(c.reward)}</div>`:''}${c.rewardSecret?`<div class="notice">Скрыто: ${esc(c.rewardSecret)}</div>`:''}<div id="rewardRows"></div><div class="actions">${REWARD_TYPES.map(([t,l])=>`<button type="button" onclick="addRewardRow('${t}')">＋ ${l}</button>`).join('')}</div>${finish?check('Раскрыть текстовые скрытые награды игрокам','finishReveal',true):''}${finish?'<p class="reward-note">Фактически выданные структурированные награды становятся видимыми после завершения (если само задание не скрыто). Текстовые награды — справочные, начисляются только позиции выше.</p>':''}${controls(finish?'Подтвердить и выдать награды':'Сохранить награды')}</form>`);redrawRewardRows();$('rewardForm').onsubmit=e=>{e.preventDefault();if(player||rewardSession?.id!==id)return;syncRewardDraft();const d=rewardSession;if(d.loading)return toast('Дождитесь загрузки иконки.');try{const rewards=validateRewards(d.rows);if(finish)applyQuestRewards(c,rewards,d.reveal);else{c.rewards=rewards;closeModal();commit()}}catch(err){toast(err.message)}}}
function validateRewards(rows){return rows.map(r=>{const secret=!!r.secret;if(r.type==='gold'){if(!Number.isFinite(r.amount)||r.amount<0||r.amount>1e9)throw Error('Проверьте количество золота.');return {type:r.type,amount:Math.round(r.amount*100)/100,secret}}if(r.type==='rep'){if(!faction(r.faction)||!Number.isInteger(r.amount)||Math.abs(r.amount)>1e9)throw Error('Проверьте фракцию и очки репутации.');return {type:r.type,faction:r.faction,amount:r.amount,secret}}if(r.type==='charter'){if(!faction(r.faction)||!String(r.text||'').trim())throw Error('Для грамоты нужны фракция и текст.');return {type:r.type,faction:r.faction,text:r.text.trim(),secret}}if(r.type==='item'){if(!String(r.name||'').trim()||!Number.isInteger(r.qty)||r.qty<1||r.qty>100000||!ITEM_TYPES.includes(r.category)||!ITEM_QUAL.some(q=>q[0]===r.quality)||!ownerOptions().some(x=>x[0]===(r.owner||'')))throw Error('Проверьте предмет, количество и владельца.');return {type:r.type,name:r.name.trim(),qty:r.qty,category:r.category,quality:r.quality,owner:r.owner||'',icon:r.icon||'◆',image:safeImage(r.image)||'',desc:r.desc||'',secret}}throw Error('Неизвестный вид награды.')})}
function applyQuestRewards(c,rewards,reveal){if(player||c.status==='done'||c.rewardReceipt)return toast('Награды уже выданы.');const actual=[];for(const r of rewards){if(r.type==='gold'){S.company.gold=Math.round((S.company.gold+r.amount)*100)/100;log('gold','Награда: '+c.title,`+${r.amount} зм. Остаток: ${S.company.gold} зм.`,c.hidden);actual.push(r)}else if(r.type==='rep'){const f=faction(r.faction),old=f.repPoints;f.repPoints=repClamp(old+r.amount);f.rep=reputation(f).name;const x={...r,amount:f.repPoints-old};log('faction','Репутация: '+f.name,`${c.title} · ${x.amount>=0?'+':''}${x.amount} · ${f.rep}`,c.hidden||f.hidden);actual.push(x)}else if(r.type==='charter'){const f=faction(r.faction);if(!String(f.charter||'').split('\n').includes(r.text))f.charter=[f.charter,r.text].filter(Boolean).join('\n');log('faction','Грамота: '+f.name,r.text,c.hidden||f.hidden);actual.push(r)}else if(r.type==='item'){const {type,secret,...o}=r;storeItem({...o,hidden:!!c.hidden});log('item','Добыча: '+r.name,`${r.qty} шт. · ${ownerLabel(r.owner)}`,c.hidden);actual.push(r)}}c.rewards=rewards;c.rewardReceipt={day:S.company.day,year:S.company.year,rewards:actual};c.status='done';if(reveal)c.rewardRevealed=true;log('contract','Контракт: '+c.title,'Завершён.\n'+actual.map(rewardText).join('\n'),c.hidden);closeModal();commit();toast('Задание завершено. Награды выданы.');}

// v0.6 — character affiliations and configurable homepage.
const AFF_RANKS=[['member','Рядовой'],['influential','Влиятельный'],['leader','Лидер']];
function prepareAffiliations(data){const ids=new Set(data.factions.map(f=>f.id));for(const x of [...(data.company.members||[]),...(data.company.staff||[]),...(data.portal?.people||[])]){if(!ids.has(x.faction)){x.faction='';x.factionRank='independent'}else if(!AFF_RANKS.some(r=>r[0]===x.factionRank)){x.factionRank='member'}}return data}
function allCharacters(){return [...S.company.members.map(record=>({kind:'hero',record,name:memberName(record)})),...S.company.staff.map(record=>({kind:'staff',record,name:record.name||'Специалист'})),...(S.portal?.people||[]).map(record=>({kind:'npc',record,name:record.title}))]}
function rankLabel(x){return AFF_RANKS.find(r=>r[0]===x.factionRank)?.[1]||'Независимый'}
function affiliationText(x){const f=faction(x.faction);return f&&visibleFaction(f)?f.name+' · '+rankLabel(x):f?'Принадлежность неизвестна':'Независимый'}
function affiliationFields(fid,rid,x){return `<div class="cols">${selectField('Принадлежность к фракции',fid,[['','Независимый'],...S.factions.map(f=>[f.id,f.name])],x.faction||'')}${selectField('Статус во фракции',rid,[['independent','Независимый'],...AFF_RANKS],x.factionRank|| (x.faction?'member':'independent'))}</div>`}
function bindAffiliation(fid,rid){const f=$(fid),r=$(rid);function update(){if(f.value){r.options[0].disabled=true;r.disabled=false;if(r.value==='independent'||!r.value)r.value='member'}else{r.options[0].disabled=false;r.value='independent';r.disabled=true}}f.addEventListener('change',update);update()}
function readAffiliation(fid,rid){const id=val(fid);return {faction:id,factionRank:id&&AFF_RANKS.some(r=>r[0]===val(rid))?val(rid):id?'member':'independent'}}
function affiliationBadge(x){const f=faction(x.faction);if(!f||!visibleFaction(f))return `<div class="affiliation"><span class="tag">${f?'Принадлежность неизвестна':'Независимый'}</span></div>`;return `<div class="affiliation"><button class="ghost" onclick="focusFaction(${jsid(f.id)})">${esc(f.icon||'⚑')} ${esc(f.name)} →</button><span class="tag aff-rank-${x.factionRank==='leader'?3:x.factionRank==='influential'?2:1}">${esc(rankLabel(x))}</span></div>`}
function factionPeople(f){return allCharacters().filter(x=>!x.record.archived&&x.record.faction===f.id&&(!player||!x.record.hidden)).sort((a,b)=>['leader','influential','member'].indexOf(a.record.factionRank)-['leader','influential','member'].indexOf(b.record.factionRank)||a.name.localeCompare(b.name,'ru'))}
function factionLeaderLabel(f){const linked=factionPeople(f).filter(x=>x.record.factionRank==='leader');return linked.length?linked.map(x=>x.name).join(', '):f.leader||'Лидер не указан'}
function factionRoster(f){const rows=factionPeople(f);return `<details class="aff-roster"><summary>Представители фракции · ${rows.length}</summary>${rows.map(x=>`<button class="aff-person" onclick="openAffPerson('${x.kind}',${jsid(x.record.id)})">${safeImage(x.record.image)?`<img src="${esc(x.record.image)}" alt="">`:''}<span>${esc(x.name)}<br><small>${x.kind==='hero'?'Герой компании':x.kind==='staff'?'Специалист лагеря':'Персонаж мира'}</small></span><small>${esc(rankLabel(x.record))}</small></button>`).join('')||'<p class="muted">Нет связанных персонажей.</p>'}${!player?`<button class="ghost" onclick="editPortal('people',null,{faction:${jsid(f.id)},factionRank:'member'})">＋ Представитель</button>`:''}</details>`}
function focusFaction(id){const f=faction(id);if(!f||!visibleFaction(f))return;closeModal();switchTab('factions');const el=[...document.querySelectorAll('.faction-wow')].find(x=>x.querySelector('h3')?.textContent===f.name);if(el){el.scrollIntoView({block:'center',behavior:'smooth'});const d=el.querySelector('details');if(d)d.open=true}}
function openAffPerson(kind,id){const x=allCharacters().find(x=>x.kind===kind&&x.record.id===id);if(!x||player&&x.record.hidden)return;if(kind==='npc')return openPortalRecord('people',id);const r=x.record;openModal(x.name,`<div class="stack">${safeImage(r.image)?`<img class="record-image" src="${esc(r.image)}" alt="">`:''}<p>${esc(r.role||'')}</p>${affiliationBadge(r)}${personAchievements(kind,id)}<p class="record-body">${esc(r.bio||r.desc||'')}</p><div class="actions">${!player?`<button onclick="${kind==='hero'?'editMember':'editStaff'}(${jsid(id)})">Изменить</button>`:''}<button onclick="closeModal();switchTab('${kind==='hero'?'company':'camp'}')">Открыть раздел →</button></div></div>`)}
const HOME_SECTIONS=[['nav','Верхнее меню разделов'],['hero','Кнопки в приветствии'],['stats','Карточки показателей'],['shortcuts','Плитки быстрого доступа'],['feed','Новости и дела компании'],['footer','Нижние ссылки']];
const HOME_TILES=[['news','Вестник'],['worldbook','Хроники Азерота'],['diplomacy','Дипломатия'],['contracts','Доска заданий'],['bank','Хранилище'],['mail','Почта'],['chronicle','Летопись'],['achievements','Достижения']];
let homeSettingsOpen=false,homeTilesOpen=false,homeLocal={};
function getHomePrefs(){const key=player?'player':'master';if(!homeLocal[key]){try{homeLocal[key]=JSON.parse(localStorage.getItem('atlas-home-v06-'+key)||'{}')||{}}catch{homeLocal[key]={}}}return {...Object.fromEntries(HOME_SECTIONS.map(([k])=>[k,true])),...homeLocal[key],tiles:{...(homeLocal[key].tiles||{})}}}
function setHomePref(key,on,tile=false){const mode=player?'player':'master',p=getHomePrefs();if(tile)p.tiles[key]=on;else p[key]=on;homeLocal[mode]=p;try{localStorage.setItem('atlas-home-v06-'+mode,JSON.stringify(p))}catch{}render()}
function resetHomePrefs(){const mode=player?'player':'master';homeLocal[mode]={};try{localStorage.removeItem('atlas-home-v06-'+mode)}catch{}render()}
function homeSettingsPanel(p){const toggles=(rows,tile)=>rows.map(([k,l])=>`<label class="home-toggle"><span>${esc(l)}</span><input type="checkbox" role="switch" ${ (tile?p.tiles[k]!==false:p[k])?'checked':''} onchange="setHomePref('${k}',this.checked,${tile})"></label>`).join('');return `<details class="card home-settings" ${homeSettingsOpen?'open':''} ontoggle="homeSettingsOpen=this.open"><summary>⚙ Настроить главную страницу</summary><div class="home-switches">${toggles(HOME_SECTIONS,false)}</div><details class="subsettings" ${homeTilesOpen?'open':''} ontoggle="homeTilesOpen=this.open"><summary>Отдельные плитки быстрого доступа</summary><div class="home-switches">${toggles(HOME_TILES,true)}</div></details><div class="actions"><button class="ghost" onclick="resetHomePrefs()">Показать всё</button>${!player?'<button onclick="editNavIcons()">Иконки меню</button>':''}<small>Настройки сохраняются в этом браузере отдельно для мастера и игроков.</small></div></details>`}
const NAV_BANDS=[['Мир',[['home','Главная','⌂'],['map','Карта','✥'],['news','Вестник','▤'],['people','Персонажи мира','♟'],['factions','Фракции','⚑'],['diplomacy','Дипломатия','⚖'],['worldbook','Хроники Азерота','▥'],['codex','Кодекс','▧']]],['Кампания',[['company','Герои и хартия','♜'],['camp','Лагерь','⛺'],['bank','Хранилище','◆'],['contracts','Доска заданий','!'],['mail','Почта','✉'],['chronicle','Летопись','✒'],['achievements','Достижения','★'],['journal','Журнал','▣'],['help','Правила','?']]]];
const DIP_STATES=[['alliance','Союз','#8dc88d'],['cooperation','Сотрудничество','#96bfa9'],['neutral','Нейтралитет','#cfbd86'],['truce','Перемирие','#b4b6db'],['tension','Напряжённость','#e1b06b'],['hostility','Вражда','#e88d65'],['war','Война','#e46f66']];
let dipFaction='',dipStatus='',iconTarget='',navOffsets=[0,0];
function prepareDiplomacy(data){const ids=new Set(data.factions.map(f=>f.id)),pairs=new Set();data.diplomacy=(Array.isArray(data.diplomacy)?data.diplomacy:[]).filter(r=>{if(!r||!ids.has(r.a)||!ids.has(r.b)||r.a===r.b||!DIP_STATES.some(x=>x[0]===r.state))return false;let key=pairKey(r.a,r.b);if(pairs.has(key))return false;pairs.add(key);return true}).map(r=>({...r,id:typeof r.id==='string'?r.id:uid(),desc:String(r.desc||''),notes:String(r.notes||''),hidden:!!r.hidden}));data.settings??={};const old=data.settings.navIcons||{};if(!old.news&&safeImage(old.rumors))old.news=old.rumors;data.settings.navIcons=Object.fromEntries(NAV_BANDS.flatMap(b=>b[1]).filter(([k])=>safeImage(old[k])).map(([k])=>[k,old[k]]));return data}
function pairKey(a,b){return JSON.stringify([a,b].sort())}
function navIcon(k,fallback){const img=safeImage(S.settings.navIcons?.[k]);return img?`<img src="${esc(img)}" alt="">`:esc(fallback||NAV_BANDS.flatMap(b=>b[1]).find(t=>t[0]===k)?.[2]||'◆')}
function renderNavigation(){return NAV_BANDS.map(([label,items],i)=>`<div class="nav-band"><div class="nav-band-label">${label}<small>Азерот · ${i?'отряд':'атлас'}</small></div><div class="nav-scroll" data-band="${i}" onscroll="navOffsets[${i}]=this.scrollLeft">${items.map(([k,l,icon])=>`<button title="${esc(l)}" aria-label="${esc(l)}" ${tab===k?'aria-current="page"':''} class="nav-tab ${tab===k?'active':''}" onclick="switchTab('${k}')"><span class="menu-icon">${navIcon(k,icon)}</span><span>${esc(l)}</span></button>`).join('')}</div></div>`).join('')}
function restoreNavScroll(){document.querySelectorAll('.nav-scroll').forEach(el=>{el.scrollLeft=navOffsets[+el.dataset.band]||0;const b=el.querySelector('.active');if(b){const er=el.getBoundingClientRect(),br=b.getBoundingClientRect();if(br.left<er.left)el.scrollLeft-=er.left-br.left+4;else if(br.right>er.right)el.scrollLeft+=br.right-er.right+4}})}
function editNavIcons(){if(player)return;openModal('Иконки верхнего меню',`<p class="muted">Загрузите квадратные иконки для каждого раздела. Они сохраняются в кампании и входят в JSON. Можно вернуть стандартный символ.</p>${NAV_BANDS.map(([l,items])=>`<h3 class="rule">${l}</h3><div class="icon-edit-grid">${items.map(([k,name,icon])=>`<div class="icon-edit-row"><span class="menu-icon">${navIcon(k,icon)}</span><span class="icon-edit-name">${esc(name)}</span><button onclick="chooseNavIcon('${k}')">Загрузить</button>${S.settings.navIcons[k]?`<button title="Вернуть стандартную" onclick="resetNavIcon('${k}')">×</button>`:''}</div>`).join('')}</div>`).join('')}<div class="actions"><button class="ghost" onclick="resetAllNavIcons()">Сбросить все</button><button class="primary" onclick="closeModal()">Готово</button></div>`)}
function chooseNavIcon(k){if(player)return;iconTarget=k;$('navIconFile').click()}
function resetNavIcon(k){if(player)return;delete S.settings.navIcons[k];commit();editNavIcons()}
function resetAllNavIcons(){if(player||!confirm('Вернуть стандартные иконки всех разделов?'))return;S.settings.navIcons={};commit();editNavIcons()}
$('navIconFile').onchange=async e=>{const f=e.target.files[0],k=iconTarget;e.target.value='';if(!f||player||!NAV_BANDS.some(b=>b[1].some(t=>t[0]===k)))return;try{const url=await readImage(f);if(!url)throw Error('Неверный формат изображения');const img=new Image();await new Promise((ok,fail)=>{img.onload=ok;img.onerror=()=>fail(Error('Не удалось декодировать изображение'));img.src=url});if(player)return;const c=document.createElement('canvas');c.width=c.height=128;const size=Math.min(img.width,img.height);c.getContext('2d').drawImage(img,(img.width-size)/2,(img.height-size)/2,size,size,0,0,128,128);S.settings.navIcons[k]=c.toDataURL('image/png');commit();editNavIcons();toast('Иконка сохранена')}catch(err){toast(err.message)}};
function visibleDiplomacy(r){const a=faction(r.a),b=faction(r.b);return !!a&&!!b&&visibleFaction(a)&&visibleFaction(b)&&(!player||!r.hidden)}
function dipInfo(r){return DIP_STATES.find(x=>x[0]===r.state)||DIP_STATES[2]}
function factionDiplomacy(f){const rows=S.diplomacy.filter(r=>(r.a===f.id||r.b===f.id)&&visibleDiplomacy(r));return `<details class="aff-roster"><summary>Дипломатия · ${rows.length}</summary><div class="dip-list">${rows.map(r=>{const other=faction(r.a===f.id?r.b:r.a),d=dipInfo(r);return `<div class="dip-mini"><button class="ghost" onclick="focusFaction(${jsid(other.id)})">${esc(other.name)}</button><button onclick="openDiplomacy(${jsid(r.id)})" style="color:${d[2]}">${d[1]}${!player&&r.hidden?' · скрыто':''}</button></div>`}).join('')||'<small>Отношения пока не определены.</small>'}</div><div class="actions"><button class="ghost" onclick="showFactionDiplomacy(${jsid(f.id)})">Все отношения →</button>${!player?`<button onclick="editDiplomacy(null,${jsid(f.id)})">＋ Связь</button>`:''}</div></details>`}
function showFactionDiplomacy(id){closeModal();dipFaction=id;dipStatus='';switchTab('diplomacy')}
function renderDiplomacy(){const fs=S.factions.filter(visibleFaction);if(!fs.some(f=>f.id===dipFaction))dipFaction='';const rows=S.diplomacy.filter(r=>visibleDiplomacy(r)&&(!dipFaction||r.a===dipFaction||r.b===dipFaction)&&(!dipStatus||r.state===dipStatus));$('main').innerHTML=`<div class="screen">${header('Дипломатия','Отношения фракций между собой. Не влияют автоматически на репутацию Вольной компании.',!player?'<div class="actions"><button onclick="seedDiplomacy()">Исходные отношения мира</button><button class="primary" onclick="editDiplomacy()">＋ Отношение</button></div>':'')}<div class="card dip-filter"><label>Фракция<select onchange="dipFaction=this.value;renderDiplomacy()"><option value="">Все фракции</option>${fs.map(f=>`<option value="${esc(f.id)}" ${f.id===dipFaction?'selected':''}>${esc(f.name)}</option>`).join('')}</select></label><label>Тип отношений<select onchange="dipStatus=this.value;renderDiplomacy()"><option value="">Все типы</option>${DIP_STATES.map(d=>`<option value="${d[0]}" ${d[0]===dipStatus?'selected':''}>${d[1]}</option>`).join('')}</select></label></div><div class="cards">${rows.map(r=>{const a=faction(r.a),b=faction(r.b),d=dipInfo(r);return `<article class="card dip-card"><div class="dip-pair"><button class="ghost" onclick="focusFaction(${jsid(a.id)})">${esc(a.icon||'⚑')} ${esc(a.name)}</button><span class="muted">↔</span><button class="ghost" onclick="focusFaction(${jsid(b.id)})">${esc(b.icon||'⚑')} ${esc(b.name)}</button></div><div class="dip-state" style="color:${d[2]}">${d[1]}${!player&&r.hidden?' · скрыто':''}</div><p>${esc(r.desc||'Без комментария')}</p><small>${r.day!=null?'День '+esc(r.day)+' · '+esc(r.year||S.company.year)+'-й год':''}</small><div class="actions"><button onclick="openDiplomacy(${jsid(r.id)})">Подробнее</button>${!player?`<button onclick="editDiplomacy(${jsid(r.id)})">Изменить</button>`:''}</div></article>`}).join('')||'<div class="empty">Нет определённых отношений по выбранным фильтрам.</div>'}</div></div>`}
function openDiplomacy(id){const r=S.diplomacy.find(x=>x.id===id);if(!r||!visibleDiplomacy(r))return;const d=dipInfo(r);openModal(faction(r.a).name+' ↔ '+faction(r.b).name,`<div class="stack"><h3 style="color:${d[2]}">${d[1]}</h3><p class="record-body">${esc(r.desc||'Без комментария')}</p>${!player&&r.notes?`<div class="notice">Мастер: ${esc(r.notes)}</div>`:''}<div class="actions">${!player?`<button onclick="editDiplomacy(${jsid(id)})">Изменить</button>`:''}<button onclick="closeModal()">Закрыть</button></div></div>`)}
function editDiplomacy(id=null,first=''){if(player)return;if(S.factions.length<2)return toast('Нужны хотя бы две фракции');const r=id?S.diplomacy.find(x=>x.id===id):{a:first||dipFaction||S.factions[0].id,b:'',state:'neutral',desc:'',notes:'',hidden:false};if(!r)return;const opts=S.factions.map(f=>[f.id,f.name]);openModal(id?'Изменить отношения':'Новые дипломатические отношения',`<form id="dipForm">${selectField('Первая фракция','dipA',opts,r.a)}${selectField('Вторая фракция','dipB',[['','Выберите фракцию'],...opts],r.b)}${selectField('Отношения','dipState',DIP_STATES.map(x=>[x[0],x[1]]),r.state)}${area('Общее описание','dipDesc',r.desc)}${area('Скрытые заметки мастера','dipNotes',r.notes)}${check('Скрыть всё отношение от игроков','dipHidden',r.hidden)}${id?`<button type="button" class="ghost danger" onclick="deleteDiplomacy(${jsid(id)})">Удалить связь</button>`:''}${controls()}</form>`);$('dipForm').onsubmit=e=>{e.preventDefault();const a=val('dipA'),b=val('dipB');if(!faction(a)||!faction(b)||a===b)return toast('Выберите две разные фракции');if(S.diplomacy.some(x=>x.id!==id&&pairKey(a,b)===pairKey(x.a,x.b)))return toast('Отношения этой пары уже существуют');const obj={...r,id:id||uid(),a,b,state:val('dipState'),desc:val('dipDesc'),notes:val('dipNotes'),hidden:$('dipHidden').checked,day:S.company.day,year:S.company.year};if(id)Object.assign(r,obj);else S.diplomacy.push(obj);log('faction','Дипломатия: '+faction(a).name+' ↔ '+faction(b).name,dipInfo(obj)[1]+(obj.desc?' · '+obj.desc:''),obj.hidden||faction(a).hidden||faction(b).hidden);closeModal();commit()}}
function deleteDiplomacy(id){if(player||!confirm('Удалить дипломатическую связь?'))return;S.diplomacy=S.diplomacy.filter(r=>r.id!==id);closeModal();commit()}
function seedDiplomacy(){if(player||!confirm('Добавить известные отношения из хронологии мира? Уже созданные связи не будут перезаписаны.'))return;const presets=[['f1','f9','war','Война на истощение между Северной Лигой и Плетью.'],['f0','f3','hostility','Монархия против республики.'],['f2','f3','hostility','Дипломатический разрыв после революции.'],['f2','f0','alliance','Союзничество с противоречиями.'],['f4','f5','truce','Хрупкий мир после Калимдорской войны.'],['f4','f6','tension','Территориальные противоречия.'],['f2','f14','hostility','Скрытое противостояние.'],['f11','f16','hostility','Историческая вражда.'],['f17','f3','cooperation','Сотрудничество на фоне противостояния Стромгарду.']];let count=0;for(const [a,b,state,desc] of presets){if(!faction(a)||!faction(b)||faction(a).name!==FACTIONS[+a.slice(1)]?.[0]||faction(b).name!==FACTIONS[+b.slice(1)]?.[0]||S.diplomacy.some(r=>pairKey(r.a,r.b)===pairKey(a,b)))continue;S.diplomacy.push({id:uid(),a,b,state,desc,notes:'',hidden:a==='f14'||b==='f14',day:S.company.day,year:S.company.year});count++}commit();toast('Добавлено связей: '+count)}

let newsFilter='all',achievementFilter='all';
function renameCompany(){if(player)return;openModal('Переименовать отряд',`<form id="renameForm">${field('Название отряда','renameName',S.company.name,'text','required')}${controls('Сохранить название')}</form>`);$('renameForm').onsubmit=e=>{e.preventDefault();const v=val('renameName').trim();if(!v)return;S.company.name=v;closeModal();commit()}}
function renameHero(id){if(player)return;const m=S.company.members.find(x=>x.id===id);if(!m)return;openModal('Переименовать персонажа',`<form id="renameForm">${field('Имя персонажа','renameName',m.name,'text','required')}${controls('Сохранить имя')}</form>`);$('renameForm').onsubmit=e=>{e.preventDefault();const v=val('renameName').trim();if(!v)return;m.name=v;closeModal();commit()}}
function prepareAchievements(data){for(const x of data.portal?.achievements||[]){if(!Array.isArray(x.grants))x.grants=x.earned?[{recipient:'company',date:x.earnedDate||'',name:data.company.name}]:[];const used=new Set();x.grants=x.grants.filter(g=>g&&typeof g.recipient==='string'&&!used.has(g.recipient)&&used.add(g.recipient));const cg=x.grants.find(g=>g.recipient==='company');x.earned=!!cg;x.earnedDate=cg?.date||''}return data}
function recipientRecord(key){if(key==='company')return null;const idx=key.indexOf(':');return allCharacters().find(x=>x.kind===key.slice(0,idx)&&x.record.id===key.slice(idx+1))}
function recipientName(key,fallback=''){if(key==='company')return S.company.name;return recipientRecord(key)?.name||fallback||'Бывший персонаж'}
function recipientVisible(key){if(key==='company')return true;const r=recipientRecord(key);return !r||!r.record.hidden}
function recipientOptions(){return [['company',S.company.name+' (отряд)'],...allCharacters().filter(x=>!x.record.archived&&(!player||!x.record.hidden)).map(x=>[x.kind+':'+x.record.id,x.name+' · '+({hero:'герой',staff:'специалист',npc:'NPC'}[x.kind])])]}
function hasGrant(x,key){return (x.grants||[]).some(g=>g.recipient===key)}
function visibleGrants(x){return (x.grants||[]).filter(g=>recipientVisible(g.recipient)&&(g.recipient==='company'||recipientRecord(g.recipient)||!g.recipientHidden))}
function shownGrants(x){return (player?visibleGrants(x):(x.grants||[])).filter(g=>achievementFilter==='all'||g.recipient===achievementFilter)}
function grantAchievement(x,key){if(hasGrant(x,key))return false;const name=recipientName(key);(x.grants??=[]).push({recipient:key,date:dayLabel(),name,recipientHidden:!recipientVisible(key)});if(key==='company'){x.earned=true;x.earnedDate=dayLabel()}log('achievement','Достижение: '+x.title,`${name} · ${x.body||''}`,!!x.hidden||!recipientVisible(key));return true}
function achievementSummary(x){const gs=shownGrants(x);return `<p>${gs.length?'Получено: '+gs.map(g=>esc(recipientName(g.recipient,g.name))).join(', '):'Не получено'} · ${n(x.points)} очков</p>`}
function achievementDetail(x){const gs=player?visibleGrants(x):(x.grants||[]);return `<div class="rule"><h3>Получатели · ${n(x.points)} очков каждому</h3>${gs.map(g=>`<div class="row"><strong>${esc(recipientName(g.recipient,g.name))}</strong><small>${esc(g.date||'')}</small>${!player?`<button class="ghost danger" onclick="revokeAchievement(${jsid(x.id)},${jsid(g.recipient)})">Отозвать</button>`:''}</div>`).join('')||'<p class="muted">Пока не получено.</p>'}${!player?`<button class="primary" onclick="awardAchievement(${jsid(x.id)})">Вручить достижение</button>`:''}</div>`}
function revokeAchievement(id,key){if(player)return;const x=portalData().achievements.find(x=>x.id===id);if(!x||!hasGrant(x,key))return;const auto=key==='company'&&x.auto;if(!confirm(auto?'Отозвать достижение и отключить его автоматическую выдачу?':'Отозвать это достижение у получателя?'))return;if(auto)x.auto='';x.grants=x.grants.filter(g=>g.recipient!==key);prepareAchievements(S);log('achievement','Достижение отозвано: '+x.title,recipientName(key),!!x.hidden||!recipientVisible(key));commit();openPortalRecord('achievements',id)}
function personAchievements(kind,id){const key=kind+':'+id;const a=(S.portal?.achievements||[]).filter(x=>hasGrant(x,key)&&(!player||published('achievements',x)));return `<div class="row person-ach"><button class="ghost" onclick="openPersonalAchievements(${jsid(key)})">★ Достижения: ${a.length}</button><small>${a.reduce((sum,x)=>sum+n(x.points),0)} очк.</small></div>`}
function openPersonalAchievements(key){closeModal();achievementFilter=key;switchTab('achievements')}
function renderPortal(k){if(k==='news')return renderNewsFeed();if(k==='achievements')return renderAchievements();return renderPortalGeneric(k)}
function renderNewsFeed(){const q=searchText.toLowerCase();const items=['news','rumors'].filter(k=>newsFilter==='all'||newsFilter===k).flatMap(k=>portalData()[k].filter(x=>seen(k,x)).map(x=>({k,x}))).filter(({x})=>!q||[x.title,x.body,x.category,x.source].some(v=>String(v||'').toLowerCase().includes(q))).sort((a,b)=>n(b.x.year)-n(a.x.year)||n(b.x.day)-n(a.x.day));$('main').innerHTML=`<div class="screen">${header('Вестник Азерота','Новости мира, официальные сообщения, сплетни и свидетельства путешественников.',!player?'<div class="actions"><button class="primary" onclick="editPortal(\'news\')">＋ Новость</button><button onclick="editPortal(\'rumors\')">＋ Слух</button></div>':'')}<div class="row feed-tabs" style="margin-bottom:15px">${[['all','Всё'],['news','Новости'],['rumors','Слухи']].map(([key,l])=>`<button class="${newsFilter===key?'primary':'ghost'}" onclick="newsFilter='${key}';renderNewsFeed()">${l} · ${portalData()[key==='all'?'news':key].filter(x=>seen(key==='all'?'news':key,x)).length+(key==='all'?portalData().rumors.filter(x=>seen('rumors',x)).length:0)}</button>`).join('')}</div><div class="row" style="margin-bottom:15px"><input class="search" id="portalSearch" value="${esc(searchText)}" placeholder="Поиск по Вестнику"><small>${items.length} записей</small></div><div class="cards portal-cards">${items.map(({k,x})=>portalCard(k,x)).join('')||'<div class="empty">Здесь пока нет записей.</div>'}</div></div>`;bindPortalSearch(renderNewsFeed)}
function bindPortalSearch(fn){$('portalSearch').oninput=e=>{searchText=e.target.value;const pos=e.target.selectionStart;fn();$('portalSearch').focus();$('portalSearch').setSelectionRange(pos,pos)}}
function renderAchievements(){const opts=[['all','Все получатели'],...recipientOptions()];if(!opts.some(([key])=>key===achievementFilter))achievementFilter='all';const visible=portalData().achievements.filter(x=>seen('achievements',x)&&(!player||!x.secret||shownGrants(x).length));const q=searchText.toLowerCase();const items=visible.filter(x=>!q||[x.title,x.body,x.category,...shownGrants(x).map(g=>recipientName(g.recipient,g.name))].some(v=>String(v||'').toLowerCase().includes(q))).sort((a,b)=>Number(!!shownGrants(b).length)-Number(!!shownGrants(a).length));const earned=visible.filter(x=>shownGrants(x).length),grants=earned.reduce((sum,x)=>sum+shownGrants(x).length,0),points=earned.reduce((sum,x)=>sum+n(x.points)*shownGrants(x).length,0);$('main').innerHTML=`<div class="screen">${header('Достижения','Личные и общие подвиги. Одно достижение можно вручить разным получателям.',!player?'<button class="primary" onclick="editPortal(\'achievements\')">＋ Достижение</button>':'')}<div class="row ach-filter">${selectField('Получатель','achRecipient',opts,achievementFilter)}<small>Выберите отряд или конкретного персонажа.</small></div><div class="home-stats achievement-stats"><div><small>Открыто достижений</small><strong>${earned.length} / ${visible.length}</strong></div><div><small>Всего вручений</small><strong>${grants}</strong></div><div><small>Очки достижений${achievementFilter==='all'?' (сумма)':''}</small><strong>${points}</strong></div></div>${!player?'<div class="row" style="margin-bottom:12px"><button onclick="seedAchievements()">Добавить стартовые шаблоны</button><small>Автоматические условия — для отряда; личные награды вручную.</small></div>':''}<div class="row" style="margin-bottom:15px"><input class="search" id="portalSearch" value="${esc(searchText)}" placeholder="Поиск достижений"><small>${items.length} записей</small></div><div class="cards portal-cards ach-grid">${items.map(x=>portalCard('achievements',x)).join('')||'<div class="empty">Здесь пока нет записей.</div>'}</div></div>`;$('achRecipient').onchange=e=>{achievementFilter=e.target.value;renderAchievements()};bindPortalSearch(renderAchievements)}

const UX_LABEL={node:'Место',route:'Маршрут',faction:'Фракция',hero:'Герой',staff:'Специалист',people:'Персонаж мира',news:'Новость',rumors:'Слух',codex:'Кодекс',mail:'Письмо',chronicle:'Летопись',achievements:'Достижение',contract:'Задание',item:'Предмет',chapter:'Глава',journal:'Журнал',diplomacy:'Дипломатия'};
let uxLast=null,uxUndo=[],uxRedo=[],uxRead={},uxPopupQueue=[],uxPopupTimer=null;
const uxClone=x=>typeof structuredClone==='function'?structuredClone(x):JSON.parse(JSON.stringify(x));
function uxPrepare(){S.settings??={};S.settings.ux??={};const u=S.settings.ux;u.id??=uid();u.favorites=Array.isArray(u.favorites)?u.favorites:[];u.audit=Array.isArray(u.audit)?u.audit.slice(0,100):[];u.cover= safeImage(u.cover)||'';for(const c of S.worldBook.chapters)c.uxid??=uid();return u}
function uxRecords(includeArchived=false){const rows=[];const add=(k,x,name,desc='',allowed=true,id=x.id)=>{if(!allowed||(!includeArchived&&x.archived)||player&&x.archived||typeof id!=='string')return;rows.push({k,id,x,name:String(name||'Без названия'),desc:String(desc||''),key:k+':'+id})};
 S.nodes.forEach(x=>add('node',x,x.name,x.desc,visibleNode(x)));S.routes.forEach(x=>add('route',x,routeLabel(x),x.desc,visibleRoute(x)));S.factions.forEach(x=>add('faction',x,x.name,x.desc,visibleFaction(x)));S.company.members.forEach(x=>add('hero',x,memberName(x),x.bio,!player||!x.hidden));S.company.staff.forEach(x=>add('staff',x,x.name,x.desc,!player||!x.hidden));for(const [k,list] of Object.entries(portalData()))if(Array.isArray(list))list.forEach(x=>add(k,x,x.title,[x.body,x.source,x.category].filter(Boolean).join(' · '),!player||published(k,x)));S.contracts.forEach(x=>add('contract',x,x.title,[x.desc,questGiver(x)].join(' · '),!player||!x.hidden));S.company.inventory.forEach(x=>add('item',x,x.name,x.desc,!player||!x.hidden));S.worldBook.chapters.forEach(x=>add('chapter',x,x.title,x.text,true,x.uxid));S.journal.forEach(x=>add('journal',x,x.title,x.text,!player||!x.hidden));S.diplomacy.forEach(x=>add('diplomacy',x,(faction(x.a)?.name||'')+' ↔ '+(faction(x.b)?.name||''),x.desc,visibleDiplomacy(x)));return rows}
function uxFind(k,id,arch=false){return uxRecords(arch).find(r=>r.k===k&&r.id===id)}
function uxOpen(k,id){const r=uxFind(k,id);if(!r)return;closeModal();switch(k){case'node':{const d=dims();if(!view)resetView();view.x=r.x.x*d.w-view.w/2;view.y=r.x.y*d.h-view.h/2;selected={type:'node',id};switchTab('map');break}case'route':selected={type:'route',id};switchTab('map');break;case'faction':focusFaction(id);break;case'hero':case'staff':openAffPerson(k,id);uxDetailExtras(k,id);break;case'contract':openMapQuest(id);break;case'item':openItem(id);uxDetailExtras(k,id);break;case'chapter':bookPage=S.worldBook.chapters.findIndex(x=>x.uxid===id);switchTab('worldbook');break;case'journal':openModal(r.name,`<p class="muted">${esc(portalDate(r.x))}</p><p class="record-body">${esc(r.x.text)}</p>`);break;case'diplomacy':openDiplomacy(id);break;default:openPortalRecord(k,id)}}
function uxBtn(k,id,label){return `<button class="ghost ux-link" onclick="uxOpen(${jsid(k)},${jsid(id)})">${esc(label)} ↗</button>`}
function uxFavorite(k,id){const r=uxFind(k,id);if(!r)return;const u=uxPrepare();u.favorites=u.favorites.includes(r.key)?u.favorites.filter(v=>v!==r.key):[...u.favorites,r.key];save();uxToolbar();document.querySelectorAll('[data-ux-fav]').forEach(b=>{if(b.dataset.uxFav===r.key)b.textContent=u.favorites.includes(r.key)?'★ В избранном':'☆ В избранное'});toast(u.favorites.includes(r.key)?'Добавлено в избранное':'Удалено из избранного')}
function uxFavButton(k,id){const key=k+':'+id;return `<button class="ghost" data-ux-fav="${esc(key)}" onclick="uxFavorite(${jsid(k)},${jsid(id)})">${uxPrepare().favorites.includes(key)?'★ В избранном':'☆ В избранное'}</button>`}
function uxSearch(){openModal('Поиск по Атласу',`<input id="uxQuery" type="search" placeholder="Имя, место, квест, предмет, текст…" autocomplete="off"><div id="uxResults" class="ux-results"></div>`);$('uxQuery').oninput=uxSearchResults;uxSearchResults()}
function uxSearchResults(){const q=$('uxQuery').value.trim().toLocaleLowerCase('ru'),all=uxRecords(),matches=q?all.filter(r=>(r.name+' '+r.desc+' '+UX_LABEL[r.k]).toLocaleLowerCase('ru').includes(q)).sort((a,b)=>Number(b.name.toLowerCase().includes(q))-Number(a.name.toLowerCase().includes(q))):all.filter(r=>uxPrepare().favorites.includes(r.key));$('uxResults').innerHTML=`<small>${q?'Найдено: '+matches.length:'Избранное · введите запрос для поиска по всему Атласу'}</small>`+matches.slice(0,100).map(uxResult).join('')+(matches.length>100?'<p class="muted">Уточните запрос: показаны первые 100.</p>':'')+(!matches.length?'<p class="muted">Нет результатов.</p>':'')}
function uxResult(r){return `<div class="ux-result"><button class="ux-result-open" onclick="uxOpen(${jsid(r.k)},${jsid(r.id)})"><small>${esc(UX_LABEL[r.k]||r.k)}</small><strong>${esc(r.name)}</strong>${r.desc?`<span>${esc(r.desc.slice(0,130))}</span>`:''}</button>${uxFavButton(r.k,r.id)}</div>`}

function applyCommand(source, actor, name, payload, key){
  const cmd=commands.get(name);
  requireThat(actor&&cmd,'Неизвестная команда');
  requireThat(actor.role==='master'||(cmd.access==='hero'&&owned(actor,payload.hero)),'Недостаточно прав');

  const next=structuredClone(source);
  cmd.run(next,payload,actor);
  next.engine.receipts.push({key,name,actor:actor.nick,hero:payload.hero,day:next.company.day});
  return next;
}

function inside(x,y,points){
  let hit=false;
  for(let i=0,j=points.length-1;i<points.length;j=i++){
    const [a,b]=points[i],[c,d]=points[j];
    if((b>y)!==(d>y)&&x<(c-a)*(y-b)/(d-b)+a)hit=!hit;
  }return hit;
}

function economy(s){
  const e=foundation(s);
  for(const k of ['items','recipes','ingredients','loot','projects'])e[k]??=[];
  e.professions??=structuredClone(rulebook.professions);e.gathering??=structuredClone(rulebook.gathering);
  for(const stack of s.company.inventory||[]){
    if(stack.item_id)continue;
    stack.item_id='legacy-'+stack.id;e.items.push({id:stack.item_id,name:stack.name,category:stack.category,quality:stack.quality,icon:stack.icon,image:stack.image,desc:stack.desc,hidden:stack.hidden,value_gp:0});
  }return e;
}
function byId(rows,id){const x=rows.find(r=>r.id===id);requireThat(x,'Не найдена запись '+id);return x}
function eligibleProfession(s,h,id){
  const p=byId(economy(s).professions,id);
  return (!p.skill||!!h.skills[p.skill])&&(!p.tools?.length||p.tools.some(t=>h.tools.includes(t)));
}
function deposit(s,item_id,owner,qty,extra={}){
  integer(qty,1);const item=byId(economy(s).items,item_id),bag=s.company.inventory;
  const existing=bag.find(x=>x.item_id===item_id&&x.owner===owner&&!x.properties&&!extra.properties&&!!x.hidden===!!(extra.hidden??item.hidden));
  if(existing&&item.stackable!==false){existing.qty=integer(existing.qty+qty);return}
  bag.push({...item,...extra,id:crypto.randomUUID(),owner,item_id,qty});
}
function take(s,item,owner,amount){
  integer(amount,1);const rows=s.company.inventory.filter(x=>x.item_id===item&&x.owner===owner&&!x.properties);
  requireThat(rows.reduce((n,x)=>n+x.qty,0)>=amount,'Недостаточно материалов');
  for(const row of rows){const use=Math.min(row.qty,amount);row.qty-=use;amount-=use}
  s.company.inventory=s.company.inventory.filter(x=>x.qty>0);
}
register('transfer','hero',(s,p)=>{
  const row=byId(s.company.inventory,p.stack),from='member:'+p.hero;
  requireThat(row.owner===from,'Чужая сумка');integer(p.qty,1,row.qty);
  if(p.to)heroOf(s,p.to);
  const owner=p.to?'member:'+p.to:'';
  if(owner===from){requireThat(p.qty<row.qty,'Для разделения укажите часть стопки');s.company.inventory.push({...row,id:crypto.randomUUID(),qty:p.qty})}
  else deposit(s,row.item_id,owner,p.qty,{properties:row.properties,hidden:row.hidden});
  row.qty-=p.qty;s.company.inventory=s.company.inventory.filter(x=>x.qty);

function gather(s,p,die=dice){

  e.rolls.unshift({...check,hero:p.hero,label:prof.name});
  const matches=rows.filter(r=>check.total-check.dc>=r.min_margin);
  if(matches.length){
    const margin=Math.max(...matches.map(r=>r.min_margin)),pool=matches.filter(r=>r.min_margin===margin);
    let weight=die(pool.reduce((n,r)=>n+r.weight,0));const row=pool.find(r=>(weight-=r.weight)<=0);
    const qty=Math.min(row.stock??Infinity,row.min_quantity+die(row.max_quantity-row.min_quantity+1)-1);
